function mat(c,r=.8){
  return new THREE.MeshStandardMaterial({
    color:c,
    roughness:r
  });
}

function cube(w,h,d,c){
  const m=new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    mat(c)
  );

  m.castShadow=true;
  m.receiveShadow=true;

  return m;
}

function collider(
  x,
  z,
  w,
  d,
  owner=null
){
  colliders.push({
    x:x,
    z:z,
    w:w,
    d:d,
    owner:owner
  });
}

function blocked(
  x,
  z,
  radius=.55,
  ignore=null
){

  for(const c of colliders){

    if(c.owner===ignore){
      continue;
    }

    const dx=Math.max(
      Math.abs(x-c.x)-c.w/2,
      0
    );

    const dz=Math.max(
      Math.abs(z-c.z)-c.d/2,
      0
    );

    if(
      dx*dx+dz*dz<
      radius*radius
    ){
      return true;
    }
  }

  return false;
}

function road(
  x,
  z,
  w,
  d
){

  const r=cube(
    w,
    .04,
    d,
    0x292929
  );

  r.position.set(
    x,
    .02,
    z
  );

  scene.add(r);

  if(w>d){

    for(
      let p=x-w/2+8;
      p<x+w/2;
      p+=16
    ){

      const line=cube(
        7,
        .045,
        .2,
        0xd7c64d
      );

      line.position.set(
        p,
        .05,
        z
      );

      scene.add(line);
    }

  }else{

    for(
      let p=z-d/2+8;
      p<z+d/2;
      p+=16
    ){

      const line=cube(
        .2,
        .045,
        7,
        0xd7c64d
      );

      line.position.set(
        x,
        .05,
        p
      );

      scene.add(line);
    }
  }
}

function validZombie(x,z){

  if(
    Math.abs(x)<18&&
    Math.abs(z)<18
  ){
    return false;
  }

  for(const h of houses){

    if(
      Math.hypot(
        x-h.x,
        z-h.z
      )<11
    ){
      return false;
    }
  }

  for(const c of cars){

    if(
      Math.hypot(
        x-c.group.position.x,
        z-c.group.position.z
      )<7
    ){
      return false;
    }
  }

  return !blocked(
    x,
    z,
    1
  );
}

async function loadCharacter(){

  if(!GLTFLoader){
    return;
  }

  try{

    const loader=
      new GLTFLoader();

    const gltf=
      await loader.loadAsync(
        "https://threejs.org/examples/models/gltf/Soldier.glb"
      );

    const model=gltf.scene;

    model.traverse(o=>{

      if(o.isMesh){

        o.castShadow=true;
        o.receiveShadow=true;
      }
    });

    const b=
      new THREE.Box3()
      .setFromObject(model);

    const size=
      b.getSize(
        new THREE.Vector3()
      );

    const scale=
      1.8/
      Math.max(size.y,.001);

    model.scale.setScalar(
      scale
    );

    const b2=
      new THREE.Box3()
      .setFromObject(model);

    const center=
      b2.getCenter(
        new THREE.Vector3()
      );

    model.position.x=
      -center.x;

    model.position.z=
      -center.z;

    model.position.y=
      -b2.min.y;

    player.remove(
      playerModel
    );

    playerModel=model;

    player.add(
      playerModel
    );

    if(gltf.animations.length){

      mixer=
        new THREE.AnimationMixer(
          playerModel
        );

      for(
        const clip of gltf.animations
      ){

        actions[
          clip.name
        ]=
          mixer.clipAction(
            clip
          );
      }

      const idle=
        Object.keys(actions)
        .find(n=>
          n.toLowerCase()
          .includes("idle")
        );

      if(idle){

        currentAction=
          actions[idle];

        currentAction.play();
      }
    }

  }catch(e){

    console.log(
      "GLB gagal, fallback tetap dipakai:",
      e
    );
  }
}

function animateAction(
  type
){

  if(!mixer){
    return;
  }

  const names=
    type==="run"
    ?["Run","run"]
    :type==="walk"
    ?["Walk","walk"]
    :["Idle","idle"];

  let next=null;

  for(const wanted of names){

    const key=
      Object.keys(actions)
      .find(n=>
        n.toLowerCase()===
        wanted.toLowerCase()
      );

    if(key){
      next=actions[key];
      break;
    }
  }

  if(
    !next||
    next===currentAction
  ){
    return;
  }

  if(currentAction){
    currentAction.fadeOut(.15);
  }

  next.reset();
  next.fadeIn(.15);
  next.play();

  currentAction=next;
}

function move(){

  let x=joyX;
  let y=joyY;

  if(keys.w||keys.arrowup){
    y=-1;
  }

  if(keys.s||keys.arrowdown){
    y=1;
  }

  if(keys.a||keys.arrowleft){
    x=-1;
  }

  if(keys.d||keys.arrowright){
    x=1;
  }

  const len=
    Math.hypot(x,y);

  if(len<.08){

    animateAction("idle");

    return;
  }

  x/=len;
  y/=len;

  const speed=
    sprinting
    ?8
    :crouching
    ?2.3
    :5;

  const forwardX=
    -Math.sin(yaw);

  const forwardZ=
    -Math.cos(yaw);

  const rightX=
    Math.cos(yaw);

  const rightZ=
    -Math.sin(yaw);

  const mx=
    rightX*x+
    forwardX*(-y);

  const mz=
    rightZ*x+
    forwardZ*(-y);

  const dt=
    Math.min(
      clock.getDelta(),
      .033
    );

  const nx=
    player.position.x+
    mx*speed*dt;

  const nz=
    player.position.z+
    mz*speed*dt;

  if(
    !blocked(
      nx,
      player.position.z
    )
  ){
    player.position.x=nx;
  }

  if(
    !blocked(
      player.position.x,
      nz
    )
  ){
    player.position.z=nz;
  }

  if(
    Math.abs(mx)+
    Math.abs(mz)>.01
  ){

    player.rotation.y=
      Math.atan2(
        mx,
        mz
      );
  }

  animateAction(
    sprinting
    ?"run"
    :"walk"
  );
}

function jumpPlayer(){

  if(
    grounded&&
    !activeCar
  ){

    jumpVelocity=8;
    grounded=false;
  }
}

function action(){

  if(actionCooldown>0){
    return;
  }

  actionCooldown=.5;

  if(activeCar){
    return;
  }

  let target=null;
  let distance=3;

  for(const z of zombies){

    const d=
      player.position.distanceTo(
        z.group.position
      );

    if(d<distance){

      distance=d;
      target=z;
    }
  }

  if(target){

    const dx=
      target.group.position.x-
      player.position.x;

    const dz=
      target.group.position.z-
      player.position.z;

    const len=
      Math.hypot(dx,dz)||1;

    target.group.position.x+=
      dx/len*1.2;

    target.group.position.z+=
      dz/len*1.2;

    return;
  }

  for(let i=0;i<pickups.length;i++){

    const d=
      player.position.distanceTo(
        pickups[i].position
      );

    if(d<2.5){

      hunger=
        Math.min(
          100,
          hunger+20
        );

      scene.remove(
        pickups[i]
      );

      pickups.splice(i,1);

      return;
    }
  }

  for(const c of cars){

    if(
      player.position.distanceTo(
        c.group.position
      )<4.8
    ){

      enterCar(c);

      return;
    }
  }
}

function enterCar(c){

  if(activeCar){
    return;
  }

  activeCar=c;

  player.visible=false;

  document.getElementById(
    "enter"
  ).style.display="none";

  document.getElementById(
    "exit"
  ).style.display="block";

  document.getElementById(
    "status"
  ).textContent=
    "DI DALAM MOBIL";
}

function exitCar(){

  if(!activeCar){
    return;
  }

  const c=activeCar;

  player.visible=true;

  player.position.set(
    c.group.position.x+
    Math.sin(
      c.group.rotation.y
    )*5,

    0,

    c.group.position.z+
    Math.cos(
      c.group.rotation.y
    )*5
  );

  activeCar=null;

  document.getElementById(
    "enter"
  ).style.display="block";

  document.getElementById(
    "exit"
  ).style.display="none";

  document.getElementById(
    "status"
  ).textContent=
    "BERJALAN";
}

function drive(){

  if(!activeCar){
    return;
  }

  const c=activeCar;

  let throttle=0;

  if(
    keys.w||
    keys.arrowup||
    joyY<-.15
  ){
    throttle=1;
  }

  if(
    keys.s||
    keys.arrowdown||
    joyY>.15
  ){
    throttle=-.7;
  }

  c.speed+=
    throttle*.035;

  c.speed*=.985;

  c.speed=
    THREE.MathUtils.clamp(
      c.speed,
      -.55,
      1.3
    );

  let steer=0;

  if(
    keys.a||
    keys.arrowleft||
    joyX<-.2
  ){
    steer=1;
  }

  if(
    keys.d||
    keys.arrowright||
    joyX>.2
  ){
    steer=-1;
  }

  c.group.rotation.y+=
    steer*
    .035*
    Math.min(
      Math.abs(c.speed)*1.4,
      1
    );

  const fx=
    Math.sin(
      c.group.rotation.y
    );

  const fz=
    Math.cos(
      c.group.rotation.y
    );

  const nx=
    c.group.position.x+
    fx*c.speed;

  const nz=
    c.group.position.z+
    fz*c.speed;

  if(
    !blocked(
      nx,
      nz,
      2,
      c.group
    )
  ){

    c.group.position.x=nx;
    c.group.position.z=nz;

  }else{

    c.speed*=-.2;
  }
}

function updateZombies(dt){

  for(const z of zombies){

    const dx=
      player.position.x-
      z.group.position.x;

    const dz=
      player.position.z-
      z.group.position.z;

    const d=
      Math.hypot(dx,dz);

    if(
      d>2.2&&
      d<65
    ){

      const nx=dx/d;
      const nz=dz/d;

      const sx=
        z.group.position.x+
        nx*z.speed*dt;

      const sz=
        z.group.position.z+
        nz*z.speed*dt;

      if(
        !blocked(
          sx,
          z.group.position.z,
          .5
        )
      ){
        z.group.position.x=sx;
      }

      if(
        !blocked(
          z.group.position.x,
          sz,
          .5
        )
      ){
        z.group.position.z=sz;
      }

      z.group.rotation.y=
        Math.atan2(
          nx,
          nz
        );
    }

    z.attack-=dt;

    if(
      d<2.3&&
      z.attack<=0
    ){

      hp=
        Math.max(
          0,
          hp-7
        );

      z.attack=1.1;

      player.position.x+=
        dx/(d||1)*.6;

      player.position.z+=
        dz/(d||1)*.6;
    }
  }
}

function updateCamera(){

  const target=
    activeCar
    ?activeCar.group.position.clone()
    :player.position.clone();

  target.y+=
    activeCar
    ?1.15
    :crouching
    ?.85
    :1.05;

  const horizontal=
    Math.cos(pitch)*
    cameraDistance;

  const desired=
    new THREE.Vector3(
      target.x+
      Math.sin(yaw)*
      horizontal,

      target.y+
      Math.sin(pitch)*
      cameraDistance,

      target.z+
      Math.cos(yaw)*
      horizontal
    );

  const direction=
    desired.clone()
    .sub(target)
    .normalize();

  const ray=
    new THREE.Raycaster(
      target,
      direction,
      .2,
      cameraDistance
    );

  const hits=
    ray.intersectObjects(
      scene.children,
      true
    );

  let finalDistance=
    cameraDistance;

  for(const hit of hits){

    if(
      hit.object===ground||
      hit.object===playerModel
    ){
      continue;
    }

    if(hit.distance<finalDistance){

      finalDistance=
        Math.max(
          1.15,
          hit.distance-.3
        );

      break;
    }
  }

  camera.position.copy(
    target.clone().add(
      direction.multiplyScalar(
        finalDistance
      )
    )
  );

  camera.lookAt(target);
}

function hud(){

  document.getElementById(
    "hpFill"
  ).style.width=
    hp+"%";

  document.getElementById(
    "foodFill"
  ).style.width=
    hunger+"%";

  let nearby=false;

  for(const z of zombies){

    if(
      player.position.distanceTo(
        z.group.position
      )<3
    ){
      nearby=true;
      break;
    }
  }

  document.getElementById(
    "action"
  ).textContent=
    nearby
    ?"👊"
    :"👊";
}

const keys={};

addEventListener(
  "keydown",
  e=>{
    keys[
      e.key.toLowerCase()
    ]=true;

    if(e.key===" "){
      jumpPlayer();
    }

    if(
      e.key.toLowerCase()==="c"
    ){
      crouching=!crouching;
    }

    if(
      e.key.toLowerCase()==="shift"
    ){
      sprinting=true;
    }

    if(
      e.key.toLowerCase()==="e"
    ){
      action();
    }
  }
);

addEventListener(
  "keyup",
  e=>{

    keys[
      e.key.toLowerCase()
    ]=false;

    if(
      e.key.toLowerCase()==="shift"
    ){
      sprinting=false;
    }
  }
);

const joystick=
  document.getElementById(
    "joystick"
  );

const stick=
  document.getElementById(
    "stick"
  );

let pointer=null;

function joystickMove(x,y){

  const r=
    joystick.getBoundingClientRect();

  const cx=
    r.left+r.width/2;

  const cy=
    r.top+r.height/2;

  let dx=x-cx;
  let dy=y-cy;

  const max=48;

  const len=
    Math.hypot(dx,dy);

  if(len>max){

    dx=dx/len*max;
    dy=dy/len*max;
  }

  stick.style.transform=
    "translate("+dx+"px,"+dy+"px)";

  joyX=dx/max;
  joyY=dy/max;
}

function joystickReset(){

  pointer=null;

  stick.style.transform=
    "translate(0,0)";

  joyX=0;
  joyY=0;
}

joystick.addEventListener(
  "pointerdown",
  e=>{

    pointer=e.pointerId;

    joystick.setPointerCapture(
      e.pointerId
    );

    joystickMove(
      e.clientX,
      e.clientY
    );
  }
);

joystick.addEventListener(
  "pointermove",
  e=>{

    if(
      e.pointerId===pointer
    ){

      joystickMove(
        e.clientX,
        e.clientY
      );
    }
  }
);

joystick.addEventListener(
  "pointerup",
  joystickReset
);

joystick.addEventListener(
  "pointercancel",
  joystickReset
);

renderer.domElement.addEventListener(
  "pointerdown",
  e=>{

    if(
      e.clientX<
      innerWidth*.4
    ){
      return;
    }

    cameraDrag=true;

    lastX=e.clientX;
    lastY=e.clientY;
  }
);

renderer.domElement.addEventListener(
  "pointermove",
  e=>{

    if(!cameraDrag){
      return;
    }

    const dx=
      e.clientX-lastX;

    const dy=
      e.clientY-lastY;

    lastX=e.clientX;
    lastY=e.clientY;

    yaw-=dx*.006;
    pitch-=dy*.005;

    pitch=
      THREE.MathUtils.clamp(
        pitch,
        -1.05,
        .8
      );
  }
);

renderer.domElement.addEventListener(
  "pointerup",
  ()=>{
    cameraDrag=false;
  }
);

renderer.domElement.addEventListener(
  "pointercancel",
  ()=>{
    cameraDrag=false;
  }
);

document.getElementById(
  "jump"
).addEventListener(
  "pointerdown",
  jumpPlayer
);

document.getElementById(
  "crouch"
).addEventListener(
  "pointerdown",
  ()=>{
    crouching=!crouching;
  }
);

document.getElementById(
  "sprint"
).addEventListener(
  "pointerdown",
  ()=>{
    sprinting=true;
  }
);

document.getElementById(
  "sprint"
).addEventListener(
  "pointerup",
  ()=>{
    sprinting=false;
  }
);

document.getElementById(
  "sprint"
).addEventListener(
  "pointercancel",
  ()=>{
    sprinting=false;
  }
);

document.getElementById(
  "action"
).addEventListener(
  "pointerdown",
  action
);

document.getElementById(
  "enter"
).addEventListener(
  "pointerdown",
  ()=>{
    for(const c of cars){

      if(
        player.position.distanceTo(
          c.group.position
        )<4.8
      ){

        enterCar(c);
        return;
      }
    }
  }
);

document.getElementById(
  "exit"
).addEventListener(
  "pointerdown",
  exitCar
);

document.getElementById(
  "fullscreen"
).addEventListener(
  "click",
  async()=>{

    try{

      if(
        !document.fullscreenElement
      ){

        await document
          .documentElement
          .requestFullscreen();

      }else{

        await document.exitFullscreen();
      }

    }catch(e){}
  }
);

document.getElementById(
  "exit"
).style.display="none";

function update(dt){

  if(activeCar){

    drive();

  }else{

    move();

    jumpVelocity-=
      20*dt;

    player.position.y+=
      jumpVelocity*dt;

    if(
      player.position.y<=0
    ){

      player.position.y=0;
      jumpVelocity=0;
      grounded=true;
    }
  }

  updateZombies(dt);
  updateCamera();
  hud();

  actionCooldown=
    Math.max(
      0,
      actionCooldown-dt
    );
}

function loop(){

  requestAnimationFrame(loop);

  const dt=
    Math.min(
      clock.getDelta(),
      .033
    );

  if(mixer){
    mixer.update(dt);
  }

  update(dt);

  renderer.render(
    scene,
    camera
  );
}

addEventListener(
  "resize",
  ()=>{
    camera.aspect=
      innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );
  }
);

document.getElementById(
  "loading"
).style.display="none";

loop();

</script>

</body>
</html>
