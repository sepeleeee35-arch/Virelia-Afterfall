let insideBuilding=null;

let grounded=true;
let crouching=false;

const PLAYER_RADIUS=.52;

function currentPlayerHeight(){

return crouching
?2.55
:3.15;

}

function circleRect(
x,z,
radius,
cx,cz,
w,d
){

const nearestX=
Math.max(
cx-w/2,
Math.min(
x,
cx+w/2
)
);

const nearestZ=
Math.max(
cz-d/2,
Math.min(
z,
cz+d/2
)
);

return Math.hypot(
x-nearestX,
z-nearestZ
)<radius;

}

function canPassTraversal(
obj,x,z
){

if(
!circleRect(
x,z,
PLAYER_RADIUS,
obj.x,obj.z,
obj.w,obj.d
)
){
return true;
}

if(
obj.type==="low"
){

if(
!grounded &&
player.position.y>
obj.height+.18
){
return true;
}

return false;

}

if(
obj.type==="overhead"
){

return currentPlayerHeight()<=
obj.clearance;

}

return false;

}

if(

const b=c.building;

if(
x>b.x-b.w/2-1 &&
x<b.x+b.w/2+1 &&
z>b.z-b.d/2-1 &&
z<b.z+b.d/2+1
){

const nearDoor=
Math.abs(x-b.x)<2.5 &&
Math.abs(
z-(b.z-b.d/2)
)<2.8;

if(!nearDoor){
return true;
}

}

}

if(
c.type==="tree"
){

if(
Math.hypot(
x-c.x,
z-c.z
)<c.r+PLAYER_RADIUS
){
return true;
}

}

if(
c.type==="traversal"
){

if(
!canPassTraversal(
c.object,x,z
)
){
return true;
}

}

if(
c.type==="car"
){

if(c.car===ignoreCar)
continue;

if(
Math.hypot(
x-c.car.group.position.x,
z-c.car.group.position.z
)<4
){
return true;
}

}

}

return false;

}

function blockedInside(
x,z
){

const b=insideBuilding;

if(!b)
return false;

if(
x<b.x-b.w/2+1.2||
x>b.x+b.w/2-1.2||
z<b.z-b.d/2+1.2||
z>b.z+b.d/2-1.2
){
return true;
}

for(
const f of b.furniture
){

if(
x>f.x-f.w/2-.5 &&
x<f.x+f.w/2+.5 &&
z>f.z-f.d/2-.5 &&
z<f.z+f.d/2+.5
){
return true;
}

}

return false;

}

function blocked(
x,z,
ignoreCar=null
){

return insideBuilding
?blockedInside(x,z)
:blockedOutside(
x,z,ignoreCar
);

}

let joyX=0;
let joyY=0;
let joyPointer=null;

const joy=
document.getElementById("joy");

const knob=
document.getElementById("knob");

function updateJoystick(x,y){

const r=
joy.getBoundingClientRect();

let dx=
x-(r.left+r.width/2);

let dy=
y-(r.top+r.height/2);

const max=46;

const len=
Math.hypot(dx,dy);

if(len>max){

dx=dx/len*max;
dy=dy/len*max;

}

knob.style.transform=
`translate(${dx}px,${dy}px)`;

joyX=dx/max;
joyY=dy/max;

}

joy.addEventListener(
"pointerdown",
e=>{
joyPointer=e.pointerId;
joy.setPointerCapture(
e.pointerId
);
updateJoystick(
e.clientX,e.clientY
);
}
);

joy.addEventListener(
"pointermove",
e=>{
if(
e.pointerId===joyPointer
){
updateJoystick(
e.clientX,e.clientY
);
}
}
);

function resetJoystick(){

joyPointer=null;
joyX=0;
joyY=0;

knob.style.transform=
"translate(0,0)";

}

joy.addEventListener(
"pointerup",
resetJoystick
);

joy.addEventListener(
"pointercancel",
resetJoystick
);

let yaw=0;
let pitch=.18;

let targetYaw=0;
let targetPitch=.18;

let cameraDragging=false;
let cameraPointer=null;

let lastX=0;
let lastY=0;

renderer.domElement.addEventListener(
"pointerdown",
e=>{

if(
e.clientX<
innerWidth*.38
){
return;
}

cameraDragging=true;

cameraPointer=
e.pointerId;

lastX=e.clientX;
lastY=e.clientY;

renderer.domElement.setPointerCapture(
e.pointerId
);

}
);

renderer.domElement.addEventListener(
"pointermove",
e=>{

if(
!cameraDragging||
e.pointerId!==cameraPointer
){
return;
}

const dx=
e.clientX-lastX;

const dy=
e.clientY-lastY;

lastX=e.clientX;
lastY=e.clientY;

targetYaw-=dx*.011;

targetPitch-=dy*.008;

targetPitch=
THREE.MathUtils.clamp(
targetPitch,
-1.25,
1.15
);

}
);

renderer.domElement.addEventListener(
"pointerup",
e=>{

if(
e.pointerId===cameraPointer
){

cameraDragging=false;
cameraPointer=null;

}

}
);

renderer.domElement.addEventListener(
"pointercancel",
e=>{

if(
e.pointerId===cameraPointer
){

cameraDragging=false;
cameraPointer=null;

}

}
);

const keys={};

addEventListener(
"keydown",
e=>{

keys[
e.key.toLowerCase()
]=true;

if(e.code==="Space"){
e.preventDefault();
jump();
}

if(
e.key.toLowerCase()==="c"
){
toggleCrouch();
}

if(
e.key.toLowerCase()==="e"
){
doInteract();
}

}
);

addEventListener(
"keyup",
e=>{
keys[
e.key.toLowerCase()
]=false;
}
);

function movementInput(){

let x=joyX;
let y=joyY;

if(
keys.a||
keys.arrowleft
){
x=-1;
}

if(
keys.d||
keys.arrowright
){
x=1;
}

if(
keys.w||
keys.arrowup
){
y=-1;
}

if(
keys.s||
keys.arrowdown
){
y=1;
}

return{x,y};

}

function jump(){

if(
activeCar||
!grounded||
crouching
){
return;
}

verticalVelocity=7.2;
grounded=false;

}

function toggleCrouch(){

if(
activeCar||
!grounded
){
return;
}

crouching=!crouching;

document.getElementById(
"crouch"
).textContent=
crouching
?"BERDIRI"
:"JONGKOK";

}

function updateVertical(dt){

if(!grounded){

verticalVelocity-=18*dt;

player.position.y+=
verticalVelocity*dt;

if(
player.position.y<=0
){

player.position.y=0;
verticalVelocity=0;
grounded=true;

}

}

const targetY=
crouching?.56:.68;

player.scale.y=
THREE.MathUtils.lerp(
player.scale.y,
targetY,
1-Math.pow(.00001,dt)
);

}

function movePlayer(dt){

const input=
movementInput();

const magnitude=
Math.hypot(
input.x,input.y
);

if(
magnitude<.05
){
return;
}

const forward=
new THREE.Vector3(
-Math.sin(yaw),
0,
-Math.cos(yaw)
);

const right=
new THREE.Vector3(
Math.cos(yaw),
0,
-Math.sin(yaw)
);

const direction=
forward
.multiplyScalar(-input.y)
.add(
right.multiplyScalar(input.x)
);

direction.normalize();

let speed=
insideBuilding?5.8:8;

if(crouching){
speed*=.52;
}

const nx=
player.position.x+
direction.x*speed*dt;

const nz=
player.position.z+
direction.z*speed*dt;

if(
!blocked(
nx,
player.position.z
)
){
player.position.x=nx;
}

if(
!blocked(
player.position.x,
nz
)
){
player.position.z=nz;
}

player.rotation.y=
Math.atan2(
direction.x,
direction.z
);

}

function driveCar(dt){

if(!activeCar)
return;

const car=
activeCar;

const input=
movementInput();

const throttle=
-input.y;

const steering=
input.x;

const acceleration=
throttle>0
?26
:throttle<0
?34
:0;

if(
throttle!==0
){

car.speed+=
throttle*
acceleration*
dt;

}else{

car.speed*=
Math.pow(
.18,
dt
);

}

car.speed=
THREE.MathUtils.clamp(
car.speed,
-10,
28
);

const steeringPower=
THREE.MathUtils.clamp(
Math.abs(car.speed)/7,
.18,
1
);

if(
Math.abs(car.speed)>.4
){

car.group.rotation.y-=
steering*
steeringPower*
2.1*
dt*
(car.speed>=0?1:-1);

}

const direction=
new THREE.Vector3(
Math.sin(
car.group.rotation.y
),
0,
Math.cos(
car.group.rotation.y
)
);

const nx=
car.group.position.x+
direction.x*
car.speed*
dt;

const nz=
car.group.position.z+
direction.z*
car.speed*
dt;

if(
!blockedOutside(
nx,nz,car
)
){

car.group.position.x=nx;
car.group.position.z=nz;

}else{

car.speed*=-.18;

}

}

function updateZombies(dt){

if(activeCar||insideBuilding)
return;

for(
const zombie of zombies
){

if(
zombie.userData.stun>0
){

zombie.userData.stun-=dt;
continue;

}

const dx=
player.position.x-
zombie.position.x;

const dz=
player.position.z-
zombie.position.z;

const distance=
Math.hypot(dx,dz);

if(
distance>4&&
distance<100
){

const speed=1.45;

const nx=
zombie.position.x+
dx/distance*
speed*dt;

const nz=
zombie.position.z+
dz/distance*
speed*dt;

if(
!blockedOutside(nx,nz)
){

zombie.position.set(
nx,0,nz
);

}

zombie.rotation.y=
Math.atan2(dx,dz);

}

}

}

let punchTimer=0;
let punchCooldown=0;

function nearestZombie(){

let best=null;
let distance=3.2;

for(
const zombie of zombies
){

if(
zombie.userData.stun>0
)
continue;

const d=
Math.hypot(
player.position.x-zombie.position.x,
player.position.z-zombie.position.z
);

if(d<distance){

distance=d;
best=zombie;

}

}

return best;

}

function punch(){

if(
activeCar||
punchCooldown>0
)
return;

const zombie=
nearestZombie();

if(!zombie)
return;

punchCooldown=.55;
punchTimer=.28;

const dx=
zombie.position.x-
player.position.x;

const dz=
zombie.position.z-
player.position.z;

const d=
Math.hypot(dx,dz)||1;

const nx=
zombie.position.x+
dx/d*3;

const nz=
zombie.position.z+
dz/d*3;

if(
!blockedOutside(nx,nz)
){

zombie.position.set(
nx,0,nz
);

}

zombie.userData.hp--;
zombie.userData.stun=.65;

showMessage(
zombie.userData.hp<=0
?"ZOMBIE TUMBANG"
:"PUKUL"
);

if(
zombie.userData.hp<=0
){

setTimeout(
()=>{

const i=
zombies.indexOf(zombie);

if(i!==-1){

scene.remove(zombie);
zombies.splice(i,1);

}

},
350
);

}

}

function updatePunch(dt){

if(punchCooldown>0)
punchCooldown-=dt;

if(punchTimer>0){

punchTimer-=dt;

const t=
1-punchTimer/.28;

playerArmR.rotation.z=
-.15+
Math.sin(t*Math.PI)*1.8;

}else{

playerArmR.rotation.z=-.15;

}

}

function nearestSupply(){

let best=null;
let distance=2.8;

for(
const item of supplies
){

if(item.taken)
continue;

const d=
Math.hypot(
player.position.x-
item.group.position.x,
player.position.z-
item.group.position.z
);

if(d<distance){

distance=d;
best=item;

}

}

return best;

}

let supplyCount=0;

function takeSupply(item){

item.taken=true;

scene.remove(
item.group
);

supplyCount++;

document.getElementById(
"supplies"
).textContent=
supplyCount;

showMessage(
"SUPPLY DIAMBIL"
);

}

function nearestCar(){

let best=null;
let distance=5.5;

for(
const car of cars
){

if(car.driving)
continue;

const d=
Math.hypot(
player.position.x-
car.group.position.x,
player.position.z-
car.group.position.z
);

if(d<distance){

distance=d;
best=car;

}

}

return best;

}

function nearestBuilding(){

let best=null;
let distance=4.5;

for(
const b of buildings
){

const doorZ=
b.z-b.d/2-1;

const d=
Math.hypot(
player.position.x-b.x,
player.position.z-doorZ
);

if(d<distance){

distance=d;
best=b;

}

}

return best;

}

function nearInsideDoor(){

if(!insideBuilding)
return false;

const b=
insideBuilding;

return Math.hypot(
player.position.x-b.x,
player.position.z-
(b.z-b.d/2+2.2)
)<3;

}

function showMessage(text){

const msg=
document.getElementById("msg");

msg.textContent=text;
msg.style.opacity=1;

clearTimeout(
showMessage.timer
);

showMessage.timer=
setTimeout(
()=>{
msg.style.opacity=0;
},
1200
);

}

function enterCar(car){

activeCar=car;

car.driving=true;

player.visible=false;

car.speed=0;

targetYaw=
car.group.rotation.y;

document.getElementById(
"drive"
).style.display="block";

showMessage(
"SIAP MENYETIR"
);

}

function exitCar(){

if(!activeCar)
return;

const car=
activeCar;

const side=
new THREE.Vector3(
3.8,0,0
);

side.applyAxisAngle(
new THREE.Vector3(0,1,0),
car.group.rotation.y
);

const x=
car.group.position.x+side.x;

const z=
car.group.position.z+side.z;

if(
!blockedOutside(
x,z,car
)
){

player.position.set(
x,0,z
);

player.visible=true;

car.driving=false;
car.speed=0;

activeCar=null;

document.getElementById(
"drive"
).style.display="none";

showMessage(
"KELUAR MOBIL"
);

}else{

showMessage(
"JALAN KELUAR TERHALANG"
);

}

}

function enterBuilding(b){

insideBuilding=b;

b.inside=true;

player.position.set(
b.x,
0,
b.z-b.d/2+3.5
);

targetYaw=0;

showMessage(
"MASUK RUMAH"
);

}

function exitBuilding(){

const b=
insideBuilding;

if(!b)
return;

if(
!nearInsideDoor()
){

showMessage(
"DEKATI PINTU"
);

return;

}

insideBuilding=null;

b.inside=false;

player.position.set(
b.x,
0,
b.z-b.d/2-3.5
);

showMessage(
"KELUAR RUMAH"
);

}

function updateActionButton(){

const button=
document.getElementById(
"interact"
);

if(activeCar){

button.innerHTML=
"🚪<br>KELUAR";

return;

}

if(insideBuilding){

if(nearInsideDoor()){

button.innerHTML=
"🚪<br>KELUAR";

}else{

button.innerHTML=
"👊<br>TINJU";

}

return;

}

if(nearestZombie()){

button.innerHTML=
"👊<br>PUKUL";

return;

}

if(nearestSupply()){

button.innerHTML=
"📦<br>AMBIL";

return;

}

if(nearestCar()){

button.innerHTML=
"🚗<br>MASUK";

return;

}

if(nearestBuilding()){

button.innerHTML=
"🚪<br>MASUK";

return;

}

button.innerHTML=
"👊<br>TINJU";

}

function doInteract(){

if(activeCar){

exitCar();
return;

}

if(insideBuilding){

if(nearInsideDoor()){

exitBuilding();
return;

}

const item=
nearestSupply();

if(item){

takeSupply(item);
return;

}

punch();
return;

}

const zombie=
nearestZombie();

if(zombie){

punch();
return;

}

const item=
nearestSupply();

if(item){

takeSupply(item);
return;

}

const car=
nearestCar();

if(car){

enterCar(car);
return;

}

const building=
nearestBuilding();

if(building){

enterBuilding(building);
return;

}

}

document
.getElementById("interact")
.addEventListener(
"pointerdown",
e=>{
e.preventDefault();
doInteract();
}
);

document
.getElementById("jump")
.addEventListener(
"pointerdown",
e=>{
e.preventDefault();
jump();
}
);

document
.getElementById("crouch")
.addEventListener(
"pointerdown",
e=>{
e.preventDefault();
toggleCrouch();
}
);

document
.getElementById("drive")
.addEventListener(
"pointerdown",
e=>{
e.preventDefault();
exitCar();
}
);

document
.getElementById("fs")
.addEventListener(
"click",
async()=>{
try{

if(!document.fullscreenElement){

await document
.documentElement
.requestFullscreen();

}else{

await document.exitFullscreen();

}

}catch(e){}

}
);

const raycaster=
new THREE.Raycaster();

function updateCamera(dt){

const target=
activeCar
?activeCar.group.position
:player.position;

yaw=
THREE.MathUtils.lerp(
yaw,
targetYaw,
1-Math.pow(.0005,dt)
);

pitch=
THREE.MathUtils.lerp(
pitch,
targetPitch,
1-Math.pow(.0005,dt)
);

const distance=
activeCar
?14
:12.8;

const focusHeight=
activeCar
?1.8
:crouching
?1.4
:2.15;

const cp=
Math.cos(pitch);

const desired=
new THREE.Vector3(
target.x+
Math.sin(yaw)*cp*distance,
target.y+
focusHeight+
Math.sin(pitch)*distance,
target.z+
Math.cos(yaw)*cp*distance
);

const lookOrigin=
new THREE.Vector3(
target.x,
target.y+focusHeight,
target.z
);

const direction=
desired.clone()
.sub(lookOrigin);

const wantedDistance=
direction.length();

direction.normalize();

raycaster.set(
lookOrigin,
direction
);

raycaster.far=
wantedDistance;

const hits=
raycaster.intersectObjects(
cameraMeshes,
true
);

let finalDistance=
wantedDistance;

for(
const hit of hits
){

if(
hit.distance>.15 &&
hit.distance<finalDistance
){

finalDistance=
Math.max(
.75,
hit.distance-.4
);

break;

}

}

const safePosition=
lookOrigin.clone()
.add(
direction.multiplyScalar(
finalDistance
)
);

safePosition.y=
Math.max(
.8,
safePosition.y
);

camera.position.lerp(
safePosition,
1-Math.pow(.00008,dt)
);

camera.lookAt(
lookOrigin
);

}

let previous=
performance.now();

function animate(now){

const dt=
Math.min(
.033,
(now-previous)/1000
);

previous=now;

if(activeCar){

driveCar(dt);

}else{

movePlayer(dt);

}

updateVertical(dt);
updatePunch(dt);
updateZombies(dt);
updateActionButton();
updateCamera(dt);

renderer.render(
scene,
camera
);

requestAnimationFrame(
animate
);

}

requestAnimationFrame(
animate
);

addEventListener(
"resize",
()=>{

camera.aspect=
innerWidth/innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
innerWidth,
innerHeight
);

}
);

</script>
