<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Virelia: Afterfall</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#101820;
  font-family:Arial,Helvetica,sans-serif;
}
canvas{
  display:block;
  width:100%;
  height:100%;
  touch-action:none;
}

#hud{
  position:fixed;
  inset:0;
  pointer-events:none;
  color:white;
}

/* TOP LEFT */
#playerCard{
  position:absolute;
  top:12px;
  left:12px;
  width:190px;
  padding:9px 11px;
  border-radius:12px;
  background:rgba(10,15,18,.72);
  border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(5px);
}
#playerName{
  font-size:13px;
  font-weight:bold;
}
#hpOuter,#staminaOuter{
  height:7px;
  margin-top:6px;
  background:#263038;
  border-radius:8px;
  overflow:hidden;
}
#hp{
  height:100%;
  width:100%;
  background:#55d66f;
}
#stamina{
  height:100%;
  width:100%;
  background:#d7d95b;
}

/* TOP CENTER */
#zoneInfo{
  position:absolute;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  padding:7px 15px;
  border-radius:15px;
  background:rgba(10,15,18,.72);
  border:1px solid rgba(255,255,255,.1);
  font-size:12px;
  text-align:center;
}

/* TOP RIGHT */
#rightHud{
  position:absolute;
  right:12px;
  top:12px;
  display:flex;
  gap:9px;
  align-items:flex-start;
}
#aliveBox{
  padding:9px 12px;
  border-radius:11px;
  background:rgba(10,15,18,.72);
  font-size:12px;
}
#miniWrap{
  width:150px;
  height:150px;
  border-radius:13px;
  overflow:hidden;
  border:2px solid rgba(255,255,255,.35);
  background:#17231e;
}
#mini{
  width:100%;
  height:100%;
}

/* CENTER */
#crosshair{
  position:absolute;
  left:50%;
  top:50%;
  width:20px;
  height:20px;
  transform:translate(-50%,-50%);
}
#crosshair:before,
#crosshair:after{
  content:"";
  position:absolute;
  background:rgba(255,255,255,.85);
}
#crosshair:before{
  width:2px;
  height:20px;
  left:9px;
  top:0;
}
#crosshair:after{
  width:20px;
  height:2px;
  left:0;
  top:9px;
}

/* LOOT */
#lootInfo{
  position:absolute;
  left:50%;
  bottom:120px;
  transform:translateX(-50%);
  min-width:170px;
  padding:9px 13px;
  text-align:center;
  border-radius:12px;
  background:rgba(8,12,15,.82);
  display:none;
  font-size:12px;
}

/* INVENTORY */
#inventory{
  position:absolute;
  right:180px;
  bottom:25px;
  width:210px;
  padding:10px;
  border-radius:12px;
  background:rgba(10,15,18,.8);
  display:none;
  font-size:12px;
}
.invTitle{
  font-weight:bold;
  margin-bottom:8px;
}
.invRow{
  display:flex;
  justify-content:space-between;
  padding:4px 0;
  border-bottom:1px solid rgba(255,255,255,.08);
}

/* JOYSTICK */
#joyArea{
  position:absolute;
  left:22px;
  bottom:25px;
  width:145px;
  height:145px;
  border-radius:50%;
  background:rgba(255,255,255,.08);
  border:2px solid rgba(255,255,255,.16);
}
#joyKnob{
  position:absolute;
  width:65px;
  height:65px;
  left:40px;
  top:40px;
  border-radius:50%;
  background:rgba(255,255,255,.24);
  border:2px solid rgba(255,255,255,.35);
}

/* ACTION BUTTONS */
#actions{
  position:absolute;
  right:18px;
  bottom:22px;
  width:180px;
  height:175px;
}
.action{
  position:absolute;
  width:62px;
  height:62px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.22);
  color:white;
  background:rgba(20,27,31,.75);
  font-size:11px;
  font-weight:bold;
  pointer-events:auto;
}
.action:active{
  transform:scale(.94);
  background:rgba(70,90,95,.9);
}
#btnAction{
  right:0;
  bottom:72px;
  width:72px;
  height:72px;
}
#btnJump{
  right:73px;
  bottom:105px;
}
#btnSprint{
  right:77px;
  bottom:26px;
}
#btnCrouch{
  right:0;
  bottom:5px;
}
#btnBag{
  right:150px;
  bottom:145px;
  width:45px;
  height:45px;
}

/* START */
#startScreen{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  justify-content:center;
  align-items:center;
  background:
    radial-gradient(circle at 50% 35%,rgba(73,105,91,.5),transparent 35%),
    linear-gradient(135deg,#0c1417,#1b2925);
  color:white;
}
.startBox{
  width:min(90%,390px);
  padding:28px;
  text-align:center;
  border-radius:18px;
  background:rgba(10,15,18,.86);
  border:1px solid rgba(255,255,255,.13);
}
.startTitle{
  font-size:27px;
  font-weight:900;
  letter-spacing:2px;
}
.startSub{
  margin-top:8px;
  color:#aebbb7;
  font-size:13px;
  line-height:1.5;
}
#startBtn{
  margin-top:22px;
  width:100%;
  padding:15px;
  border:0;
  border-radius:11px;
  color:white;
  background:#496e5c;
  font-size:15px;
  font-weight:bold;
}

/* MOBILE */
@media(max-width:700px){
  #miniWrap{
    width:115px;
    height:115px;
  }
  #aliveBox{
    display:none;
  }
  #playerCard{
    width:155px;
  }
  #zoneInfo{
    font-size:10px;
  }
  #inventory{
    right:10px;
    bottom:190px;
  }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">

  <div id="playerCard">
    <div id="playerName">SURVIVOR • 01</div>
    <div id="hpOuter"><div id="hp"></div></div>
    <div id="staminaOuter"><div id="stamina"></div></div>
  </div>

  <div id="zoneInfo">
    ZONA AMAN<br>
    <span id="zoneTimer">05:00</span>
  </div>

  <div id="rightHud">
    <div id="aliveBox">
      SURVIVOR<br>
      <b id="alive">70</b>
    </div>
    <div id="miniWrap">
      <canvas id="mini"></canvas>
    </div>
  </div>

  <div id="crosshair"></div>

  <div id="lootInfo"></div>

  <div id="inventory">
    <div class="invTitle">INVENTORY</div>
    <div class="invRow"><span>Medkit</span><span id="medCount">0</span></div>
    <div class="invRow"><span>Food</span><span id="foodCount">0</span></div>
    <div class="invRow"><span>Helmet</span><span id="helmetSlot">-</span></div>
    <div class="invRow"><span>Vest</span><span id="vestSlot">-</span></div>
    <div class="invRow"><span>Backpack</span><span id="bagSlot">-</span></div>
    <div class="invRow"><span>Shoes</span><span id="shoeSlot">-</span></div>
  </div>

  <div id="joyArea">
    <div id="joyKnob"></div>
  </div>

  <div id="actions">
    <button class="action" id="btnAction">ACTION</button>
    <button class="action" id="btnJump">JUMP</button>
    <button class="action" id="btnSprint">RUN</button>
    <button class="action" id="btnCrouch">CROUCH</button>
    <button class="action" id="btnBag">BAG</button>
  </div>

</div>

<div id="startScreen">
  <div class="startBox">
    <div class="startTitle">VIRELIA</div>
    <div class="startSub">
      AFTERFALL<br><br>
      LARGE SURVIVAL MAP<br>
      70 SURVIVORS
    </div>
    <button id="startBtn">MASUK MAP</button>
  </div>
</div>

<script>
/* =========================================================
   VIRELIA AFTERFALL
   LARGE BATTLE-SURVIVAL MAP
   ========================================================= */

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const mini=document.getElementById("mini");
const mctx=mini.getContext("2d");

let W=innerWidth;
let H=innerHeight;

function resize(){
  W=innerWidth;
  H=innerHeight;

  canvas.width=W;
  canvas.height=H;

  mini.width=mini.clientWidth*devicePixelRatio;
  mini.height=mini.clientHeight*devicePixelRatio;
}
addEventListener("resize",resize);
resize();

/* =========================================================
   WORLD
   ========================================================= */

const WORLD_W=12000;
const WORLD_H=10000;

const world={
  roads:[],
  buildings:[],
  trees:[],
  rocks:[],
  water:[],
  bridges:[],
  loot:[],
  vehicles:[],
  hills:[],
  zones:[]
};

/* seeded random */
let seed=77431;

function rnd(){
  seed=(seed*1664525+1013904223)>>>0;
  return seed/4294967296;
}

function rand(a,b){
  return a+rnd()*(b-a);
}

function clamp(v,a,b){
  return Math.max(a,Math.min(b,v));
}

function dist(a,b){
  return Math.hypot(a.x-b.x,a.y-b.y);
}

/* =========================================================
   TERRAIN
   ========================================================= */

function createTerrain(){

  /* hills */
  for(let i=0;i<45;i++){
    world.hills.push({
      x:rand(300,WORLD_W-300),
      y:rand(300,WORLD_H-300),
      r:rand(150,480),
      h:rand(20,100)
    });
  }

  /* rivers */
  world.water.push({
    points:[
      {x:0,y:4100},
      {x:1500,y:3900},
      {x:3000,y:4200},
      {x:4700,y:4000},
      {x:6500,y:4450},
      {x:8200,y:4200},
      {x:10000,y:4550},
      {x:12000,y:4300}
    ],
    width:240
  });

  world.water.push({
    points:[
      {x:7700,y:0},
      {x:7600,y:1400},
      {x:7850,y:2900},
      {x:7700,y:4400},
      {x:8000,y:6100},
      {x:7900,y:8000},
      {x:8200,y:10000}
    ],
    width:180
  });
}

/* =========================================================
   ROADS
   ========================================================= */

function addRoad(x1,y1,x2,y2,width=90){
  world.roads.push({x1,y1,x2,y2,width});
}

function createRoadNetwork(){

  /* MAIN HIGHWAYS */
  addRoad(0,2300,WORLD_W,2300,125);
  addRoad(0,6900,WORLD_W,6900,125);
  addRoad(2800,0,2800,WORLD_H,120);
  addRoad(9100,0,9100,WORLD_H,120);

  /* ring */
  addRoad(1400,1200,10400,1200,90);
  addRoad(1400,1200,1400,8500,90);
  addRoad(10400,1200,10400,8500,90);
  addRoad(1400,8500,10400,8500,90);

  /* city roads */
  for(let x=3300;x<=6500;x+=500){
    addRoad(x,2800,x,6500,58);
  }

  for(let y=3000;y<=6500;y+=500){
    addRoad(3100,y,6700,y,58);
  }

  /* industrial */
  for(let y=7600;y<=8400;y+=300){
    addRoad(7200,y,10300,y,55);
  }

  /* village */
  for(let x=900;x<=2500;x+=320){
    addRoad(x,2700,x,3900,45);
  }

  /* northern settlement */
  for(let x=3500;x<=6000;x+=420){
    addRoad(x,500,x,1800,48);
  }
}

/* =========================================================
   BUILDINGS
   ========================================================= */

function building(x,y,w,h,type,name){
  world.buildings.push({
    x,y,w,h,
    type:type||"house",
    name:name||"",
    roof:rand(0,1)
  });
}

function createPOI(){

  /* CENTRAL CITY */
  building(3400,3000,420,280,"large","Central Plaza");
  building(4000,3000,350,280,"large","Central Plaza");
  building(4550,3000,500,280,"large","Central Plaza");

  building(3400,3500,300,360,"large","Central City");
  building(3900,3500,440,360,"large","Central City");
  building(4500,3500,350,360,"large","Central City");
  building(5000,3500,450,360,"large","Central City");

  building(3400,4100,450,330,"large","Central City");
  building(4000,4100,330,330,"large","Central City");
  building(4500,4100,460,330,"large","Central City");
  building(5100,4100,400,330,"large","Central City");

  building(3400,4650,300,420,"large","Central City");
  building(3900,4650,450,420,"large","Central City");
  building(4500,4650,330,420,"large","Central City");
  building(5000,4650,500,420,"large","Central City");

  /* NORTH VILLAGE */
  for(let y=600;y<=1600;y+=360){
    for(let x=3500;x<=6000;x+=430){
      if(rnd()>.16){
        building(
          x+rand(-40,40),
          y+rand(-45,45),
          rand(190,280),
          rand(160,240),
          "house",
          "North Village"
        );
      }
    }
  }

  /* WEST VILLAGE */
  for(let y=2700;y<=3700;y+=320){
    for(let x=450;x<=2400;x+=380){
      if(rnd()>.12){
        building(
          x+rand(-40,40),
          y+rand(-40,40),
          rand(180,270),
          rand(150,230),
          "house",
          "West Village"
        );
      }
    }
  }

  /* EAST COAST TOWN */
  for(let y=2600;y<=3700;y+=350){
    for(let x=9600;x<=11200;x+=400){
      if(rnd()>.15){
        building(
          x+rand(-40,40),
          y+rand(-40,40),
          rand(190,300),
          rand(160,250),
          "house",
          "East Town"
        );
      }
    }
  }

  /* SOUTH INDUSTRIAL */
  for(let x=7200;x<=10300;x+=650){
    building(x,7550,500,300,"industrial","Industrial Zone");
    building(x,8000,500,250,"industrial","Industrial Zone");
  }

  /* SOUTHWEST COMPOUND */
  building(700,7300,500,420,"compound","Compound");
  building(1350,7300,500,420,"compound","Compound");
  building(2000,7300,500,420,"compound","Compound");

  building(700,7900,500,420,"compound","Compound");
  building(1350,7900,500,420,"compound","Compound");
  building(2000,7900,500,420,"compound","Compound");

  /* SOUTHEAST */
  for(let x=9300;x<=11200;x+=450){
    building(x,9000,300,230,"house","South Town");
  }
}

/* =========================================================
   TREES / ROCKS
   ========================================================= */

function createNature(){

  for(let i=0;i<420;i++){

    let x=rand(150,WORLD_W-150);
    let y=rand(150,WORLD_H-150);

    /* keep some city areas clearer */
    if(x>3000&&x<6800&&y>2600&&y<5400) continue;

    world.trees.push({
      x,y,
      r:rand(15,32),
      type:rnd()>.75?"pine":"tree"
    });
  }

  for(let i=0;i<180;i++){
    world.rocks.push({
      x:rand(100,WORLD_W-100),
      y:rand(100,WORLD_H-100),
      r:rand(8,25)
    });
  }
}

/* =========================================================
   VEHICLES
   ========================================================= */

function createVehicles(){

  for(let i=0;i<34;i++){

    let horizontal=rnd()>.5;

    if(horizontal){
      let y=rand(1500,8500);
      let x=rand(500,WORLD_W-500);

      world.vehicles.push({
        x,y,
        angle:0,
        occupied:false,
        type:rnd()>.65?"truck":"car"
      });

    }else{
      let x=rand(1200,10500);
      let y=rand(500,WORLD_H-500);

      world.vehicles.push({
        x,y,
        angle:Math.PI/2,
        occupied:false,
        type:rnd()>.65?"truck":"car"
      });
    }
  }
}

/* =========================================================
   LOOT
   ========================================================= */

const equipmentTypes=[
  "helmet",
  "vest",
  "backpack",
  "shoes"
];

function createLoot(){

  for(let i=0;i<240;i++){

    let b=world.buildings[
      Math.floor(rnd()*world.buildings.length)
    ];

    let type;

    let roll=rnd();

    if(roll<.22){
      type=equipmentTypes[
        Math.floor(rnd()*equipmentTypes.length)
      ];
    }else if(roll<.61){
      type="food";
    }else{
      type="medkit";
    }

    world.loot.push({
      x:b.x+rand(30,b.w-30),
      y:b.y+rand(30,b.h-30),
      type,
      taken:false
    });
  }
}

/* =========================================================
   ZONE
   ========================================================= */

const safeZone={
  x:6000,
  y:5000,
  radius:4700,
  target:4700,
  timer:300
};

function updateZone(dt){

  safeZone.timer-=dt;

  if(safeZone.timer<0){
    safeZone.target=Math.max(900,safeZone.target-650);
    safeZone.timer=70;
  }

  safeZone.radius +=
    (safeZone.target-safeZone.radius)*dt*.025;
}

/* =========================================================
   PLAYER
   ========================================================= */

const player={
  x:6000,
  y:5400,
  vx:0,
  vy:0,
  speed:250,
  hp:100,
  stamina:100,
  crouch:false,
  sprint:false,
  actionCooldown:0,

  equipment:{
    helmet:false,
    vest:false,
    backpack:false,
    shoes:false
  },

  inventory:{
    food:0,
    medkit:0
  }
};

/* =========================================================
   BOTS
   ========================================================= */

const bots=[];

function spawnBots(){

  bots.length=0;

  for(let i=0;i<69;i++){

    let x,y;

    do{
      x=rand(400,WORLD_W-400);
      y=rand(400,WORLD_H-400);
    }while(
      Math.hypot(x-player.x,y-player.y)<500
    );

    bots.push({
      id:i+1,
      x,y,
      vx:0,
      vy:0,
      hp:100,
      speed:rand(125,175),
      target:null,
      think:rand(.2,2),
      state:"wander",
      wanderX:x,
      wanderY:y,
      action:rand(0,3),
      alive:true,
      color:rnd()
    });
  }
}

/* =========================================================
   COLLISION
   ========================================================= */

function pointInsideBuilding(x,y,b,pad=0){

  return (
    x>b.x-pad &&
    x<b.x+b.w+pad &&
    y>b.y-pad &&
    y<b.y+b.h+pad
  );
}

function blocked(x,y,r=14){

  if(x<40||y<40||x>WORLD_W-40||y>WORLD_H-40)
    return true;

  for(const b of world.buildings){

    if(pointInsideBuilding(x,y,b,r))
      return true;
  }

  return false;
}

function moveEntity(e,dx,dy){

  let nx=e.x+dx;

  if(!blocked(nx,e.y,14))
    e.x=nx;

  let ny=e.y+dy;

  if(!blocked(e.x,ny,14))
    e.y=ny;
}

/* =========================================================
   CAMERA
   ========================================================= */

const camera={
  x:player.x,
  y:player.y,
  zoom:1.15,
  angle:0
};

/*
  Ini bukan kamera top-down biasa.
  Dunia diproyeksikan dengan sudut third-person
  supaya karakter terasa berada di bawah-tengah layar.
*/

function worldToScreen(x,y){

  const dx=x-camera.x;
  const dy=y-camera.y;

  const ca=Math.cos(camera.angle);
  const sa=Math.sin(camera.angle);

  const rx=dx*ca-dy*sa;
  const ry=dx*sa+dy*ca;

  const perspective=1-(ry/1800)*.18;

  return {
    x:W/2+rx*camera.zoom*perspective,
    y:H*.56+ry*.58*camera.zoom*perspective
  };
}

/* =========================================================
   DRAW TERRAIN
   ========================================================= */

function drawTerrain(){

  ctx.fillStyle="#6e8a55";
  ctx.fillRect(0,0,W,H);

  /* hills */
  for(const h of world.hills){

    const p=worldToScreen(h.x,h.y);

    const r=h.r*camera.zoom;

    ctx.beginPath();
    ctx.fillStyle="rgba(62,86,55,.35)";
    ctx.arc(p.x,p.y,r,0,Math.PI*2);
    ctx.fill();
  }

  /* water */
  for(const river of world.water){

    ctx.beginPath();

    river.points.forEach((q,i)=>{
      const p=worldToScreen(q.x,q.y);

      if(i===0)ctx.moveTo(p.x,p.y);
      else ctx.lineTo(p.x,p.y);
    });

    ctx.strokeStyle="#397a8a";
    ctx.lineWidth=river.width*camera.zoom*.72;
    ctx.lineCap="round";
    ctx.stroke();

    ctx.strokeStyle="rgba(180,230,235,.25)";
    ctx.lineWidth=5;
    ctx.stroke();
  }
}

/* =========================================================
   DRAW ROADS
   ========================================================= */

function drawRoads(){

  for(const r of world.roads){

    const a=worldToScreen(r.x1,r.y1);
    const b=worldToScreen(r.x2,r.y2);

    ctx.lineCap="butt";

    ctx.strokeStyle="#4d5550";
    ctx.lineWidth=r.width*camera.zoom;
    ctx.beginPath();
    ctx.moveTo(a.x,a.y);
    ctx.lineTo(b.x,b.y);
    ctx.stroke();

    ctx.strokeStyle="#6c746e";
    ctx.lineWidth=r.width*camera.zoom*.75;
    ctx.beginPath();
    ctx.moveTo(a.x,a.y);
    ctx.lineTo(b.x,b.y);
    ctx.stroke();

    /* road center line */
    ctx.strokeStyle="rgba(225,205,115,.7)";
    ctx.lineWidth=3;

    ctx.setLineDash([18,18]);

    ctx.beginPath();
    ctx.moveTo(a.x,a.y);
    ctx.lineTo(b.x,b.y);
    ctx.stroke();

    ctx.setLineDash([]);
  }
}

/* =========================================================
   DRAW BUILDINGS
   ========================================================= */

function drawBuildings(){

  for(const b of world.buildings){

    const p=worldToScreen(b.x+b.w/2,b.y+b.h/2);

    const sx=b.w*camera.zoom;
    const sy=b.h*camera.zoom*.65;

    /* shadow */
    ctx.fillStyle="rgba(0,0,0,.25)";
    ctx.fillRect(
      p.x-sx/2+8,
      p.y-sy/2+10,
      sx,
      sy
    );

    /* wall */
    if(b.type==="large"){
      ctx.fillStyle="#9b9d95";
    }else if(b.type==="industrial"){
      ctx.fillStyle="#777d79";
    }else if(b.type==="compound"){
      ctx.fillStyle="#a59a82";
    }else{
      ctx.fillStyle="#b4a88d";
    }

    ctx.fillRect(
      p.x-sx/2,
      p.y-sy/2,
      sx,
      sy
    );

    /* roof */
    ctx.fillStyle=
      b.type==="industrial"
      ?"#555c59"
      :"#55524b";

    ctx.beginPath();
    ctx.moveTo(
      p.x-sx/2,
      p.y-sy/2
    );
    ctx.lineTo(
      p.x,
      p.y-sy/2-sy*.18
    );
    ctx.lineTo(
      p.x+sx/2,
      p.y-sy/2
    );
    ctx.closePath();
    ctx.fill();

    /* windows */
    const count=Math.max(
      2,
      Math.floor(b.w/130)
    );

    for(let i=0;i<count;i++){

      const wx=
        p.x-sx/2+
        (i+.5)*(sx/count);

      ctx.fillStyle="#293d45";

      ctx.fillRect(
        wx-5,
        p.y-sy*.1,
        10,
        9
      );
    }
  }
}

/* =========================================================
   DRAW NATURE
   ========================================================= */

function drawNature(){

  for(const t of world.trees){

    const p=worldToScreen(t.x,t.y);
    const s=t.r*camera.zoom;

    /* shadow */
    ctx.fillStyle="rgba(0,0,0,.22)";
    ctx.beginPath();
    ctx.ellipse(
      p.x,
      p.y+7,
      s*.8,
      s*.35,

    );

    /* trunk */
    ctx.fillStyle="#67523d";
    ctx.fillRect(
      p.x-s*.13,
      p.y-s*.1,
      s*.26,
      s*.8
    );

    ctx.fillStyle=
      t.type==="pine"
      ?"#315b42"
      :"#3f6c43";

    ctx.beginPath();
    ctx.arc(
      p.x,
      p.y-s*.35,
      s,
      0,
      Math.PI*2
    );
    ctx.fill();
  }

  for(const r of world.rocks){

    const p=worldToScreen(r.x,r.y);

    ctx.fillStyle="#686e68";

    ctx.beginPath();
    ctx.arc(
      p.x,
      p.y,
      r.r*camera.zoom,
      0,
      Math.PI*2
    );
    ctx.fill();
  }
}

const keys={};

addEventListener("keydown",e=>{
  keys[e.key.toLowerCase()]=true;

  if(e.key.toLowerCase()==="e")
    action();
});

addEventListener("keyup",e=>{
  keys[e.key.toLowerCase()]=false;

let joyX=0;
let joyY=0;
let joyActive=false;

const joyArea=document.getElementById("joyArea");
const joyKnob=document.getElementById("joyKnob");

function updateJoy(x,y){

  const r=joyArea.getBoundingClientRect();

  const cx=r.left+r.width/2;
  const cy=r.top+r.height/2;

  let dx=x-cx;
  let dy=y-cy;

  const max=48;

  const len=Math.hypot(dx,dy);

  if(len>max){
    dx=dx/len*max;
    dy=dy/len*max;
  }

  joyX=dx/max;
  joyY=dy/max;

  joyKnob.style.transform=
    `translate(${dx}px,${dy}px)`;
}

joyArea.addEventListener("pointerdown",e=>{
  joyActive=true;
  joyArea.setPointerCapture(e.pointerId);
  updateJoy(e.clientX,e.clientY);
});

joyArea.addEventListener("pointermove",e=>{
  if(joyActive)
    updateJoy(e.clientX,e.clientY);
});

joyArea.addEventListener("pointerup",resetJoy);
joyArea.addEventListener("pointercancel",resetJoy);

function resetJoy(){
  joyActive=false;
  joyX=0;
  joyY=0;
  joyKnob.style.transform="translate(0,0)";
}

/* =========================================================
   ACTION
   ========================================================= */

function action(){

  /* pickup */
  let closest=null;
  let best=65;

  for(const l of world.loot){

    if(l.taken)continue;

    const d=Math.hypot(
      l.x-player.x,
      l.y-player.y
    );

    if(d<best){
      best=d;
      closest=l;
    }
  }

  if(closest){

    if(equipmentTypes.includes(closest.type)){

      /*
        EQUIPMENT LANGSUNG DIPAKAI.
        Kalau slot sudah terisi:
        loot tetap di tanah.
      */

      if(!player.equipment[closest.type]){

        player.equipment[closest.type]=true;
        closest.taken=true;

      }else{

        showLoot(
          closest.type.toUpperCase()+
          " SLOT SUDAH TERISI"
        );

        return;
      }

    }else{

      closest.taken=true;

      if(closest.type==="food")
        player.inventory.food++;

      if(closest.type==="medkit")
        player.inventory.medkit++;
    }

    updateInventory();
    return;
  }

  /* abstract close combat interaction */
  for(const b of bots){

    if(!b.alive)continue;

    const d=Math.hypot(
      b.x-player.x,
      b.y-player.y
    );

    if(d<90){

      b.hp-=35;

      if(b.hp<=0){
        b.hp=0;
        b.alive=false;
      }

      player.stamina=
        Math.max(0,player.stamina-5);

      return;
    }
  }
}

function showLoot(text){

  const box=document.getElementById("lootInfo");

  box.textContent=text;
  box.style.display="block";

  clearTimeout(showLoot.timer);

  showLoot.timer=setTimeout(()=>{
    box.style.display="none";
  },1000);
}

function updateInventory(){

  document.getElementById("medCount")
    .textContent=player.inventory.medkit;

  document.getElementById("foodCount")
    .textContent=player.inventory.food;

  document.getElementById("helmetSlot")
    .textContent=player.equipment.helmet?"EQUIPPED":"-";

  document.getElementById("vestSlot")
    .textContent=player.equipment.vest?"EQUIPPED":"-";

  document.getElementById("bagSlot")
    .textContent=player.equipment.backpack?"EQUIPPED":"-";

  document.getElementById("shoeSlot")
    .textContent=player.equipment.shoes?"EQUIPPED":"-";
}

/* =========================================================
   BOT AI
   ========================================================= */

function nearestSurvivor(bot){

  const candidates=[];

  /* player */
  const pd=Math.hypot(
    player.x-bot.x,
    player.y-bot.y
  );

  if(pd<900){
    candidates.push({
      entity:player,
      d:pd,
      player:true
    });
  }

  /* other bots */
  for(const other of bots){

    if(other===bot||!other.alive)
      continue;

    const d=Math.hypot(
      other.x-bot.x,
      other.y-bot.y
    );

    if(d<900){
      candidates.push({
        entity:other,
        d,
        player:false
      });
    }
  }

  if(!candidates.length)
    return null;

  /*
    IMPORTANT:
    bot tidak otomatis mengejar player.
    Kandidat bot lain mendapat peluang tinggi.
  */

  candidates.sort((a,b)=>a.d-b.d);

  const nearby=candidates.slice(
    0,
    Math.min(5,candidates.length)
  );

  if(nearby.length>1 && rnd()<.72){

    const botTargets=
      nearby.filter(x=>!x.player);

    if(botTargets.length){

      return botTargets[
        Math.floor(rnd()*botTargets.length)
      ].entity;
    }
  }

  return nearby[
    Math.floor(rnd()*nearby.length)
  ].entity;
}

function updateBots(dt){

  for(const b of bots){

    if(!b.alive)continue;

    b.think-=dt;

    if(b.think<=0){

      b.think=rand(.6,2.4);

      const target=nearestSurvivor(b);

      if(target){

        b.target=target;
        b.state="follow";

      }else{

        b.target=null;
        b.state="wander";

        b.wanderX=
          clamp(
            b.x+rand(-700,700),
            100,
            WORLD_W-100
          );

        b.wanderY=
          clamp(
            b.y+rand(-700,700),
            100,
            WORLD_H-100
          );
      }
    }

    let tx=b.wanderX;
    let ty=b.wanderY;

    if(
      b.target &&
      (!b.target.alive || b.target.hp<=0)
    ){
      b.target=null;
      b.state="wander";
    }

    if(b.target){

      tx=b.target.x;
      ty=b.target.y;

      const d=Math.hypot(
        tx-b.x,
        ty-b.y
      );

      /* abstract attack distance */
      if(d<75){

        b.action-=dt;

        if(b.action<=0){

          b.action=rand(1.5,3.5);

          if(b.target===player){

            player.hp=
              Math.max(
                0,
                player.hp-4
              );

          }else{

            b.target.hp=
              Math.max(
                0,
                b.target.hp-4
              );

            if(b.target.hp<=0)
              b.target.alive=false;
          }
        }

        continue;
      }
    }

    const dx=tx-b.x;
    const dy=ty-b.y;

    const len=Math.hypot(dx,dy)||1;

    const speed=
      b.speed*
      (b.state==="follow"?1.15:0.8);

    moveEntity(
      b,
      dx/len*speed*dt,
      dy/len*speed*dt
    );
  }
}

/* =========================================================
   PLAYER UPDATE
   ========================================================= */

function updatePlayer(dt){

  let x=joyX;
  let y=joyY;

  if(keys["w"])y=-1;
  if(keys["s"])y=1;
  if(keys["a"])x=-1;
  if(keys["d"])x=1;

  const len=Math.hypot(x,y);

  if(len>1){
    x/=len;
    y/=len;
  }

  let moving=len>.05;

  let speed=player.speed;

  player.sprint=
    sprintButton &&
    player.stamina>1 &&
    moving;

  if(player.sprint){

    speed*=1.55;
    player.stamina-=22*dt;

  }else{

    player.stamina+=15*dt;
  }

  if(player.crouch)
    speed*=.55;

  player.stamina=
    clamp(
      player.stamina,
      0,
      100
    );

  /* camera-relative movement */
  const ca=Math.cos(camera.angle);
  const sa=Math.sin(camera.angle);

  const mx=
    x*ca-y*sa;

  const my=
    x*sa+y*ca;

  moveEntity(
    player,
    mx*speed*dt,
    my*speed*dt
  );

  /* slow damage outside safe zone */
  const zoneDist=Math.hypot(
    player.x-safeZone.x,
    player.y-safeZone.y
  );

  if(zoneDist>safeZone.radius){

    player.hp=
      Math.max(
        0,
        player.hp-3*dt
      );
  }

  if(player.hp<=0){
    player.hp=100;
    player.x=safeZone.x;
    player.y=safeZone.y;
  }
}

   CAMERA UPDATE

function updateCamera(dt){

  const follow=.1;

  camera.x +=
    (player.x-camera.x)*
    follow;

  camera.y +=
    (player.y-camera.y)*
    follow;
}

/* =========================================================
   MINIMAP
   ========================================================= */

function drawMinimap(){

  const mw=mini.width;
  const mh=mini.height;

  mctx.clearRect(0,0,mw,mh);

  const sx=mw/WORLD_W;
  const sy=mh/WORLD_H;

  mctx.fillStyle="#71865a";
  mctx.fillRect(0,0,mw,mh);

  /* water */
  mctx.strokeStyle="#397a8a";
  mctx.lineWidth=14;

  for(const river of world.water){

    mctx.beginPath();

    river.points.forEach((q,i)=>{

      if(i===0)
        mctx.moveTo(
          q.x*sx,
          q.y*sy
        );
      else
        mctx.lineTo(
          q.x*sx,
          q.y*sy
        );
    });

    mctx.stroke();
  }

  /* roads */
  mctx.strokeStyle="#555c56";
  mctx.lineWidth=3;

  for(const r of world.roads){

    mctx.beginPath();

    mctx.moveTo(
      r.x1*sx,
      r.y1*sy
    );

    mctx.lineTo(
      r.x2*sx,
      r.y2*sy
    );

    mctx.stroke();
  }

  /* zone */
  mctx.strokeStyle="#b9d46d";
  mctx.lineWidth=3;

  mctx.beginPath();

  mctx.arc(
    safeZone.x*sx,
    safeZone.y*sy,
    safeZone.radius*sx,
    0,
    Math.PI*2
  );

  mctx.stroke();

  /* bots */
  for(const b of bots){

    if(!b.alive)continue;

    mctx.fillStyle="#d45c5c";

    mctx.fillRect(
      b.x*sx-1.5,
      b.y*sy-1.5,
      3,
      3
    );
  }

  /* player */
  mctx.fillStyle="#fff";

  mctx.beginPath();

  mctx.arc(
    player.x*sx,
    player.y*sy,
    4,
    0,
    Math.PI*2
  );

  mctx.fill();
}

/* =========================================================
   RENDER
   ========================================================= */

function render(){

  ctx.clearRect(0,0,W,H);

  drawTerrain();
  drawRoads();
  drawNature();
  drawBuildings();
  drawVehicles();
  drawLoot();
  drawBots();

  /* player should remain foreground */
  drawPlayer();

  drawMinimap();
}

      player.hp+"%";

  document.getElementById("stamina")
    .style.width=
      player.stamina+"%";

  const minutes=
    Math.max(
      0,
      Math.floor(safeZone.timer/60)
    );

  const seconds=
    Math.max(
      0,
      Math.floor(safeZone.timer%60)
    );

  document.getElementById("zoneTimer")
    .textContent=
      String(minutes).padStart(2,"0")+
      ":"+
      String(seconds).padStart(2,"0");

  updateAlive();
}

/* =========================================================
   GAME LOOP
   ========================================================= */

let running=false;
let last=0;

function loop(t){

  if(!running)return;

  const dt=
    Math.min(
      .033,
      (t-last)/1000||0
    );

  last=t;

  updatePlayer(dt);
  updateBots(dt);
  updateZone(dt);
  updateCamera(dt);
  updateHUD();
  render();

  requestAnimationFrame(loop);
}

/* =========================================================
   START
   ========================================================= */

function startGame(){

  createTerrain();
  createRoadNetwork();
  createPOI();
  createNature();
  createVehicles();
  createLoot();
  spawnBots();

  updateInventory();

  camera.x=player.x;
  camera.y=player.y;

  running=true;

  document.getElementById("startScreen")
    .style.display="none";

  last=performance.now();

  requestAnimationFrame(loop);
}

document.getElementById("startBtn")
  .addEventListener("click",startGame);

</script>
