<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Virelia: Afterfall</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b08}
body{font-family:Arial,sans-serif}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;top:14px;left:14px;color:white;font-weight:bold;font-size:14px;z-index:5;text-shadow:0 2px 4px #000}
#prompt{position:fixed;top:55%;left:50%;transform:translate(-50%,-50%);color:white;font-weight:bold;text-shadow:0 2px 5px #000;z-index:5}
#joystick{position:fixed;left:24px;bottom:24px;width:130px;height:130px;border-radius:50%;background:#0007;border:2px solid #fff3;z-index:10;touch-action:none}
#stick{position:absolute;width:58px;height:58px;left:34px;top:34px;border-radius:50%;background:#aaa9}
#actions{position:fixed;right:24px;bottom:24px;z-index:10;display:flex;gap:12px}
button{width:82px;height:82px;border-radius:50%;border:2px solid #fff3;background:#111b;color:white;font-weight:bold}
#error{position:fixed;inset:0;background:#090b09;color:white;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:100;font-family:Arial}
#errorBox{max-width:500px}
#error h2{margin:0 0 12px}
#error p{color:#bbb;line-height:1.5}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">HP 100<br>HUNGER 100<br>DAY 1</div>
<div id="prompt"></div>

<div id="joystick">
<div id="stick"></div>
</div>

<div id="actions">
<button id="interact">INTERACT</button>
<button id="full">⛶</button>
</div>

<div id="error">
<div id="errorBox">
<h2>Virelia gagal memuat</h2>
<p id="errorText">Game engine tidak berhasil dijalankan.</p>
</div>
</div>

<script type="module">
const errorBox=document.getElementById("error");
const errorText=document.getElementById("errorText");

async function start(){
try{
const THREE=await import("https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js");

const canvas=document.getElementById("game");
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x202820);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,1000);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);

scene.add(new THREE.HemisphereLight(0xffffff,0x334433,2));

const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(40,80,30);
scene.add(sun);

const ground=new THREE.Mesh(
new THREE.PlaneGeometry(240,180),
new THREE.MeshLambertMaterial({color:0x394638})
);
ground.rotation.x=-Math.PI/2;
scene.add(ground);

function box(x,y,z,w,h,d,color){
const m=new THREE.Mesh(
new THREE.BoxGeometry(w,h,d),
new THREE.MeshLambertMaterial({color})
);
m.position.set(x,y,z);
scene.add(m);
return m;
}

for(let x=-80;x<=80;x+=80){
box(x,.02,0,12,.04,180,0x303530);
}

for(let z=-60;z<=60;z+=60){
box(0,.03,z,240,.04,12,0x303530);
}

for(let x of [-55,25]){
for(let z of [-82,-42,22,62]){
box(x,5,z,28,10,22,0x77736a);
}
}

for(let x of [-105,105]){
for(let z of [-30,30]){
box(x,5,z,22,10,26,0x6b7068);
}
}

function tree(x,z){
const trunk=box(x,2,z,2,4,2,0x60472d);
const crown=new THREE.Mesh(
new THREE.SphereGeometry(4,12,12),
new THREE.MeshLambertMaterial({color:0x315c32})
);
crown.position.set(x,6,z);
scene.add(crown);
}

tree(-105,-75);
tree(-105,75);
tree(105,-75);
tree(105,75);
tree(-35,80);
tree(35,-80);

function car(x,z,color){
const g=new THREE.Group();

const body=new THREE.Mesh(
new THREE.BoxGeometry(5,1.5,9),
new THREE.MeshLambertMaterial({color})
);
body.position.y=1.1;
g.add(body);

const top=new THREE.Mesh(
new THREE.BoxGeometry(3.8,1.1,4),
new THREE.MeshLambertMaterial({color:0x222222})
);
top.position.y=2.25;
g.add(top);

g.position.set(x,0,z);
scene.add(g);
return g;
}

car(-20,60,0xd5b52c);
car(20,-60,0xb83a35);
car(-80,-20,0x3d6ca8);
car(80,20,0x777777);

const player=new THREE.Group();

const body=new THREE.Mesh(
new THREE.BoxGeometry(1.5,2.2,1),
new THREE.MeshLambertMaterial({color:0x30485c})
);
body.position.y=2.1;
player.add(body);

const head=new THREE.Mesh(
new THREE.SphereGeometry(.65,16,16),
new THREE.MeshLambertMaterial({color:0xc58d68})
);
head.position.y=3.7;
player.add(head);

const leg1=box(0,0,0,1,1,1,0x222831);
const leg2=leg1.clone();
leg1.position.set(-.4,.7,0);
leg2.position.set(.4,.7,0);
player.add(leg1,leg2);

player.position.set(0,0,20);
scene.add(player);

const zombies=[];

for(let i=0;i<6;i++){
const z=new THREE.Mesh(
new THREE.BoxGeometry(1.3,2.6,1.2),
new THREE.MeshLambertMaterial({color:0x5b6956})
);
z.position.set(
[-100,-70,70,100,45,-45][i],
1.3,
[-20,40,-35,35,75,-75][i]
);
scene.add(z);
zombies.push(z);
}

const keys={};
addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

let joyX=0;
let joyY=0;

const joy=document.getElementById("joystick");
const stick=document.getElementById("stick");

function joystick(e){
const r=joy.getBoundingClientRect();
let x=e.clientX-r.left-r.width/2;
let y=e.clientY-r.top-r.height/2;
const max=45;
const len=Math.hypot(x,y);

if(len>max){
x=x/len*max;
y=y/len*max;
}

stick.style.transform=`translate(${x}px,${y}px)`;
joyX=x/max;
joyY=y/max;
}

joy.addEventListener("pointerdown",e=>{
joy.setPointerCapture(e.pointerId);
joystick(e);
});

joy.addEventListener("pointermove",e=>{
if(e.buttons)joystick(e);
});

joy.addEventListener("pointerup",()=>{
joyX=0;
joyY=0;
stick.style.transform="translate(0,0)";
});

document.getElementById("full").onclick=()=>{
if(document.documentElement.requestFullscreen)
document.documentElement.requestFullscreen();
};

function animate(){
requestAnimationFrame(animate);

let x=joyX;
let z=joyY;

if(keys.w||keys.arrowup)z=-1;
if(keys.s||keys.arrowdown)z=1;
if(keys.a||keys.arrowleft)x=-1;
if(keys.d||keys.arrowright)x=1;

player.position.x+=x*.16;
player.position.z+=z*.16;

if(x||z){
player.rotation.y=Math.atan2(x,z);
}

camera.position.lerp(
new THREE.Vector3(
player.position.x,
player.position.y+7,
player.position.z+11
),
.08
);

camera.lookAt(
player.position.x,
player.position.y+2,
player.position.z
);

for(const zombie of zombies){
const dx=player.position.x-zombie.position.x;
const dz=player.position.z-zombie.position.z;
const d=Math.hypot(dx,dz);

if(d>3){
zombie.position.x+=dx/d*.025;
zombie.position.z+=dz/d*.025;
}
}

renderer.render(scene,camera);
}

addEventListener("resize",()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});

animate();

}catch(e){
console.error(e);
errorBox.style.display="flex";
errorText.textContent="Engine 3D gagal dimuat: "+e.message;
}
}

start();
</script>
</body>
</html>
