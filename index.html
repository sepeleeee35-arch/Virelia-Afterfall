<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

position:fixed;right:16px;top:17px;width:58px;height:58px;border:0;
border-radius:17px;background:#ffffffdd;font-size:23px;z-index:20

<body>

<div id="game"></div>
<div id="loading">MEMUAT DUNIA 3D...</div>

<div id="hud">

</div>

<button id="action" class="btn circle">👊<br>TINJU</button>

<button id="enterCar" class="btn round">🚗 MASUK</button>
<button id="exitCar" class="btn round">🚪 KELUAR</button>

<button id="exitHouse" class="btn round">🚪 KELUAR</button>

<div id="speed">0 KM/H</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js";
import {GLTFLoader} from "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/loaders/GLTFLoader.js";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x788386);
scene.fog=new THREE.FogExp2(0x788386,.0038);

const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,900);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.08;
document.getElementById("game").appendChild(renderer.domElement);

const hemi=new THREE.HemisphereLight(0xc7d7dc,0x354039,1.8);
scene.add(hemi);

const sun=new THREE.DirectionalLight(0xffe5c5,3);
sun.position.set(-100,140,90);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-230;
sun.shadow.camera.right=230;
sun.shadow.camera.top=230;
sun.shadow.camera.bottom=-230;
sun.shadow.camera.far=500;
scene.add(sun);

const world=new THREE.Group();
scene.add(world);

const solid=[];
const cameraMeshes=[];
const houses=[];
const cars=[];
const zombies=[];
const supplies=[];
const trees=[];

const M={
grass:new THREE.MeshStandardMaterial({color:0x4c624d,roughness:1}),
road:new THREE.MeshStandardMaterial({color:0x242729,roughness:.98}),
side:new THREE.MeshStandardMaterial({color:0x858785,roughness:.95}),
wall:new THREE.MeshStandardMaterial({color:0x77746e,roughness:.9}),
wall2:new THREE.MeshStandardMaterial({color:0x625f5a,roughness:.9}),
roof:new THREE.MeshStandardMaterial({color:0x343536,roughness:.85}),
floor:new THREE.MeshStandardMaterial({color:0x665e51,roughness:.9}),
wood:new THREE.MeshStandardMaterial({color:0x4d382b,roughness:.85}),
dark:new THREE.MeshStandardMaterial({color:0x1e2324,roughness:.75}),
glass:new THREE.MeshStandardMaterial({color:0x45666e,roughness:.12,metalness:.4}),
metal:new THREE.MeshStandardMaterial({color:0x45494a,roughness:.35,metalness:.7}),
green:new THREE.MeshStandardMaterial({color:0x36543e,roughness:1}),
tree:new THREE.MeshStandardMaterial({color:0x4d3b2a,roughness:1}),
leaf:new THREE.MeshStandardMaterial({color:0x2d5037,roughness:1}),
rust:new THREE.MeshStandardMaterial({color:0x704936,roughness:.8}),
yellow:new THREE.MeshStandardMaterial({color:0xb99c22,roughness:.6}),
red:new THREE.MeshStandardMaterial({color:0x71342d,roughness:.7}),
skin:new THREE.MeshStandardMaterial({color:0xb97b5d,roughness:.8}),
zombie:new THREE.MeshStandardMaterial({color:0x59655a,roughness:.9})
};

function box(name,x,y,z,sx,sy,sz,mat,parent=world){
const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat);
m.name=name;
m.position.set(x,y,z);
m.castShadow=true;
m.receiveShadow=true;
parent.add(m);
return m;
}

function cyl(x,y,z,r,h,mat,parent=world){
const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,12),mat);
m.position.set(x,y,z);
m.castShadow=true;
m.receiveShadow=true;
parent.add(m);
return m;
}

function rectHit(px,pz,o,pad=.55){
const cx=Math.max(o.x-o.w/2,Math.min(px,o.x+o.w/2));
const cz=Math.max(o.z-o.d/2,Math.min(pz,o.z+o.d/2));
const dx=px-cx,dz=pz-cz;
return dx*dx+dz*dz<pad*pad;
}

function addGround(){
box("ground",0,-.5,0,380,.8,320,M.grass);
}

function addRoads(){
for(let x=-110;x<=110;x+=55){
box("road",x,0,0,13,.08,320,M.road);
box("side",x,.07,-161.5,13,.16,2,M.side);
box("side",x,.07,161.5,13,.16,2,M.side);
}
for(let z=-90;z<=90;z+=45){
box("road",0,0,z,360,.08,13,M.road);
}
for(let x=-110;x<=110;x+=55){
for(let z=-150;z<150;z+=11){
box("mark",x,.06,z,.16,.015,5,M.side);
}
}
for(let z=-90;z<=90;z+=45){
for(let x=-175;x<175;x+=11){
box("mark",x,.06,z,5,.015,.16,M.side);
}
}
}

function addHouse(x,z,w=27,d=24,h=7,index=0){
const g=new THREE.Group();
g.position.set(x,0,z);

const floor=box("floor",0,.08,0,w-.8,.16,d-.8,M.floor,g);

const wallT=.6;
const doorW=2.3;
const side=(w-doorW)/2;

const left=box("frontWall",-side/2,h/2,d/2,w/2-doorW/2,h,wallT,M.wall,g);
const right=box("frontWall",side/2,h/2,d/2,w/2-doorW/2,h,wallT,M.wall,g);
const back=box("backWall",0,h/2,-d/2,w,h,wallT,M.wall2,g);
const lwall=box("leftWall",-w/2,h/2,0,wallT,h,d,M.wall2,g);
const rwall=box("rightWall",w/2,h/2,0,wallT,h,d,M.wall2,g);

box("roof",0,h+.15,0,w+.5,.3,d+.5,M.roof,g);

const door=box("door",0,1.25,d/2+.32,doorW,2.5,.18,M.dark,g);

for(let sideX of [-1,1]){
for(let zoff of [-5,1,7]){
const win=box("window",sideX*(w/2+.04),3,zoff, .08,1.5,2.2,M.glass,g);
}
}

box("table",0,.85,0,3,.16,2,M.wood,g);
for(const xx of [-1.25,1.25]){
for(const zz of [-.7,.7]){
cyl(xx,.42,zz,.12,.8,M.wood,g);
}
}

box("sofa",-7,1.0,-4,4,.9,1.5,M.red,g);
box("sofaBack",-7,1.7,-4.7,4,1.5,.35,M.red,g);

box("bed",7,.55,-5,5,.6,3.2,M.dark,g);
box("pillow",7,1.0,-6.05,2.2,.3,.75,M.side,g);

box("cabinet",8,2,5,2.2,4,.8,M.wood,g);
box("counter",-7,1.2,5,4,.5,1.8,M.wood,g);

const lamp=new THREE.PointLight(0xffdca8,1.6,15);
lamp.position.set(0,5.8,0);
g.add(lamp);

const wallData=[
{x:x-left.position.x*0,z:z+d/2,w:w/2-doorW/2,d:wallT},
{x:x+right.position.x*0,z:z+d/2,w:w/2-doorW/2,d:wallT},
{x,z:z-d/2,w,d:wallT},
{x:x-w/2,z,w:wallT,d},
{x:x+w/2,z,w:wallT,d}
];

for(const o of wallData)solid.push({type:"wall",...o});

g.userData={
inside:false,
door,
interior:g,
doorX:x,
doorZ:z+d/2
};

houses.push(g);
world.add(g);
}

function addTree(x,z,s=1){
const g=new THREE.Group();
g.position.set(x,0,z);
g.scale.setScalar(s);

cyl(0,2,0,.48,4,M.tree,g);

const c=new THREE.Mesh(new THREE.SphereGeometry(2.7,14,11),M.leaf);
c.position.y=5;
c.castShadow=true;
g.add(c);

const c2=new THREE.Mesh(new THREE.SphereGeometry(1.8,12,9),M.leaf);
c2.position.set(1.3,5.2,.2);
g.add(c2);

trees.push(g);
solid.push({type:"tree",x,z,r:2.2*s});
cameraMeshes.push(...g.children);
world.add(g);
}

function addCar(x,z,rot,color){
const g=new THREE.Group();
g.position.set(x,.25,z);
g.rotation.y=rot;

const bodyMat=new THREE.MeshStandardMaterial({color,roughness:.4,metalness:.25});

const body=box("body",0,.7,0,4.6,1.05,7.5,bodyMat,g);
box("hood",0,1.18,2.15,4.15,.25,2.1,bodyMat,g);
box("cabin",0,1.6,-.55,3.7,1.2,3.1,M.dark,g);

for(const xw of [-1,1]){
const wheel=cyl(2.25*xw,.48,2.35,.62,.45,M.dark,g);
wheel.rotation.z=Math.PI/2;
const wheel2=cyl(2.25*xw,.48,-2.35,.62,.45,M.dark,g);
wheel2.rotation.z=Math.PI/2;
}

box("frontGlass",0,1.6,1.05,3.25,.75,.08,M.glass,g);
box("rearGlass",0,1.6,-2.15,3.25,.75,.08,M.glass,g);
box("bumper",0,.5,3.8,4.25,.3,.2,M.metal,g);
box("bumper",0,.5,-3.8,4.25,.3,.2,M.metal,g);

cars.push(g);
solid.push({type:"car",x,z,w:2.7,d:4.5,group:g});
cameraMeshes.push(body);
world.add(g);
}

function addSupply(x,z){
const g=new THREE.Group();
g.position.set(x,.1,z);
box("crate",0,.35,0,1,.7,1,M.yellow,g);
box("strap",0,.72,0,.13,.04,1.02,M.rust,g);
box("strap",0,.72,0,1.02,.04,.13,M.rust,g);
g.userData.taken=false;
supplies.push(g);
world.add(g);
}

function createZombie(x,z){
const g=new THREE.Group();

box("body",0,1.25,0,1.0,1.3,.6,M.zombie,g);

const head=new THREE.Mesh(new THREE.SphereGeometry(.4,16,12),M.skin);
head.position.y=2.25;
g.add(head);

box("eyeL",-.13,2.3,-.38,.07,.07,.04,M.red,g);
box("eyeR",.13,2.3,-.38,.07,.07,.04,M.red,g);

box("arm",-0.65,1.25,0,.28,1.15,.3,M.zombie,g);
box("arm",0.65,1.25,0,.28,1.15,.3,M.zombie,g);
box("leg",-0.28,.38,0,.36,.9,.4,M.dark,g);
box("leg",.28,.38,0,.36,.9,.4,M.dark,g);

g.position.set(x,0,z);
g.userData={hp:2,stun:0,attackCooldown:0};
zombies.push(g);
world.add(g);
}

const player=new THREE.Group();
world.add(player);
player.position.set(0,.02,35);

let playerModel=null;
let mixer=null;
let actions={};
let activeAction=null;
let glbReady=false;

const loader=new GLTFLoader();

loader.load(
"https://threejs.org/examples/models/gltf/Soldier.glb",
gltf=>{
playerModel=gltf.scene;

playerModel.traverse(o=>{
if(o.isMesh){
o.castShadow=true;
o.receiveShadow=true;
}
});

const box3=new THREE.Box3().setFromObject(playerModel);
const size=box3.getSize(new THREE.Vector3());
const targetHeight=3.0;
const scale=targetHeight/size.y;
playerModel.scale.setScalar(scale);

const box2=new THREE.Box3().setFromObject(playerModel);
const center=box2.getCenter(new THREE.Vector3());

playerModel.position.x=-center.x;
playerModel.position.y=-box2.min.y;
playerModel.position.z=-center.z;

player.add(playerModel);

mixer=new THREE.AnimationMixer(playerModel);

for(const clip of gltf.animations){
actions[clip.name]=mixer.clipAction(clip);
}

const idle=actions.Idle;
const walk=actions.Walk;
const run=actions.Run;

if(idle)activeAction=idle;
else activeAction=mixer.clipAction(gltf.animations[0]);

activeAction.play();
glbReady=true;
document.getElementById("loading").style.display="none";
},
undefined,
()=>{
document.getElementById("loading").textContent="MODEL GAGAL DIMUAT";
}
);

let hp=100;
let hunger=100;
let suppliesCount=2;

let crouching=false;
let sprinting=false;
let grounded=true;
let verticalVelocity=0;

let activeCar=null;
let insideHouse=null;

let joyX=0,joyY=0;
let cameraYaw=0;
let cameraPitch=.18;
let dragging=false;
let lastX=0,lastY=0;

const keys={};

function setAnimation(name){
if(!mixer)return;

const next=actions[name]||actions.Idle;
if(!next||next===activeAction)return;

next.reset().fadeIn(.18).play();

if(activeAction)activeAction.fadeOut(.18);

activeAction=next;
}

function playerHeight(){
return crouching?2.1:3;
}

function blocked(x,z){
for(const o of solid){

if(o.type==="wall"){
if(rectHit(x,z,o,.5))return true;
}

if(o.type==="car"){
if(rectHit(x,z,o,.65))return true;
}

if(o.type==="tree"){
const dx=x-o.x,dz=z-o.z;
if(dx*dx+dz*dz<(o.r+.6)*(o.r+.6))return true;
}
}

return false;
}

function movePlayer(dx,dz){
if(activeCar)return;

const len=Math.hypot(dx,dz);
if(len>1){dx/=len;dz/=len}

const nx=player.position.x+dx;
const nz=player.position.z+dz;

if(!blocked(nx,player.position.z))player.position.x=nx;
if(!blocked(player.position.x,nz))player.position.z=nz;
}

function jump(){
if(activeCar)return;
if(grounded){
verticalVelocity=7.5;
grounded=false;
}
}

function updateVertical(dt){
if(activeCar)return;

verticalVelocity-=18*dt;
player.position.y+=verticalVelocity*dt;

if(player.position.y<=.02){
player.position.y=.02;
verticalVelocity=0;
grounded=true;
}else grounded=false;
}

function nearestZombie(){
let best=null,d=999;

for(const z of zombies){
if(!z.parent)continue;

const dd=player.position.distanceTo(z.position);

if(dd<d){
d=dd;
best=z;
}
}

return {z:best,d};
}

function nearestSupply(){
let best=null,d=999;

for(const s of supplies){
if(s.userData.taken)continue;
const dd=player.position.distanceTo(s.position);
if(dd<d){d=dd;best=s}
}

return {s:best,d};
}

function nearestCar(){
let best=null,d=999;

for(const c of cars){
const dd=player.position.distanceTo(c.position);
if(dd<d){d=dd;best=c}
}

return {c:best,d};
}

function nearestHouse(){
let best=null,d=999;

for(const h of houses){
const dx=player.position.x-h.position.x;
const dz=player.position.z-h.position.z;

const doorZ=h.userData.doorZ;
const dd=Math.hypot(dx,player.position.z-doorZ);

if(dd<d){
d=dd;
best=h;
}
}

return {h:best,d};
}

function punch(){
if(activeCar||insideHouse)return;

const q=nearestZombie();

if(q.z&&q.d<3.4){
q.z.userData.hp--;
q.z.userData.stun=.6;

const dir=new THREE.Vector3().subVectors(q.z.position,player.position).normalize();
q.z.position.addScaledVector(dir,1.1);

if(q.z.userData.hp<=0){
world.remove(q.z);
}
}
}

function pickup(){
const q=nearestSupply();

if(q.s&&q.d<3.2){
q.s.userData.taken=true;
q.s.visible=false;
suppliesCount++;
document.getElementById("supplies").textContent=suppliesCount;
}
}

function enterCar(){
if(activeCar||insideHouse)return;

const q=nearestCar();

if(q.c&&q.d<6){
activeCar=q.c;
player.visible=false;
q.c.userData={speed:0};

document.getElementById("enterCar").style.display="none";
document.getElementById("exitCar").style.display="block";
document.getElementById("speed").style.display="block";
}
}

function exitCar(){
if(!activeCar)return;

const side=new THREE.Vector3(3.5,0,0).applyQuaternion(activeCar.quaternion);
const pos=activeCar.position.clone().add(side);

if(!blocked(pos.x,pos.z)){
player.position.set(pos.x,.02,pos.z);
player.visible=true;
activeCar=null;

document.getElementById("exitCar").style.display="none";
document.getElementById("speed").style.display="none";
}
}

function enterHouse(){
if(insideHouse||activeCar)return;

const q=nearestHouse();

if(q.h&&q.d<4.5){
insideHouse=q.h;
insideHouse.userData.inside=true;

player.position.set(
insideHouse.position.x,
.03,
insideHouse.position.z
);

player.rotation.y=0;

document.getElementById("enterHouse").style.display="none";
document.getElementById("exitHouse").style.display="block";
}
}

function exitHouse(){
if(!insideHouse)return;

const h=insideHouse;

player.position.set(
h.position.x,
.03,
h.userData.doorZ+2.5
);

insideHouse.userData.inside=false;
insideHouse=null;

document.getElementById("exitHouse").style.display="none";
}

function drive(dt){
if(!activeCar)return;

const throttle=-joyY;
const steer=joyX;

let speed=activeCar.userData.speed;

if(Math.abs(throttle)>.08){
speed+=throttle*(throttle>0?28:35)*dt;
}else{
speed*=Math.pow(.08,dt);
}

speed=Math.max(-12,Math.min(30,speed));

activeCar.rotation.y-=steer*(speed/30)*1.5*dt;

const forward=new THREE.Vector3(0,0,1).applyQuaternion(activeCar.quaternion);

const nx=activeCar.position.x+forward.x*speed*dt;
const nz=activeCar.position.z+forward.z*speed*dt;

if(!blocked(nx,nz)){
activeCar.position.x=nx;
activeCar.position.z=nz;
}else{
speed*=-.15;
}

activeCar.userData.speed=speed;

document.getElementById("speed").textContent=
Math.round(Math.abs(speed)*3.6)+" KM/H";
}

function zombieAttack(z){
if(z.userData.attackCooldown>0)return;

z.userData.attackCooldown=1.25;
hp=Math.max(0,hp-7);

const dir=new THREE.Vector3()
.subVectors(player.position,z.position)
.normalize();

player.position.addScaledVector(dir,.8);
}

function updateZombies(dt){
for(const z of zombies){

if(!z.parent)continue;

z.userData.attackCooldown=Math.max(0,z.userData.attackCooldown-dt);

if(z.userData.stun>0){
z.userData.stun-=dt;
continue;
}

const dx=player.position.x-z.position.x;
const dz=player.position.z-z.position.z;
const d=Math.hypot(dx,dz);

if(d<25&&d>1.65){
const speed=1.7;

const vx=dx/d*speed*dt;
const vz=dz/d*speed*dt;

if(!blocked(z.position.x+vx,z.position.z))
z.position.x+=vx;

if(!blocked(z.position.x,z.position.z+vz))
z.position.z+=vz;

z.rotation.y=Math.atan2(dx,dz);
}

if(d<1.75&&!activeCar&&!insideHouse){
zombieAttack(z);
}
}
}

function updateButtons(){
const enterCar=document.getElementById("enterCar");
const exitCar=document.getElementById("exitCar");
const enterHouseBtn=document.getElementById("enterHouse");
const exitHouseBtn=document.getElementById("exitHouse");

enterCar.style.display="none";
enterHouseBtn.style.display="none";

if(activeCar){
exitCar.style.display="block";
}else{
exitCar.style.display="none";

const c=nearestCar();

if(c.c&&c.d<6)
enterCar.style.display="block";

if(!insideHouse){
const h=nearestHouse();

if(h.h&&h.d<4.5)
enterHouseBtn.style.display="block";
}
}

exitHouseBtn.style.display=insideHouse?"block":"none";

const z=nearestZombie();
const s=nearestSupply();

const action=document.getElementById("action");

if(z.z&&z.d<3.8){
action.innerHTML="👊<br>PUKUL";
}else if(s.s&&s.d<3.5){
action.innerHTML="📦<br>AMBIL";
}else{
action.innerHTML="👊<br>TINJU";
}
}

document.getElementById("action").onclick=()=>{
const z=nearestZombie();

if(z.z&&z.d<3.8)punch();
else pickup();
};

document.getElementById("jump").onclick=jump;
document.getElementById("crouch").onclick=()=>{
if(activeCar)return;
crouching=!crouching;
};

document.getElementById("sprint").addEventListener("pointerdown",()=>sprinting=true);
document.getElementById("sprint").addEventListener("pointerup",()=>sprinting=false);
document.getElementById("sprint").addEventListener("pointercancel",()=>sprinting=false);
document.getElementById("enterCar").onclick=enterCar;
document.getElementById("exitCar").onclick=exitCar;
document.getElementById("enterHouse").onclick=enterHouse;
document.getElementById("exitHouse").onclick=exitHouse;

document.getElementById("full").onclick=()=>{
if(!document.fullscreenElement)
document.documentElement.requestFullscreen?.();
else
document.exitFullscreen?.();
};

renderer.domElement.addEventListener("pointerdown",e=>{
if(e.clientX>innerWidth*.42){
dragging=true;
lastX=e.clientX;
lastY=e.clientY;
}
});

renderer.domElement.addEventListener("pointermove",e=>{
if(!dragging)return;

const dx=e.clientX-lastX;
const dy=e.clientY-lastY;

cameraYaw-=dx*.006;
cameraPitch-=dy*.004;

cameraPitch=Math.max(-.55,Math.min(1.0,cameraPitch));

lastX=e.clientX;
lastY=e.clientY;
});

renderer.domElement.addEventListener("pointerup",()=>dragging=false);
renderer.domElement.addEventListener("pointercancel",()=>dragging=false);

document.addEventListener("keydown",e=>{
keys[e.key.toLowerCase()]=true;

if(e.key===" "){
e.preventDefault();
jump();
}

if(e.key.toLowerCase()==="shift")sprinting=true;
if(e.key.toLowerCase()==="c")crouching=!crouching;
if(e.key.toLowerCase()==="e"){
if(insideHouse)exitHouse();
else{
const c=nearestCar();
const h=nearestHouse();

if(c.c&&c.d<6)enterCar();
else if(h.h&&h.d<4.5)enterHouse();
else{
const z=nearestZombie();
if(z.z&&z.d<3.8)punch();
else pickup();
}
}
}
});

document.addEventListener("keyup",e=>{
keys[e.key.toLowerCase()]=false;

if(e.key.toLowerCase()==="shift")
sprinting=false;
});

const joy=document.getElementById("joy");
const knob=document.getElementById("knob");
let joyActive=false;

function setJoy(x,y){
const r=joy.getBoundingClientRect();

let dx=x-(r.left+r.width/2);
let dy=y-(r.top+r.height/2);

const max=50;
const len=Math.hypot(dx,dy);

if(len>max){
dx=dx/len*max;
dy=dy/len*max;
}

joyX=dx/max;
joyY=dy/max;

knob.style.transform=`translate(${dx}px,${dy}px)`;
}

joy.addEventListener("pointerdown",e=>{
joyActive=true;
joy.setPointerCapture(e.pointerId);
setJoy(e.clientX,e.clientY);
});

joy.addEventListener("pointermove",e=>{
if(joyActive)setJoy(e.clientX,e.clientY);
});

joy.addEventListener("pointerup",()=>{
joyActive=false;
joyX=0;
joyY=0;
knob.style.transform="translate(0,0)";
});

function updateCamera(){
const target=new THREE.Vector3();

if(activeCar){
target.copy(activeCar.position);
target.y+=1.35;
}else{
target.copy(player.position);
target.y+=crouching?1.45:2;
}

const distance=activeCar?15:11.5;

const offset=new THREE.Vector3(
Math.sin(cameraYaw)*Math.cos(cameraPitch)*distance,
Math.sin(cameraPitch)*distance+3,
Math.cos(cameraYaw)*Math.cos(cameraPitch)*distance
);

const desired=target.clone().add(offset);
const dir=desired.clone().sub(target);
const len=dir.length();
dir.normalize();

const ray=new THREE.Raycaster(target,dir,0.4,len);
const hits=ray.intersectObjects(cameraMeshes,true);

let finalLen=len;

if(hits.length){
finalLen=Math.max(.9,hits[0].distance-.5);
}

const pos=target.clone().add(dir.multiplyScalar(finalLen));

camera.position.lerp(pos,.16);
camera.lookAt(target);
}

function buildWorld(){
addGround();
addRoads();

const xs=[-82.5,-27.5,27.5,82.5];
const zs=[-67.5,-22.5,22.5,67.5];

let n=0;

for(const x of xs){
for(const z of zs){
if(Math.abs(x)<30&&Math.abs(z)<30)continue;
addHouse(x,z,27,24,6+(n%3),n++);
}
}

const tp=[
[-145,-120,1.1],[-120,-115,.9],[-90,-125,1.2],
[100,-125,1], [135,-105,1.1],
[-145,100,1.2],[-125,125,.9],[110,115,1.2],
[140,80,1],[-145,-10,1],[-125,35,.9],[135,25,1.1]
];

for(const p of tp)addTree(...p);

addCar(-5,-70,0,0x9a7e20);
addCar(5,70,Math.PI,0x596368);
addCar(-110,-5,Math.PI/2,0x69322f);
addCar(110,5,-Math.PI/2,0x385460);

const sp=[
[-48,-37],[48,37],[-78,38],[78,-38],
[-18,72],[18,-72],[-130,-30],[130,30]
];

for(const p of sp)addSupply(...p);

for(let i=0;i<14;i++){
const a=Math.random()*Math.PI*2;
const r=45+Math.random()*100;
createZombie(Math.cos(a)*r,Math.sin(a)*r);
}
}

buildWorld();

const clock=new THREE.Clock();

function animate(){
requestAnimationFrame(animate);

const dt=Math.min(.033,clock.getDelta());

let mx=joyX;
let mz=joyY;

if(keys.w||keys.arrowup)mz=-1;
if(keys.s||keys.arrowdown)mz=1;
if(keys.a||keys.arrowleft)mx=-1;
if(keys.d||keys.arrowright)mx=1;

if(!activeCar){
const forward=new THREE.Vector3(
Math.sin(cameraYaw),0,Math.cos(cameraYaw)
);

const right=new THREE.Vector3(
Math.cos(cameraYaw),0,-Math.sin(cameraYaw)
);

const move=forward.clone().multiplyScalar(-mz);
move.add(right.multiplyScalar(mx));

if(move.length()>0){

move.normalize();

let speed=crouching?.055:(sprinting?.17:.105);

move.multiplyScalar(speed);
movePlayer(move.x,move.z);

player.rotation.y=Math.atan2(move.x,move.z);

if(glbReady){
if(sprinting&&!crouching)setAnimation("Run");
else setAnimation("Walk");
}

}else{
if(glbReady)setAnimation("Idle");
}

}else{
if(glbReady)setAnimation("Idle");
}

if(mixer)mixer.update(dt);

updateVertical(dt);
drive(dt);
updateZombies(dt);
updateCamera();
updateButtons();

hunger=Math.max(0,hunger-dt*.008);

document.getElementById("hp").textContent=Math.round(hp);
document.getElementById("hunger").textContent=Math.round(hunger);

renderer.render(scene,camera);
}

window.addEventListener("resize",()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});

animate();
</script>
</body>
</html>
