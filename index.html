function cube(w,h,d,color){

function addCollider(
x,
z,
w,
d,
owner=null
){

colliders.push({
x:x,
z:z,
w:w,
d:d,
owner:owner
});

}

function blocked(
x,
z,
radius=.55,
ignore=null
){

for(const c of colliders){

if(c.owner===ignore){
continue;
}

const dx=Math.max(
Math.abs(x-c.x)-c.w/2,
0
);

const dz=Math.max(
Math.abs(z-c.z)-c.d/2,
0
);

if(
dx*dx+dz*dz<
radius*radius
){
return true;
}

}

return false;

}

async function loadGLB(){

if(!GLTFLoader){
return;
}

try{

const loader=
new GLTFLoader();

const gltf=
await loader.loadAsync(
"https://threejs.org/examples/models/gltf/Soldier.glb"
);

const model=gltf.scene;

model.traverse(
o=>{

if(o.isMesh){

o.castShadow=true;
o.receiveShadow=true;

if(o.material){
o.material.roughness=.82;
}

}

}
);

const box=
new THREE.Box3()
.setFromObject(model);

const size=
box.getSize(
new THREE.Vector3()
);

const scale=
1.9/
Math.max(
size.y,
.001
);

model.scale.setScalar(
scale
);

const box2=
new THREE.Box3()
.setFromObject(model);

const center=
box2.getCenter(
new THREE.Vector3()
);

model.position.x=
-center.x;

model.position.z=
-center.z;

model.position.y=
-box2.min.y;

model.rotation.y=
Math.PI;

player.remove(
playerModel
);

playerModel=model;

player.add(
playerModel
);

if(gltf.animations.length){

mixer=
new THREE.AnimationMixer(
playerModel
);

for(
const clip of gltf.animations
){

actions[
clip.name
]=
mixer.clipAction(
clip
);

}

const idleName=
Object.keys(actions)
.find(
n=>
n.toLowerCase()
.includes("idle")
);

if(idleName){

activeAction=
actions[idleName];

activeAction.play();

}

}

}catch(e){

console.log(
"GLB gagal:",
e
);

}

}

function playAnimation(type){

if(!mixer){
return;
}

let wanted=[];

if(type==="run"){

wanted=[
"Run",
"Running",
"run"
];

}else if(type==="walk"){

wanted=[
"Walk",
"Walking",
"walk"
];

}else{

wanted=[
"Idle",
"idle"
];

}

let next=null;

for(
const name of wanted
){

const key=
Object.keys(actions)
.find(
n=>
n.toLowerCase()===
name.toLowerCase()
);

if(key){

next=
actions[key];

break;

}

}

if(
!next||
next===activeAction
){
return;
}

if(activeAction){
activeAction.fadeOut(.15);
}

next.reset();
next.fadeIn(.15);
next.play();

activeAction=next;

}

function movePlayer(dt){

if(activeCar){
return;
}

let x=joyX;
let y=joyY;

if(keys.w||keys.arrowup){
y=-1;
}

if(keys.s||keys.arrowdown){
y=1;
}

if(keys.a||keys.arrowleft){
x=-1;
}

if(keys.d||keys.arrowright){
x=1;
}

const len=
Math.hypot(x,y);

if(len<.08){

playAnimation("idle");

return;

}

x/=len;
y/=len;

const speed=
sprinting
?8.2
:crouching
?2.2
:4.8;

const forwardX=
-Math.sin(yaw);

const forwardZ=
-Math.cos(yaw);

const rightX=
Math.cos(yaw);

const rightZ=
-Math.sin(yaw);

const mx=
rightX*x+
forwardX*(-y);

const mz=
rightZ*x+
forwardZ*(-y);

const nx=
player.position.x+
mx*speed*dt;

const nz=
player.position.z+
mz*speed*dt;

if(
!blocked(
nx,
player.position.z,
.55
)
){
player.position.x=nx;
}

if(
!blocked(
player.position.x,
nz,
.55
)
){
player.position.z=nz;
}

if(
Math.abs(mx)+
Math.abs(mz)>.01
){

player.rotation.y=
Math.atan2(
mx,
mz
);

}

playAnimation(
sprinting
?"run"
:"walk"
);

}

function jump(){

if(
grounded&&
!activeCar
){

jumpVelocity=8.3;

grounded=false;

}

}

function doAction(){

if(actionCooldown>0){
return;
}

actionCooldown=.45;

if(activeCar){
return;
}

let nearest=null;
let nearestDistance=3;

for(
const z of zombies
){

const d=
player.position.distanceTo(
z.group.position
);

if(
d<nearestDistance
){

nearestDistance=d;
nearest=z;

}

}

if(nearest){

const dx=
nearest.group.position.x-
player.position.x;

const dz=
nearest.group.position.z-
player.position.z;

const d=
Math.hypot(dx,dz)||1;

nearest.group.position.x+=
dx/d*1.5;

nearest.group.position.z+=
dz/d*1.5;

return;

}

for(
const c of cars
){

if(
player.position.distanceTo(
c.group.position
)<4.8
){

enterCar(c);

return;

}

}

}

function enterCar(c){

if(activeCar){
return;
}

activeCar=c;

player.visible=false;

document.getElementById(
"enter"
).style.display="none";

document.getElementById(
"exit"
).style.display="block";

document.getElementById(
"status"
).textContent=
"DI DALAM MOBIL";

}

function exitCar(){

if(!activeCar){
return;
}

const c=activeCar;

player.visible=true;

player.position.set(
c.group.position.x-
Math.sin(c.group.rotation.y)*5,
0,
c.group.position.z-
Math.cos(c.group.rotation.y)*5
);

activeCar=null;

document.getElementById(
"enter"
).style.display="block";

document.getElementById(
"exit"
).style.display="none";

document.getElementById(
"status"
).textContent=
"BERJALAN";

}

function driveCar(){

if(!activeCar){
return;
}

const c=activeCar;

let throttle=0;

if(
keys.w||
keys.arrowup||
joyY<-.15
){
throttle=1;
}

if(
keys.s||
keys.arrowdown||
joyY>.15
){
throttle=-.7;
}

c.speed+=
throttle*.035;

c.speed*=.985;

c.speed=
THREE.MathUtils.clamp(
c.speed,
-.6,
1.35
);

let steering=0;

if(
keys.a||
keys.arrowleft||
joyX<-.2
){
steering=1;
}

if(
keys.d||
keys.arrowright||
joyX>.2
){
steering=-1;
}

c.group.rotation.y+=
steering*
.035*
Math.min(
Math.abs(c.speed)*1.4,
1
);

const fx=
Math.sin(
c.group.rotation.y
);

const fz=
Math.cos(
c.group.rotation.y
);

const nx=
c.group.position.x+
fx*c.speed;

const nz=
c.group.position.z+
fz*c.speed;

if(
!blocked(
nx,
nz,
2,
c.group
)
){

c.group.position.x=nx;
c.group.position.z=nz;

}else{

c.speed*=-.2;

}

}

function updateZombies(dt){

for(
const z of zombies
){

const dx=
player.position.x-
z.group.position.x;

const dz=
player.position.z-
z.group.position.z;

const d=
Math.hypot(dx,dz);

if(
d>2.2&&
d<65
){

const nx=dx/d;
const nz=dz/d;

const sx=
z.group.position.x+
nx*z.speed*dt;

const sz=
z.group.position.z+
nz*z.speed*dt;

if(
!blocked(
sx,
z.group.position.z,
.5
)
){
z.group.position.x=sx;
}

if(
!blocked(
z.group.position.x,
sz,
.5
)
){
z.group.position.z=sz;
}

z.group.rotation.y=
Math.atan2(
nx,
nz
);

}

z.attack-=dt;

if(
d<2.3&&
z.attack<=0
){

hp=Math.max(
0,
hp-6
);

z.attack=1.1;

}

}

}

function updateCamera(){

const target=
activeCar
?activeCar.group.position.clone()
:player.position.clone();

target.y+=
activeCar
?1.2
:crouching
?.8
:1.25;

const distance=
activeCar
?6.2
:4.7;

const horizontal=
Math.cos(pitch)*
distance;

const desired=
new THREE.Vector3(
target.x+
Math.sin(yaw)*
horizontal,

target.y+
Math.sin(pitch)*
distance,

target.z+
Math.cos(yaw)*
horizontal
);

const direction=
desired.clone()
.sub(target)
.normalize();

let finalDistance=distance;

const ray=
new THREE.Raycaster(
target,
direction,
.2,
distance
);

const hits=
ray.intersectObjects(
scene.children,
true
);

for(
const hit of hits
){

if(
hit.object===ground||
hit.object===playerModel
){
continue;
}

if(
hit.distance<finalDistance
){

finalDistance=
Math.max(
1.2,
hit.distance-.35
);

break;

}

}

camera.position.copy(
target.clone().add(
direction.multiplyScalar(
finalDistance
)
)
);

camera.lookAt(
target
);

}

function updateHUD(){

document.getElementById(
"hpFill"
).style.width=
hp+"%";

document.getElementById(
"foodFill"
).style.width=
hunger+"%";

}

function updatePhysics(dt){

if(!activeCar){

movePlayer(dt);

jumpVelocity-=
20*dt;

player.position.y+=
jumpVelocity*dt;

if(
player.position.y<=0
){

player.position.y=0;

jumpVelocity=0;

grounded=true;

}

}else{

driveCar();

}

updateZombies(dt);

updateCamera();

updateHUD();

actionCooldown=
Math.max(
0,
actionCooldown-dt
);

}

const joystick=
document.getElementById(
"joystick"
);

const stick=
document.getElementById(
"stick"
);

let pointer=null;

function updateJoystick(
x,
y
){

const rect=
joystick.getBoundingClientRect();

const cx=
rect.left+
rect.width/2;

const cy=
rect.top+
rect.height/2;

let dx=x-cx;
let dy=y-cy;

const max=48;

const len=
Math.hypot(dx,dy);

if(len>max){

dx=dx/len*max;
dy=dy/len*max;

}

stick.style.transform=
"translate("+dx+"px,"+dy+"px)";

joyX=dx/max;
joyY=dy/max;

}

function resetJoystick(){

pointer=null;

stick.style.transform=
"translate(0,0)";

joyX=0;
joyY=0;

}

joystick.addEventListener(
"pointerdown",
e=>{

pointer=e.pointerId;

joystick.setPointerCapture(
e.pointerId
);

updateJoystick(
e.clientX,
e.clientY
);

}
);

joystick.addEventListener(
"pointermove",
e=>{

if(
e.pointerId===pointer
){

updateJoystick(
e.clientX,
e.clientY
);

}

}
);

joystick.addEventListener(
"pointerup",
resetJoystick
);

joystick.addEventListener(
"pointercancel",
resetJoystick
);

renderer.domElement.addEventListener(
"pointerdown",
e=>{

if(
e.clientX<
innerWidth*.38
){
return;
}

cameraDrag=true;

lastX=e.clientX;
lastY=e.clientY;

}
);

renderer.domElement.addEventListener(
"pointermove",
e=>{

if(!cameraDrag){
return;
}

const dx=
e.clientX-lastX;

const dy=
e.clientY-lastY;

lastX=e.clientX;
lastY=e.clientY;

yaw-=dx*.006;

pitch-=dy*.005;

pitch=
THREE.MathUtils.clamp(
pitch,
-1.05,
.75
);

}
);

renderer.domElement.addEventListener(
"pointerup",
()=>{
cameraDrag=false;
}
);

renderer.domElement.addEventListener(
"pointercancel",
()=>{
cameraDrag=false;
}
);

document.getElementById(
"jump"
).addEventListener(
"pointerdown",
jump
);

document.getElementById(
"crouch"
).addEventListener(
"pointerdown",
()=>{
crouching=!crouching;
}
);

const sprintButton=
document.getElementById(
"sprint"
);

sprintButton.addEventListener(
"pointerdown",
()=>{
sprinting=true;
}
);

sprintButton.addEventListener(
"pointerup",
()=>{
sprinting=false;
}
);

sprintButton.addEventListener(
"pointercancel",
()=>{
sprinting=false;
}
);

document.getElementById(
"action"
).addEventListener(
"pointerdown",
doAction
);

document.getElementById(
"enter"
).addEventListener(
"pointerdown",
()=>{

for(
const c of cars
){

if(
player.position.distanceTo(
c.group.position
)<4.8
){

enterCar(c);

return;

}

}

}
);

document.getElementById(
"exit"
).addEventListener(
"pointerdown",
exitCar
);

document.getElementById(
"fullscreen"
).addEventListener(
"click",
async()=>{

try{

if(!document.fullscreenElement){

await document.documentElement.requestFullscreen();

}else{

await document.exitFullscreen();

}

}catch(e){}

}
);

document.getElementById(
"exit"
).style.display="none";

function loop(){

requestAnimationFrame(loop);

const dt=
Math.min(
clock.getDelta(),
.033
);

if(mixer){
mixer.update(dt);
}

updatePhysics(dt);

renderer.render(
scene,
camera
);

}

addEventListener(
"resize",
()=>{

camera.aspect=
innerWidth/innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
innerWidth,
innerHeight
);

}
);

document.getElementById(
"loading"
).style.display="none";

loop();

</script>

</body>
</html>
