<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Virelia: Afterfall</title>

<style>
*{
 box-sizing:border-box;
 user-select:none;
 -webkit-tap-highlight-color:transparent;
}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:#111;
 font-family:Arial,sans-serif;
 touch-action:none;
}

#game{
 position:relative;
 width:100vw;
 height:100vh;
 overflow:hidden;
 background:#202b25;
}

canvas{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
}

#hud{
 position:absolute;
 inset:0;
 pointer-events:none;
}

/* =========================
   TOP HUD
========================= */

#topLeft{
 position:absolute;
 left:14px;
 top:14px;
 width:235px;
}

.playerCard{
 display:flex;
 align-items:center;
 gap:9px;
}

.avatar{
 width:42px;
 height:42px;
 border-radius:50%;
 background:
 linear-gradient(#879487 0 45%,#343d37 45%);
 border:2px solid rgba(255,255,255,.65);
}

.playerName{
 color:white;
 font-weight:bold;
 font-size:13px;
}

.smallText{
 color:#bfc6c1;
 font-size:10px;
}

.hpBox{
 margin-top:7px;
 height:14px;
 background:rgba(0,0,0,.55);
 border-radius:8px;
 overflow:hidden;
 border:1px solid rgba(255,255,255,.15);
}

#hpFill{
 height:100%;
 width:100%;
 background:#69b36b;
}

#armorRow{
 margin-top:4px;
 height:6px;
 display:flex;
 gap:3px;
}

.armorPiece{
 height:100%;
 flex:1;
 background:#5d6562;
 border-radius:3px;
}

.armorPiece.active{
 background:#aebd9c;
}

/* =========================
   MATCH INFO
========================= */

#matchInfo{
 position:absolute;
 top:14px;
 right:14px;
 text-align:right;
 color:white;
}

#alive{
 font-size:20px;
 font-weight:bold;
}

#timer{
 font-size:12px;
 color:#c9ceca;
 margin-top:2px;
}

/* =========================
   MINIMAP
========================= */

#miniWrap{
 position:absolute;
 top:70px;
 right:14px;
 width:145px;
 height:145px;
 border-radius:12px;
 overflow:hidden;
 border:2px solid rgba(255,255,255,.5);
 background:#334233;
}

#mini{
 width:100%;
 height:100%;
}

/* =========================
   EQUIPMENT
========================= */

#equipment{
 position:absolute;
 top:70px;
 left:14px;
 width:150px;
 padding:7px;
 background:rgba(10,14,12,.65);
 border-radius:9px;
 color:white;
 font-size:10px;
}

.eq{
 display:flex;
 justify-content:space-between;
 padding:5px 2px;
 border-bottom:1px solid rgba(255,255,255,.08);
}

.eq:last-child{
 border-bottom:0;
}

.eqName{
 color:#9da69f;
}

.eqValue{
 color:white;
 font-weight:bold;
}

/* =========================
   CAMERA AREA
========================= */

#cameraTouch{
 position:absolute;
 right:0;
 top:0;
 width:58%;
 height:72%;
 pointer-events:auto;
}

/* =========================
   ACTIONS
========================= */

#actions{
 position:absolute;
 right:16px;
 bottom:18px;
 display:grid;
 grid-template-columns:repeat(2,72px);
 gap:9px;
 pointer-events:auto;
}

button{
 min-width:64px;
 min-height:50px;
 border-radius:13px;
 border:1px solid rgba(255,255,255,.18);
 background:rgba(12,16,14,.72);
 color:white;
 font-size:10px;
 font-weight:bold;
}

button:active{
 transform:scale(.94);
 background:rgba(100,110,100,.85);
}

.bigAction{
 width:76px;
 height:58px;
}

#attack{
 border-radius:50%;
 width:76px;
 height:76px;
 min-width:76px;
}

/* =========================
   MOVEMENT
========================= */

#movePad{
 position:absolute;
 left:18px;
 bottom:20px;
 width:175px;
 height:175px;
 pointer-events:auto;
}

.move{
 position:absolute;
 width:56px;
 height:56px;
 min-width:56px;
 border-radius:50%;
}

#up{
 left:60px;
 top:0;
}

#left{
 left:0;
 top:60px;
}

#down{
 left:60px;
 top:120px;
}

#right{
 right:0;
 top:60px;
}

/* =========================
   STAMINA
========================= */

#staminaBox{
 position:absolute;
 left:50%;
 bottom:18px;
 transform:translateX(-50%);
 width:180px;
 height:7px;
 background:rgba(0,0,0,.55);
 border-radius:5px;
 overflow:hidden;
}

#staminaFill{
 height:100%;
 width:100%;
 background:#d8c65d;
}

/* =========================
   CENTER
========================= */

#crosshair{
 position:absolute;
 left:50%;
 top:50%;
 transform:translate(-50%,-50%);
 width:18px;
 height:18px;
}

#crosshair:before,
#crosshair:after{
 content:"";
 position:absolute;
 background:rgba(255,255,255,.72);
}

#crosshair:before{
 width:2px;
 height:18px;
 left:8px;
}

#crosshair:after{
 height:2px;
 width:18px;
 top:8px;
}

/* =========================
   MESSAGE
========================= */

#message{
 position:absolute;
 left:50%;
 top:17%;
 transform:translateX(-50%);
 padding:9px 15px;
 color:white;
 background:rgba(10,12,11,.78);
 border-radius:9px;
 opacity:0;
 transition:.2s;
 font-size:12px;
}

#message.show{
 opacity:1;
}

/* =========================
   INVENTORY
========================= */

#inventory{
 display:none;
 position:absolute;
 left:50%;
 top:50%;
 transform:translate(-50%,-50%);
 width:min(430px,88vw);
 max-height:75vh;
 overflow:auto;
 background:rgba(12,16,14,.94);
 border:1px solid rgba(255,255,255,.18);
 border-radius:15px;
 padding:16px;
 color:white;
 pointer-events:auto;
}

#inventory.show{
 display:block;
}

.invGrid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:8px;
}

.invItem{
 padding:12px;
 background:rgba(255,255,255,.06);
 border-radius:9px;
}

.invTitle{
 font-weight:bold;
}

.invSub{
 color:#aeb5b0;
 font-size:10px;
 margin-top:3px;
}

/* =========================
   START
========================= */

#start{
 position:absolute;
 inset:0;
 z-index:50;
 display:flex;
 justify-content:center;
 align-items:center;
 background:
 radial-gradient(circle at center,#35483a,#101411 72%);
 color:white;
}

.startBox{
 width:min(440px,90vw);
 text-align:center;
 padding:30px;
}

.startBox h1{
 margin:0;
 font-size:38px;
 letter-spacing:5px;
}

.startBox h2{
 margin:3px 0 20px;
 font-size:12px;
 letter-spacing:6px;
 color:#aeb8b0;
}

.startBox p{
 color:#aeb6b0;
 font-size:12px;
 line-height:1.6;
}

#startButton{
 width:100%;
 height:55px;
 margin-top:16px;
 background:#687d67;
}

/* =========================
   LOADING
========================= */

#loading{
 display:none;
 position:absolute;
 inset:0;
 z-index:60;
 justify-content:center;
 align-items:center;
 text-align:center;
 background:#111;
 color:white;
}

#loading.show{
 display:flex;
}

@media(max-width:600px){

 #equipment{
  display:none;
 }

 #miniWrap{
  width:115px;
  height:115px;
 }

 #topLeft{
  width:190px;
 }

 .playerName{
  font-size:11px;
 }

}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<div id="hud">

 <!-- PLAYER -->
 <div id="topLeft">

  <div class="playerCard">

   <div class="avatar"></div>

   <div>
    <div class="playerName">VIRELIA SURVIVOR</div>
    <div class="smallText">PLAYER 01</div>
   </div>

  </div>

  <div class="hpBox">
   <div id="hpFill"></div>
  </div>

  <div id="armorRow">
   <div id="helmetArmor" class="armorPiece"></div>
   <div id="vestArmor" class="armorPiece"></div>
   <div id="shoesArmor" class="armorPiece"></div>
   <div id="backpackArmor" class="armorPiece"></div>
  </div>

 </div>

 <!-- MATCH -->
 <div id="matchInfo">
  <div id="alive">70 ALIVE</div>
  <div id="timer">20:00</div>
 </div>

 <!-- EQUIPMENT -->
 <div id="equipment">

  <div class="eq">
   <span class="eqName">HELMET</span>
   <span id="helmetText" class="eqValue">—</span>
  </div>

  <div class="eq">
   <span class="eqName">VEST</span>
   <span id="vestText" class="eqValue">—</span>
  </div>

  <div class="eq">
   <span class="eqName">SHOES</span>
   <span id="shoesText" class="eqValue">—</span>
  </div>

  <div class="eq">
   <span class="eqName">BACKPACK</span>
   <span id="backpackText" class="eqValue">—</span>
  </div>

 </div>

 <!-- MINIMAP -->

  <canvas id="mini"></canvas>
 </div>

 <div id="crosshair"></div>

 <!-- STAMINA -->
 <div id="staminaBox">
  <div id="staminaFill"></div>
 </div>

</div>


<!-- CAMERA TOUCH -->
<div id="cameraTouch"></div>


<!-- MOVEMENT -->
<div id="movePad">

 <button id="up" class="move">▲</button>
 <button id="left" class="move">◀</button>
 <button id="down" class="move">▼</button>
 <button id="right" class="move">▶</button>

</div>


<!-- ACTIONS -->
<div id="actions">

 <button id="sprint" class="bigAction">
  LARI
 </button>

 <button id="loot" class="bigAction">
  AMBIL
 </button>

 <button id="attack">
  AKSI
 </button>

 <button id="vehicle" class="bigAction">
  KENDARAAN
 </button>

 <button id="bag" class="bigAction">
  TAS
 </button>

</div>


<!-- INVENTORY -->
<div id="inventory">

 <h3>INVENTORY</h3>

 <div id="inventoryGrid"
      class="invGrid"></div>

 <br>

 <button id="closeInventory">
  TUTUP
 </button>

</div>


<!-- START -->
<div id="start">

 <div class="startBox">

  <h1>VIRELIA</h1>

  <h2>AFTERFALL</h2>

  <p>
   LARGE-SCALE SURVIVAL WORLD
  </p>

  <p>
   70 survivors • large map •
   dynamic bots • equipment • vehicles
  </p>

  <button id="startButton">
   MASUK MAP
  </button>

 </div>

</div>


<!-- LOADING -->
<div id="loading">

 <div>
  <h2>VIRELIA</h2>
  <p id="loadingText">
   Menyiapkan dunia...
  </p>
 </div>

</div>


<script>

/* =========================================================
   VIRELIA AFTERFALL
   THIRD PERSON SURVIVAL CORE
========================================================= */


/* =========================
   CONFIG
========================= */

const CFG={

 MAP_W:12000,
 MAP_H:10000,

 MAX_PLAYERS:70,

 BOT_COUNT:69,

 VIEW:1700,

 BUILDINGS:220,

 TREES:850,

 LOOT:700,

 VEHICLES:110,

 ROAD:120,

 MATCH_TIME:1200

};


/* =========================
   CANVAS
========================= */

const canvas=
 document.getElementById("canvas");

const ctx=
 canvas.getContext("2d");

const mini=
 document.getElementById("mini");

const mctx=
 mini.getContext("2d");


function resize(){

 const dpr=
  Math.min(devicePixelRatio||1,2);

 canvas.width=
  innerWidth*dpr;

 canvas.height=
  innerHeight*dpr;

 canvas.style.width=
  innerWidth+"px";

 canvas.style.height=
  innerHeight+"px";

 ctx.setTransform(
  dpr,0,0,dpr,0,0
 );

 mini.width=230;
 mini.height=230;

}

addEventListener("resize",resize);

resize();


/* =========================
   HELPERS
========================= */

function rand(a,b){
 return a+Math.random()*(b-a);
}

function clamp(v,a,b){
 return Math.max(a,Math.min(b,v));
}

function distance(a,b){

 return Math.hypot(
  a.x-b.x,
  a.y-b.y
 );

}

function timeText(v){

 v=Math.max(0,Math.floor(v));

 const m=
  Math.floor(v/60)
   .toString()
   .padStart(2,"0");

 const s=
  (v%60)
   .toString()
   .padStart(2,"0");

 return m+":"+s;

}


/* =========================================================
   PLAYER
========================================================= */

const player={

 x:CFG.MAP_W/2,

 y:CFG.MAP_H/2,

 radius:18,

 hp:100,

 maxHp:100,

 stamina:100,

 maxStamina:100,

 speed:3.2,

 sprint:5.4,

 direction:0,

 helmet:null,

 vest:null,

 shoes:null,

 backpack:null,

 inventory:[],

 vehicle:null,

 attackCooldown:0

};


/* =========================================================
   CAMERA
========================================================= */

const camera={

 x:player.x,

 y:player.y,

 angle:0,

 distance:230,

 height:100,

 zoom:1

};


/*
   Camera bukan lagi kamera top-down.

   Dunia diproyeksikan berdasarkan arah kamera.
   Player selalu berada dekat bawah-tengah layar.
*/

function worldToScreen(x,y){

 const dx=x-camera.x;
 const dy=y-camera.y;

 const cos=Math.cos(camera.angle);
 const sin=Math.sin(camera.angle);

 const rx=
  dx*cos-
  dy*sin;

 const ry=
  dx*sin+
  dy*cos;

 const horizon=
  innerHeight*.57;

 return{

  x:
   innerWidth/2+
   rx*camera.zoom,

  y:
   horizon+
   ry*camera.zoom

 };

}


/* =========================================================
   CAMERA TOUCH
========================================================= */

let camDragging=false;
let camLastX=0;
let camLastY=0;


const cameraTouch=
 document.getElementById("cameraTouch");


cameraTouch.addEventListener(
 "pointerdown",
 e=>{

  camDragging=true;

  camLastX=e.clientX;
  camLastY=e.clientY;

  cameraTouch.setPointerCapture(
   e.pointerId
  );

 }
);


cameraTouch.addEventListener(
 "pointermove",
 e=>{

  if(!camDragging)return;

  const dx=
   e.clientX-camLastX;

  const dy=
   e.clientY-camLastY;

  camLastX=e.clientX;
  camLastY=e.clientY;

  camera.angle+=dx*.008;

  camera.height=
   clamp(
    camera.height-dy*.35,
    55,
    150
   );

 }
);


cameraTouch.addEventListener(
 "pointerup",
 ()=>{

  camDragging=false;

 }
);


/* =========================================================
   INPUT
========================================================= */

const input={

 up:false,
 down:false,
 left:false,
 right:false,
 sprint:false

};


function bindMove(id,key){

 const el=
  document.getElementById(id);

 el.addEventListener(
  "pointerdown",
  e=>{

   e.preventDefault();

   input[key]=true;

 }
 );

 el.addEventListener(
  "pointerup",
  e=>{

   e.preventDefault();

   input[key]=false;

 }
 );

 el.addEventListener(
  "pointercancel",
  ()=>{
   input[key]=false;
 }
 );

}


bindMove("up","up");
bindMove("down","down");
bindMove("left","left");
bindMove("right","right");


document
 .getElementById("sprint")
 .addEventListener(
  "pointerdown",
  ()=>input.sprint=true
 );

document
 .getElementById("sprint")
 .addEventListener(
  "pointerup",
  ()=>input.sprint=false
 );


addEventListener(
 "keydown",
 e=>{

  if(e.key==="w"||e.key==="ArrowUp")
   input.up=true;

  if(e.key==="s"||e.key==="ArrowDown")
   input.down=true;

  if(e.key==="a"||e.key==="ArrowLeft")
   input.left=true;

  if(e.key==="d"||e.key==="ArrowRight")
   input.right=true;

  if(e.key==="Shift")
   input.sprint=true;

 }
);


addEventListener(
 "keyup",
 e=>{

  if(e.key==="w"||e.key==="ArrowUp")
   input.up=false;

  if(e.key==="s"||e.key==="ArrowDown")
   input.down=false;

  if(e.key==="a"||e.key==="ArrowLeft")
   input.left=false;

  if(e.key==="d"||e.key==="ArrowRight")
   input.right=false;

  if(e.key==="Shift")
   input.sprint=false;

 }
);


/* =========================================================
   WORLD
========================================================= */

const world={

 roads:[],
 buildings:[],
 trees:[],
 loot:[],
 vehicles:[],
 bots:[]

};


/* =========================================================
   ROAD
========================================================= */

function nearRoad(x,y,pad=100){

 for(const r of world.roads){

  if(
   x>r.x-r.w/2-pad &&
   x<r.x+r.w/2+pad &&
   y>r.y-r.h/2-pad &&
   y<r.y+r.h/2+pad
  )
   return true;

 }

 return false;

}


/* =========================================================
   BUILD WORLD
========================================================= */

function buildWorld(){

 world.roads.length=0;
 world.buildings.length=0;
 world.trees.length=0;
 world.loot.length=0;
 world.vehicles.length=0;
 world.bots.length=0;


 /* roads */

 for(
  let x=500;
  x<CFG.MAP_W;
  x+=1000
 ){

  world.roads.push({

   x,

   y:CFG.MAP_H/2,

   w:CFG.ROAD,

   h:CFG.MAP_H

  });

 }


 for(
  let y=500;
  y<CFG.MAP_H;
  y+=1000
 ){

  world.roads.push({

   x:CFG.MAP_W/2,

   y,

   w:CFG.MAP_W,

   h:CFG.ROAD

  });

 }


 /* buildings */

 for(
  let i=0;
  i<CFG.BUILDINGS;
  i++
 ){

  let x,y;

  for(let t=0;t<30;t++){

   x=rand(100,CFG.MAP_W-100);
   y=rand(100,CFG.MAP_H-100);

   if(!nearRoad(x,y,160))
    break;

  }

  const large=
   Math.random()<.38;

  world.buildings.push({

   x,
   y,

   w:
    large?
     rand(180,360):
     rand(80,170),

   h:
    large?
     rand(180,330):
     rand(80,170),

   large

  });

 }


 /* trees */

 for(
  let i=0;
  i<CFG.TREES;
  i++
 ){

  const x=
   rand(30,CFG.MAP_W-30);

  const y=
   rand(30,CFG.MAP_H-30);

  if(!nearRoad(x,y,70)){

   world.trees.push({

    x,
    y,
    r:rand(10,25)

   });

  }

 }


 /* vehicles */

 for(
  let i=0;
  i<CFG.VEHICLES;
  i++
 ){

  const horizontal=
   Math.random()<.5;

  let x,y;

  if(horizontal){

   y=
    Math.round(
     rand(500,CFG.MAP_H-500)/1000
    )*1000;

   x=
    rand(100,CFG.MAP_W-100);

  }else{

   x=
    Math.round(
     rand(500,CFG.MAP_W-500)/1000
    )*1000;

   y=
    rand(100,CFG.MAP_H-100);

  }

  world.vehicles.push({

   x,
   y,

   angle:
    horizontal?
     0:
     Math.PI/2,

   occupied:false

  });

 }


 /* loot */

 const types=[

  {
   name:"Helmet",
   slot:"helmet",
   value:15
  },

  {
   name:"Vest",
   slot:"vest",
   value:20
  },

  {
   name:"Shoes",
   slot:"shoes",
   value:10
  },

  {
   name:"Backpack",
   slot:"backpack",
   value:30
  },

  {
   name:"Food",
   slot:"food",
   value:20
  },

  {
   name:"Medical",
   slot:"medical",
   value:30
  }

 ];


 for(
  let i=0;
  i<CFG.LOOT;
  i++
 ){

  world.loot.push({

   x:rand(30,CFG.MAP_W-30),

   y:rand(30,CFG.MAP_H-30),

   type:
    types[
     Math.floor(
      Math.random()*types.length
     )
    ],

   taken:false

  });

 }


 /* bots */

 for(
  let i=0;
  i<CFG.BOT_COUNT;
  i++
 ){

  world.bots.push(
   createBot(i)
  );

 }

}


/* =========================================================
   BOT
========================================================= */

function createBot(id){

 const angle=
  rand(0,Math.PI*2);

 const radius=
  rand(
   500,
   Math.min(
    CFG.MAP_W,
    CFG.MAP_H
   )*.43
  );

 let x=
  CFG.MAP_W/2+
  Math.cos(angle)*radius;

 let y=
  CFG.MAP_H/2+
  Math.sin(angle)*radius;


 x=clamp(
  x,
  50,
  CFG.MAP_W-50
 );

 y=clamp(
  y,
  50,
  CFG.MAP_H-50
 );


 return{

  id,

  x,
  y,

  hp:100,

  speed:rand(1.8,2.8),

  sprint:rand(3.2,4.7),

  target:null,

  targetX:x,
  targetY:y,

  state:"wander",

  think:rand(.1,1),

  attackCooldown:0,

  alive:true,

  radius:17,

  direction:rand(
   0,
   Math.PI*2
  )

 };

}


/* =========================================================
   BOT TARGET SYSTEM
========================================================= */

function findBotTarget(bot){

 let best=null;
 let bestDistance=Infinity;


 /*
    Player bisa jadi target.
 */

 const playerDistance=
  distance(bot,player);


 if(
  playerDistance<650 &&
  playerDistance<bestDistance
 ){

  best=player;

  bestDistance=playerDistance;

 }


 /*
    Bot mencari bot lain.
 */

 for(const other of world.bots){

  if(other===bot)
   continue;

  if(!other.alive)
   continue;

  const d=
   distance(bot,other);

  if(
   d<700 &&
   d<bestDistance
  ){

   best=other;

   bestDistance=d;

  }

 }


 return best;

}


/* =========================================================
   BOT AI
========================================================= */

function updateBots(dt){

 for(const bot of world.bots){

  if(!bot.alive)
   continue;


  bot.think-=dt;

  bot.attackCooldown=
   Math.max(
    0,
    bot.attackCooldown-dt
   );


  /*
     AI THINK TICK

     Tidak setiap frame.
  */

  if(bot.think<=0){

   bot.think=
    rand(.25,.55);


   const target=
    findBotTarget(bot);


   if(target){

    bot.target=target;

    bot.state="hunt";

   }else{

    bot.target=null;

    bot.state="wander";

    bot.direction+=
     rand(-1,1);

   }


   if(
    bot.state==="wander"
   ){

    bot.targetX=
     bot.x+
     Math.cos(bot.direction)*
     rand(100,400);

    bot.targetY=
     bot.y+
     Math.sin(bot.direction)*
     rand(100,400);

   }

  }


  let speed=bot.speed;


  if(
   bot.state==="hunt"
  ){

   speed=bot.sprint;

   if(bot.target){

    bot.targetX=
     bot.target.x;

    bot.targetY=
     bot.target.y;

   }

  }


  const dx=
   bot.targetX-bot.x;

  const dy=
   bot.targetY-bot.y;

  const d=
   Math.hypot(dx,dy);


  /*
     Berhenti dekat target
     lalu melakukan combat abstrak.
  */

  if(
   bot.state==="hunt" &&
   bot.target &&
   d<55
  ){

   botAttack(
    bot,
    bot.target
   );

  }else if(d>8){

   bot.x+=
    dx/d*
    speed*
    dt*60;

   bot.y+=
    dy/d*
    speed*
    dt*60;

  }


  bot.x=
   clamp(
    bot.x,
    25,
    CFG.MAP_W-25
   );

  bot.y=
   clamp(
    bot.y,
    25,
    CFG.MAP_H-25
   );

 }

}


/* =========================================================
   BOT COMBAT
========================================================= */

/*
   Combat dibuat abstrak:
   tidak ada darah/gore.
   "AKSI" hanya mengurangi HP.
*/

function botAttack(attacker,target){

 if(
  attacker.attackCooldown>0
 )
  return;


 attacker.attackCooldown=
  .9;


 const damage=
  rand(5,10);


 if(
  target===player
 ){

  receivePlayerDamage(
   damage
  );

 }else{

  target.hp=
   Math.max(
    0,
    target.hp-damage
   );


  if(target.hp<=0){

   target.alive=false;

  }

 }

}


/* =========================================================
   PLAYER COMBAT
========================================================= */

function playerAttack(){

 if(
  player.attackCooldown>0
 )
  return;


 player.attackCooldown=
  .65;


 let target=null;
 let best=70;


 /*
    Target bisa bot.
 */

 for(const bot of world.bots){

  if(!bot.alive)
   continue;

  const d=
   distance(
    player,
    bot
   );

  if(d<best){

   best=d;
   target=bot;

  }

 }


 if(!target){

  showMessage(
   "Tidak ada lawan di dekatmu"
  );

  return;

 }


 target.hp=
  Math.max(
   0,
   target.hp-rand(10,18)
  );


 if(target.hp<=0){

  target.alive=false;

  showMessage(
   "Lawan tersingkir"
  );

 }else{

  showMessage(
   "Serangan mengenai lawan"
  );

 }

}


/* =========================================================
   PLAYER DAMAGE
========================================================= */

function receivePlayerDamage(damage){

 /*
    Vest mengurangi damage.
 */

 let reduction=0;

 if(player.vest)
  reduction=.25;

 if(player.helmet)
  reduction+=.10;


 damage*=
  1-reduction;


 player.hp=
  Math.max(
   0,
   player.hp-damage
  );

}


/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function updatePlayer(dt){

 let x=0;
 let y=0;


 if(input.up)y--;
 if(input.down)y++;
 if(input.left)x--;
 if(input.right)x++;


 if(x!==0||y!==0){

  const len=
   Math.hypot(x,y);

  x/=len;
  y/=len;


  /*
     Movement relatif terhadap
     arah kamera.
  */

  const cos=
   Math.cos(camera.angle);

  const sin=
   Math.sin(camera.angle);


  const worldX=
   x*cos-
   y*sin;

  const worldY=
   x*sin+
   y*cos;


  let speed=
   player.speed;


  if(
   input.sprint &&
   player.stamina>0
  ){

   speed=
    player.sprint;

   player.stamina=
    Math.max(
     0,
     player.stamina-
     25*dt
    );

  }else{

   player.stamina=
    Math.min(
     player.maxStamina,
     player.stamina+
     17*dt
    );

  }


  if(player.shoes)
   speed*=1.08;


  player.x+=
   worldX*
   speed*
   dt*60;

  player.y+=
   worldY*
   speed*
   dt*60;


  player.direction=
   Math.atan2(
    worldY,
    worldX
   );

 }else{

  player.stamina=
   Math.min(
    player.maxStamina,
    player.stamina+
    20*dt
   );

 }


 player.x=
  clamp(
   player.x,
   20,
   CFG.MAP_W-20
  );

 player.y=
  clamp(
   player.y,
   20,
   CFG.MAP_H-20
  );


 if(player.vehicle){

  player.vehicle.x=
   player.x;

  player.vehicle.y=
   player.y;

 }

}


/* =========================================================
   CAMERA FOLLOW
========================================================= */

function updateCamera(){

 /*
    Kamera berada sedikit di belakang
    arah gerak karakter.

    Player digambar di bawah-tengah.
 */

 const followDistance=
  190;


 const targetX=
  player.x-
  Math.cos(player.direction)*
  followDistance;

 const targetY=
  player.y-
  Math.sin(player.direction)*
  followDistance;


 camera.x+=
  (targetX-camera.x)*.11;

 camera.y+=
  (targetY-camera.y)*.11;

}


/* =========================================================
   LOOT
========================================================= */

function lootAction(){

 let nearest=null;
 let best=85;


 for(const item of world.loot){

  if(item.taken)
   continue;


  const d=
   distance(
    player,
    item
   );


  if(
   d<best
  ){

   best=d;
   nearest=item;

  }

 }


 if(!nearest){

  showMessage(
   "Tidak ada loot di dekatmu"
  );

  return;

 }


 const type=
  nearest.type;


 /*
    EQUIPMENT LANGSUNG DIPAKAI
 */

 if(
  type.slot==="helmet" ||
  type.slot==="vest" ||
  type.slot==="shoes" ||
  type.slot==="backpack"
 ){

  /*
     Kalau slot sudah penuh,
     loot tidak diambil.
  */

  if(player[type.slot]){

   showMessage(
    type.name+
    " sudah terpasang"
   );

   return;

  }


  player[type.slot]=type;

  nearest.taken=true;

  showMessage(
   type.name+
   " langsung dipakai"
  );

  updateEquipment();

  return;

 }


 /*
    Consumable masuk inventory.
 */

 nearest.taken=true;

 player.inventory.push(
  type.name
 );

 showMessage(
  type.name+
  " masuk inventory"
 );

}


/* =========================================================
   EQUIPMENT UI
========================================================= */

function updateEquipment(){

 const slots=[
  "helmet",
  "vest",
  "shoes",
  "backpack"
 ];


 for(const slot of slots){

  const item=
   player[slot];


  document
   .getElementById(
    slot+"Text"
   )
   .textContent=
    item?
     item.name:
     "—";


  const armor=
   document
    .getElementById(
     slot+"Armor"
    );


  if(item)
   armor.classList.add(
    "active"
   );
  else
   armor.classList.remove(
    "active"
   );

 }

}


/* =========================================================
   INVENTORY
========================================================= */

function updateInventory(){

 const grid=
  document.getElementById(
   "inventoryGrid"
  );

 grid.innerHTML="";


 if(
  player.inventory.length===0
 ){

  grid.innerHTML=
   '<div class="invItem">'+
   '<div class="invTitle">'+
   'Kosong'+
   '</div>'+
   '</div>';

  return;

 }


 const count={};


 for(
  const item of player.inventory
 ){

  count[item]=
   (count[item]||0)+1;

 }


 for(
  const name in count
 ){

  const div=
   document.createElement(
    "div"
   );

  div.className="invItem";

  div.innerHTML=
   '<div class="invTitle">'+
   name+
   ' × '+
   count[name]+
   '</div>'+
   '<div class="invSub">'+
   'Consumable'+
   '</div>';

  grid.appendChild(div);

 }

}

   VEHICLE
========================================================= */

function vehicleAction(){

 if(player.vehicle){

  player.vehicle.occupied=
   false;

  player.vehicle=
   null;

  showMessage(
   "Keluar kendaraan"
  );

  return;

 }


 let nearest=null;
 let best=90;


 for(
  const vehicle
  of world.vehicles
 ){

  if(vehicle.occupied)
   continue;


  const d=
   distance(
    player,
    vehicle
   );


  if(d<best){

   best=d;
   nearest=vehicle;

  }

 }


 if(!nearest){

  showMessage(
   "Tidak ada kendaraan"
  );

  return;

 }


 nearest.occupied=true;

 player.vehicle=
  nearest;

 showMessage(
  "Masuk kendaraan"
 );

}


/* =========================================================
   SAFE ZONE
========================================================= */

const zone={

 x:CFG.MAP_W/2,

 y:CFG.MAP_H/2,

 radius:4700,

 target:4700,

 timer:0

};


function updateZone(dt){

 zone.timer+=dt;


 if(zone.timer>120){

  zone.target=
   Math.max(
    650,
    4700-
    (zone.timer-120)*2.2
   );

 }


 zone.radius+=
  (
   zone.target-zone.radius
  )*
  dt*.15;


 const d=
  Math.hypot(
   player.x-zone.x,
   player.y-zone.y
  );


 if(d>zone.radius){

  receivePlayerDamage(
   3*dt
  );

 }

}

let messageTimer=0;


function showMessage(text){

 const el=
  document.getElementById(
   "message"
  );

 el.textContent=text;

 el.classList.add("show");

 messageTimer=1.7;

}


function updateMessage(dt){

 if(messageTimer<=0)
  return;

 messageTimer-=dt;

 if(messageTimer<=0){

  document
   .getElementById(
    "message"
   )
   .classList.remove(
    "show"
   );

 }

}


/* =========================================================
   DRAW
========================================================= */

function draw(){

 const w=innerWidth;
 const h=innerHeight;


 ctx.clearRect(
  0,
  0,
  w,
  h
 );


 /*
    Ground
 */

 ctx.fillStyle="#53634f";

 ctx.fillRect(
  0,
  0,
  w,
  h
 );


 /*
    Subtle terrain lines
 */

 const grid=250;

 ctx.strokeStyle=
  "rgba(255,255,255,.025)";

 for(
  let x=
   Math.floor(
    camera.x/grid
   )*grid;

  x<camera.x+1800;

  x+=grid
 ){

  const p=
   worldToScreen(x,camera.y);

  ctx.beginPath();

  ctx.moveTo(p.x,0);
  ctx.lineTo(p.x,h);

  ctx.stroke();

 }


 /*
    Roads
 */

 for(
  const road of world.roads
 ){

  const p=
   worldToScreen(
    road.x-road.w/2,
    road.y-road.h/2
   );


  ctx.fillStyle="#343b38";

  ctx.fillRect(
   p.x,
   p.y,
   road.w*camera.zoom,
   road.h*camera.zoom
  );

 }


 /*
    Buildings
 */

 for(
  const b of world.buildings
 ){

  if(
   Math.abs(
    b.x-camera.x
   )>CFG.VIEW ||
   Math.abs(
    b.y-camera.y
   )>CFG.VIEW
  )
   continue;


  const p=
   worldToScreen(
    b.x-b.w/2,
    b.y-b.h/2
   );


  const width=
   b.w*camera.zoom;

  const height=
   b.h*camera.zoom;


  ctx.fillStyle=
   b.large?
    "#696963":
    "#817b6e";


  ctx.fillRect(
   p.x,
   p.y,
   width,
   height
  );


  /*
     building shadow
  */

  ctx.fillStyle=
   "rgba(0,0,0,.18)";

  ctx.fillRect(
   p.x,
   p.y+height,
   width,
   8
  );

 }


 /*
    Trees
 */

 for(
  const tree of world.trees
 ){

  if(
   Math.abs(
    tree.x-camera.x
   )>CFG.VIEW ||
   Math.abs(
    tree.y-camera.y
   )>CFG.VIEW
  )
   continue;


  const p=
   worldToScreen(
    tree.x,
    tree.y
   );


  ctx.fillStyle="#29422d";

  ctx.beginPath();

  ctx.arc(
   p.x,
   p.y,
   tree.r*camera.zoom,
   0,
   Math.PI*2
  );

  ctx.fill();

 }


 /*
    Vehicles
 */

 for(
  const v of world.vehicles
 ){

  if(
   Math.abs(v.x-camera.x)>CFG.VIEW ||
   Math.abs(v.y-camera.y)>CFG.VIEW
  )
   continue;


  const p=
   worldToScreen(
    v.x,
    v.y
   );


  ctx.save();

  ctx.translate(
   p.x,
   p.y
  );

  ctx.rotate(
   v.angle-camera.angle
  );


  ctx.fillStyle=
   v.occupied?
    "#b59a55":
    "#59676a";


  ctx.fillRect(
   -25*camera.zoom,
   -12*camera.zoom,
   50*camera.zoom,
   24*camera.zoom
  );


  ctx.fillStyle="#222a2b";

  ctx.fillRect(
   -8*camera.zoom,
   -8*camera.zoom,
   16*camera.zoom,
   16*camera.zoom
  );


  ctx.restore();

 }


 /*
    Loot

    Equipment yang slotnya sudah
    penuh dibuat lebih redup.
 */

 for(
  const item of world.loot
 ){

  if(item.taken)
   continue;


  if(
   Math.abs(
    item.x-camera.x
   )>900 ||
   Math.abs(
    item.y-camera.y
   )>900
  )
   continue;


  const p=
   worldToScreen(
    item.x,
    item.y
   );


  let available=true;


  if(
   item.type.slot &&
   item.type.slot!=="food" &&
   item.type.slot!=="medical"
  ){

   if(
    player[item.type.slot]
   )
    available=false;

  }


  ctx.fillStyle=
   available?
    "#d8c25f":
    "rgba(130,130,110,.35)";


  ctx.fillRect(
   p.x-5,
   p.y-5,
   10,
   10
  );

 }


 /*
    BOTS

    Player-like character.
 */

 for(
  const bot of world.bots
 ){

  if(!bot.alive)
   continue;


  if(
   Math.abs(
    bot.x-camera.x
   )>CFG.VIEW ||
   Math.abs(
    bot.y-camera.y
   )>CFG.VIEW
  )
   continue;


  const p=
   worldToScreen(
    bot.x,
    bot.y
   );


  /*
     body
  */

  ctx.fillStyle="#c0c5bd";

  ctx.beginPath();

  ctx.arc(
   p.x,
   p.y,
   13*camera.zoom,
   0,
   Math.PI*2
  );

  ctx.fill();


  /*
     backpack silhouette
  */

  ctx.fillStyle="#4b554d";

  ctx.fillRect(
   p.x-
   9*camera.zoom,
   p.y+
   7*camera.zoom,
   18*camera.zoom,
   9*camera.zoom
  );


  /*
     head
  */

  ctx.fillStyle="#d5c9ad";

  ctx.beginPath();

  ctx.arc(
   p.x,
   p.y-
   13*camera.zoom,
   6*camera.zoom,
   0,
   Math.PI*2
  );

  ctx.fill();


  /*
     target marker
  */

  if(bot.target===player){

   ctx.strokeStyle=
    "rgba(220,90,80,.8)";

   ctx.lineWidth=2;

   ctx.beginPath();

   ctx.arc(
    p.x,
    p.y,
    20*camera.zoom,
    0,
    Math.PI*2
   );

   ctx.stroke();

  }

 }


 /*
    SAFE ZONE

    Digambar terakhir supaya terlihat.
 */

 const zonePoint=
  worldToScreen(
   zone.x,
   zone.y
  );


 const zoneRadius=
  zone.radius*
  camera.zoom;


 ctx.save();

 ctx.fillStyle=
  "rgba(70,120,180,.10)";

 ctx.beginPath();

 ctx.rect(
  0,
  0,
  w,
  h
 );

 ctx.arc(
  zonePoint.x,
  zonePoint.y,
  zoneRadius,
  0,
  Math.PI*2,
  true
 );

 ctx.fill("evenodd");


 ctx.strokeStyle=
  "rgba(130,185,240,.7)";

 ctx.lineWidth=3;

 ctx.beginPath();

 ctx.arc(
  zonePoint.x,
  zonePoint.y,
  zoneRadius,
  0,
  Math.PI*2
 );

 ctx.stroke();

 ctx.restore();


 /*
    PLAYER

    sengaja di bawah-tengah,
    seperti third-person.
 */

 const px=
  w/2;

 const py=
  h*.68;


 /*
    shadow
 */

 ctx.fillStyle=
  "rgba(0,0,0,.3)";

 ctx.beginPath();

 ctx.ellipse(
  px,
  py+16,
  18,
  7,
  0,
  0,
  Math.PI*2
 );

 ctx.fill();


 /*
    body
 */

 ctx.fillStyle="#4e5d54";

 ctx.fillRect(
  px-12,
  py-12,
  24,
  27
 );


 /*
    backpack
 */

 if(player.backpack){

  ctx.fillStyle="#303b34";

  ctx.fillRect(
   px-18,
   py-8,
   8,
   22
  );

 }


 /*
    head
 */

 ctx.fillStyle="#d6c6a8";

 ctx.beginPath();

 ctx.arc(
  px,
  py-21,
  9,
  0,
  Math.PI*2
 );

 ctx.fill();


 /*
    helmet
 */

 if(player.helmet){

  ctx.fillStyle="#56655b";

  ctx.beginPath();

  ctx.arc(
   px,
   py-23,
   11,
   Math.PI,
   0
  );

  ctx.fill();

 }


 /*
    direction indicator
 */

 ctx.strokeStyle=
  "rgba(255,255,255,.7)";

 ctx.lineWidth=2;

 ctx.beginPath();

 ctx.moveTo(
  px,
  py-7
 );

 ctx.lineTo(
  px+
   Math.cos(
    player.direction-camera.angle
   )*22,
  py-
   7+
   Math.sin(
    player.direction-camera.angle
   )*22
 );

 ctx.stroke();


 drawMini();

}


/* =========================================================
   MINIMAP
========================================================= */

function drawMini(){

 const size=230;

 mctx.clearRect(
  0,
  0,
  size,
  size
 );


 mctx.fillStyle="#354536";

 mctx.fillRect(
  0,
  0,
  size,
  size
 );


 const scale=
  size/CFG.MAP_W;


 /*
    roads
 */

 mctx.fillStyle="#4a504c";

 for(
  const r of world.roads
 ){

  mctx.fillRect(
   (r.x-r.w/2)*scale,
   (r.y-r.h/2)*scale,
   r.w*scale,
   r.h*scale
  );

 }


 /*
    buildings
 */

 mctx.fillStyle="#77746b";

 for(
  const b of world.buildings
 ){

  mctx.fillRect(
   (b.x-b.w/2)*scale,
   (b.y-b.h/2)*scale,
   b.w*scale,
   b.h*scale
  );

 }


 /*
    zone
 */

 mctx.strokeStyle="#8dbcf0";

 mctx.lineWidth=2;

 mctx.beginPath();

 mctx.arc(
  zone.x*scale,
  zone.y*scale,
  zone.radius*scale,
  0,
  Math.PI*2
 );

 mctx.stroke();

    enemies
 */

 mctx.fillStyle="#d86b63";

 for(
  const bot of world.bots
 ){

   continue;

   bot.x*scale-1,

   2,

  );

 }


 /*
    player
 */

 mctx.fillStyle="#fff";

 mctx.beginPath();

 mctx.arc(
  player.x*scale,
  player.y*scale,
  4,
  0,
  Math.PI*2
 );

 mctx.fill();

}

/* =========================================================
   GAME LOOP
========================================================= */

let running=false;

let last=0;

let gameTime=
 CFG.MATCH_TIME;


function loop(now){

 if(!running)
  return;


 const dt=
  Math.min(
   .033,
   (now-last)/1000
  );

 last=now;


 gameTime-=dt;


 player.attackCooldown=
  Math.max(
   0,
   player.attackCooldown-dt
  );


 updatePlayer(dt);

 updateBots(dt);

 updateCamera();

 updateZone(dt);

 updateMessage(dt);

 updateHUD();

 draw();


 if(
  player.hp<=0
 ){

  running=false;

  showMessage(
   "Kamu tersingkir"
  );

  return;

 }


 if(gameTime<=0){

  running=false;

  showMessage(
   "Waktu pertandingan selesai"
  );

  return;

 }


 requestAnimationFrame(loop);

}

   START
========================================================= */

document
 .getElementById(
  "startButton"
 )
 .addEventListener(
  "click",
  ()=>{

   document
    .getElementById(
     "start"
    )
    .style.display="none";


   document
    .getElementById(
     "loading"
    )
    .classList.add(
     "show"
    );


   setTimeout(
    ()=>{

     document
      .getElementById(
       "loadingText"
      )
      .textContent=
       "Membangun kota...";

    },
    100
   );


   setTimeout(
    ()=>{

     buildWorld();

     document
      .getElementById(
       "loadingText"
      )
      .textContent=
       "Menyiapkan 70 survivor...";

    },
    300
   );


   setTimeout(
    ()=>{

     document
      .getElementById(
       "loading"
      )
      .classList.remove(
       "show"
      );


     running=true;

     last=
      performance.now();


     requestAnimationFrame(
      loop
     );

    },
    650
   );

  }
);

</script>
