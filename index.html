<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Virelia: Afterfall</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111}
body{font-family:Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;top:14px;left:14px;color:white;font-weight:bold;font-size:14px;z-index:5;text-shadow:0 2px 5px #000}
#prompt{position:fixed;top:13%;left:50%;transform:translateX(-50%);color:white;font-weight:bold;text-shadow:0 2px 5px #000;z-index:5}
#joystick{position:fixed;left:24px;bottom:24px;width:130px;height:130px;border-radius:50%;background:#0008;border:2px solid #fff3;z-index:10}
#stick{position:absolute;width:58px;height:58px;left:34px;top:34px;border-radius:50%;background:#aaa9}
#actions{position:fixed;right:24px;bottom:24px;display:flex;gap:12px;z-index:10}
button{width:82px;height:82px;border-radius:50%;border:2px solid #fff3;background:#111c;color:white;font-weight:bold}
#error{position:fixed;inset:0;background:#090b09;color:white;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:100}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">HP 100<br>HUNGER 100<br>DAY 1</div>
<div id="prompt"></div>

<div id="joystick"><div id="stick"></div></div>

<div id="actions">
<button id="interact">INTERACT</button>
<button id="full">⛶</button>
</div>

<div id="error">
<div>
<h2>Virelia gagal memuat</h2>
<p id="errorText"></p>
</div>
</div>

<script type="module">

const errorBox=document.getElementById("error");
const errorText=document.getElementById("errorText");

async function start(){

try{

const THREE=await import("https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js");

const canvas=document.getElementById("game");

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x202820);
scene.fog=new THREE.Fog(0x202820,65,260);

const camera=new THREE.PerspectiveCamera(
68,
innerWidth/innerHeight,
0.1,
500
);

const renderer=new THREE.WebGLRenderer({
canvas,
antialias:true
});

renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);

scene.add(new THREE.HemisphereLight(0xffffff,0x263326,2.4));

const sun=new THREE.DirectionalLight(0xffffff,2.5);
sun.position.set(40,80,30);
scene.add(sun);

const ground=new THREE.Mesh(
new THREE.PlaneGeometry(280,220),
new THREE.MeshStandardMaterial({
color:0x394638,
roughness:1
})
);

ground.rotation.x=-Math.PI/2;
scene.add(ground);

const buildings=[];
const trees=[];
const cars=[];

function box(w,h,d,color){

return new THREE.Mesh(
new THREE.BoxGeometry(w,h,d),
new THREE.MeshStandardMaterial({
color,
roughness:.85
})
);

}

function building(x,z,w,d,h,color){

const g=new THREE.Group();

const body=box(w,h,d,color);
body.position.y=h/2;
g.add(body);

const roof=box(w+.4,.3,d+.4,0x303030);
roof.position.y=h+.15;
g.add(roof);

g.position.set(x,0,z);
scene.add(g);

buildings.push({x,z,w,d});

}

for(const x of [-55,25]){
for(const z of [-82,-42,22,62]){
building(x,z,28,22,10,0x706d66);
}
}

building(-105,-30,22,26,10,0x626860);
building(-105,30,22,26,10,0x626860);
building(105,-30,22,26,10,0x626860);
building(105,30,22,26,10,0x626860);

function makeTree(x,z){

const g=new THREE.Group();

const trunk=new THREE.Mesh(
new THREE.CylinderGeometry(.8,1,4,8),
new THREE.MeshStandardMaterial({color:0x60472d})
);

trunk.position.y=2;
g.add(trunk);

const crown=new THREE.Mesh(
new THREE.SphereGeometry(4.5,14,14),
new THREE.MeshStandardMaterial({color:0x315c32})
);

crown.position.y=6;
g.add(crown);

g.position.set(x,0,z);
scene.add(g);

trees.push({x,z,r:5});

}

makeTree(-105,-75);
makeTree(-105,75);
makeTree(105,-75);
makeTree(105,75);
makeTree(-35,80);
makeTree(35,-80);

function makeCar(x,z,color){

const g=new THREE.Group();

const body=box(5,1.4,8,color);
body.position.y=1.1;
g.add(body);

const cabin=box(3.8,1.2,4,0x20252a);
cabin.position.y=2.2;
g.add(cabin);

g.position.set(x,0,z);
scene.add(g);

cars.push({mesh:g,x,z,r:4});

}

makeCar(-20,60,0xd5b52c);
makeCar(20,-60,0xb83a35);
makeCar(-80,-20,0x3d6ca8);
makeCar(80,20,0x777777);

const player=new THREE.Group();

const skin=new THREE.MeshStandardMaterial({
color:0xb97855,
roughness:.8
});

const armor=new THREE.MeshStandardMaterial({
color:0x252a2c,
metalness:.65,
roughness:.55
});

const leather=new THREE.MeshStandardMaterial({
color:0x4a3425,
roughness:.9
});

const cloth=new THREE.MeshStandardMaterial({
color:0x171c22,
roughness:1
});

function addPart(geometry,material,x,y,z){

const m=new THREE.Mesh(geometry,material);
m.position.set(x,y,z);
player.add(m);
return m;

}

addPart(
new THREE.CapsuleGeometry(.72,1.25,8,16),
armor,
0,2.35,0
);

addPart(
new THREE.SphereGeometry(.63,24,24),
skin,
0,3.95,0
);

const hair=addPart(
new THREE.SphereGeometry(.67,20,20),
cloth,
0,4.28,0
);

hair.scale.set(1,.58,1);

addPart(
new THREE.TorusGeometry(.72,.13,8,24),
cloth,
0,3.48,0
);

const shoulderL=addPart(
new THREE.SphereGeometry(.5,16,16),
armor,
-.83,2.95,0
);

shoulderL.scale.set(1,.55,1.2);

const shoulderR=shoulderL.clone();
shoulderR.position.x=.83;
player.add(shoulderR);

addPart(
new THREE.BoxGeometry(.42,1.65,.42),
armor,
-.96,2.15,0
);

addPart(
new THREE.BoxGeometry(.42,1.65,.42),
armor,
.96,2.15,0
);

addPart(
new THREE.BoxGeometry(1.75,.25,.55),
leather,
0,1.72,0
);

addPart(
new THREE.BoxGeometry(.65,1.8,.55),
cloth,
-.4,.72,0
);

addPart(
new THREE.BoxGeometry(.65,1.8,.55),
cloth,
.4,.72,0
);

addPart(
new THREE.BoxGeometry(.7,.28,1),
leather,
-.4,.05,-.12
);

addPart(
new THREE.BoxGeometry(.7,.28,1),
leather,
.4,.05,-.12
);

player.position.set(0,0,20);
scene.add(player);

const zombies=[];

for(let i=0;i<6;i++){

const z=new THREE.Group();

const body=new THREE.Mesh(
new THREE.CapsuleGeometry(.55,1.2,6,12),
new THREE.MeshStandardMaterial({color:0x596556})
);

body.position.y=1.7;
z.add(body);

const head=new THREE.Mesh(
new THREE.SphereGeometry(.48,16,16),
new THREE.MeshStandardMaterial({color:0x78806d})
);

head.position.y=3.05;
z.add(head);

z.position.set(
[-100,-70,70,100,45,-45][i],
0,
[-20,40,-35,35,75,-75][i]
);

scene.add(z);
zombies.push(z);

}

const playerRadius=1.05;

function blocked(x,z){

if(x<-134||x>134||z<-104||z>104)return true;

for(const b of buildings){

if(
x>b.x-b.w/2-playerRadius &&
x<b.x+b.w/2+playerRadius &&
z>b.z-b.d/2-playerRadius &&
z<b.z+b.d/2+playerRadius
)return true;

}

for(const t of trees){

if(Math.hypot(x-t.x,z-t.z)<t.r+playerRadius)
return true;

}

for(const c of cars){

if(Math.hypot(x-c.x,z-c.z)<c.r+playerRadius)
return true;

}

return false;

}

const keys={};

addEventListener("keydown",e=>{
keys[e.key.toLowerCase()]=true;
});

addEventListener("keyup",e=>{
keys[e.key.toLowerCase()]=false;
});

let joyX=0;
let joyY=0;

const joy=document.getElementById("joystick");
const stick=document.getElementById("stick");

function updateJoystick(e){

const r=joy.getBoundingClientRect();

let x=e.clientX-r.left-r.width/2;
let y=e.clientY-r.top-r.height/2;

const max=45;
const len=Math.hypot(x,y);

if(len>max){
x=x/len*max;
y=y/len*max;
}

stick.style.transform=`translate(${x}px,${y}px)`;

joyX=x/max;
joyY=y/max;

}

joy.addEventListener("pointerdown",e=>{
joy.setPointerCapture(e.pointerId);
updateJoystick(e);
});

joy.addEventListener("pointermove",e=>{
if(e.buttons)updateJoystick(e);
});

joy.addEventListener("pointerup",()=>{
joyX=0;
joyY=0;
stick.style.transform="translate(0,0)";
});

let yaw=0;
let pitch=.35;

let camTouch=null;

canvas.addEventListener("pointerdown",e=>{

if(e.clientX<innerWidth*.42)return;

camTouch={
x:e.clientX,
y:e.clientY,
id:e.pointerId
};

canvas.setPointerCapture(e.pointerId);

});

canvas.addEventListener("pointermove",e=>{

if(!camTouch)return;
if(e.pointerId!==camTouch.id)return;

const dx=e.clientX-camTouch.x;
const dy=e.clientY-camTouch.y;

yaw-=dx*.008;
pitch-=dy*.006;

pitch=Math.max(-.65,Math.min(1.05,pitch));

camTouch.x=e.clientX;
camTouch.y=e.clientY;

});

canvas.addEventListener("pointerup",()=>{
camTouch=null;
});

canvas.addEventListener("pointercancel",()=>{
camTouch=null;
});

document.getElementById("full").onclick=()=>{
if(document.documentElement.requestFullscreen)
document.documentElement.requestFullscreen();
};

function movePlayer(){

let ix=joyX;
let iy=joyY;

if(keys.w||keys.arrowup)iy=-1;
if(keys.s||keys.arrowdown)iy=1;
if(keys.a||keys.arrowleft)ix=-1;
if(keys.d||keys.arrowright)ix=1;

const len=Math.hypot(ix,iy);

if(len<.05)return;

ix/=len;
iy/=len;

const forwardX=-Math.sin(yaw);
const forwardZ=-Math.cos(yaw);

const rightX=Math.cos(yaw);
const rightZ=-Math.sin(yaw);

const mx=forwardX*(-iy)+rightX*ix;
const mz=forwardZ*(-iy)+rightZ*ix;

const speed=.18;

const nx=player.position.x+mx*speed;
const nz=player.position.z+mz*speed;

if(!blocked(nx,player.position.z))
player.position.x=nx;

if(!blocked(player.position.x,nz))
player.position.z=nz;

player.rotation.y=Math.atan2(mx,mz);

}

function updateZombies(){

for(const z of zombies){

const dx=player.position.x-z.position.x;
const dz=player.position.z-z.position.z;
const d=Math.hypot(dx,dz);

if(d<3||d>100)continue;

const nx=z.position.x+dx/d*.025;
const nz=z.position.z+dz/d*.025;

if(!blocked(nx,nz)){
z.position.x=nx;
z.position.z=nz;
}

z.rotation.y=Math.atan2(dx,dz);

}

}

function updateCamera(){

const distance=8;
const targetY=2.1;

const horizontal=Math.cos(pitch)*distance;

const desiredX=
player.position.x+
Math.sin(yaw)*horizontal;

const desiredZ=
player.position.z+
Math.cos(yaw)*horizontal;

const desiredY=
player.position.y+
targetY+
Math.sin(pitch)*distance+
2.2;

camera.position.x+=(desiredX-camera.position.x)*.12;
camera.position.y+=(desiredY-camera.position.y)*.12;
camera.position.z+=(desiredZ-camera.position.z)*.12;

camera.lookAt(
player.position.x,
player.position.y+targetY,
player.position.z
);

}

function animate(){

requestAnimationFrame(animate);

movePlayer();
updateZombies();
updateCamera();

renderer.render(scene,camera);

}

addEventListener("resize",()=>{

camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);

});

animate();

}catch(e){

console.error(e);
errorBox.style.display="flex";
errorText.textContent=e.message;

}

}

start();

</script>
</body>
</html>
