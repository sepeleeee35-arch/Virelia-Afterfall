<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#090b09">
<title>Virelia: Afterfall</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b09;font-family:Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
#controls{position:fixed;inset:0;z-index:20;pointer-events:none}
#joystick{position:absolute;left:28px;bottom:28px;width:138px;height:138px;border-radius:50%;background:rgba(15,15,15,.45);border:2px solid rgba(255,255,255,.18);pointer-events:auto;touch-action:none}
#joystick-stick{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px;border-radius:50%;background:rgba(210,210,210,.55);border:2px solid rgba(255,255,255,.25);pointer-events:none}
#action-area{position:absolute;right:25px;bottom:25px;display:flex;flex-direction:column;align-items:center;gap:12px;pointer-events:auto}
.action-button{width:82px;height:82px;border-radius:50%;border:2px solid rgba(255,255,255,.2);background:rgba(20,20,20,.62);color:white;font-size:14px;font-weight:bold;touch-action:manipulation;user-select:none}
#interact{width:92px;height:92px}
#fullscreen{width:55px;height:55px;font-size:20px}
#hud{position:fixed;top:18px;left:18px;z-index:10;padding:12px 16px;background:rgba(0,0,0,.68);color:white;border-radius:4px;min-width:210px;pointer-events:none}
#title{font-weight:bold;font-size:18px;margin-bottom:8px}
#hp{color:#e05b5b}
#hunger{color:#d7bd4c}
#state{margin-top:4px}
#prompt{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:10;background:rgba(0,0,0,.75);color:white;padding:10px 22px;border-radius:4px;font-weight:bold;display:none;pointer-events:none}
#loading{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:#111;color:white;font-size:22px}
@media(max-height:500px){
#joystick{left:18px;bottom:18px;width:120px;height:120px}
#joystick-stick{width:56px;height:56px;margin:-28px}
#action-area{right:18px;bottom:18px}
#interact{width:78px;height:78px}
}
</style>
</head>
<body>
<div id="loading">VIRELIA: AFTERFALL</div>
<canvas id="game"></canvas>

<div id="hud">
<div id="title">VIRELIA: AFTERFALL</div>
<div id="hp">HP 100</div>
<div id="hunger">HUNGER 100</div>
<div id="state">DAY 1</div>
</div>

<div id="prompt"></div>

<div id="controls">
<div id="joystick">
<div id="joystick-stick"></div>
</div>
<div id="action-area">
<button id="interact" class="action-button">INTERACT</button>
<button id="fullscreen" class="action-button">⛶</button>
</div>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
