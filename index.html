function mat(color){

return new THREE.MeshStandardMaterial({
color,
roughness:.82
});

}

function cube(
w,
h,
d,
color
){

const m=new THREE.Mesh(
new THREE.BoxGeometry(
w,h,d
),
mat(color)
);

m.castShadow=true;
m.receiveShadow=true;

return m;

}

function addCollider(
x,
z,
w,
d,
owner=null
){

colliders.push({
x,
z,
w,
d,
owner
});

}

function blocked(
x,
z,
radius=.5,
ignore=null
){

for(
const c of colliders
){

if(c.owner===ignore){
continue;
}

const dx=Math.max(
Math.abs(x-c.x)-c.w/2,
0
);

const dz=Math.max(
Math.abs(z-c.z)-c.d/2,
0
);

if(
dx*dx+dz*dz<
radius*radius
){
return true;
}

}

return false;

}

function validZombie(x,z){

if(
Math.hypot(x,z)<25
){
return false;
}

for(
const h of houses
){

if(
Math.hypot(
x-h.x,
z-h.z
)<12
){
return false;
}

}

for(
const c of cars
){

if(
Math.hypot(
x-c.group.position.x,
z-c.group.position.z
)<8
){
return false;
}

}

return !blocked(
x,
z,
1
);

}

attempts<800
){

attempts++;

(Math.random()-.5)*230;

function setModelHeight(
model,
targetHeight
){

const box=
new THREE.Box3()
.setFromObject(model);

const size=
box.getSize(
new THREE.Vector3()
);

if(
size.y<=0
){
return;
}

const scale=
targetHeight/size.y;

model.scale.setScalar(
scale
);

const box2=
new THREE.Box3()
.setFromObject(model);

const center=
box2.getCenter(
new THREE.Vector3()
);

model.position.x=
-center.x;

model.position.z=
-center.z;

model.position.y=
-box2.min.y;

}

async function loadCharacter(){

if(!GLTFLoader){
return;
}

try{

const loader=
new GLTFLoader();

const gltf=
await loader.loadAsync(
"https://threejs.org/examples/models/gltf/Soldier.glb"
);

const model=gltf.scene;

model.traverse(
o=>{

if(o.isMesh){

o.castShadow=true;
o.receiveShadow=true;

}

}
);

setModelHeight(
model,
1.75
);

model.rotation.y=0;

player.remove(
playerModel
);

playerModel=model;

player.add(
playerModel
);

if(
gltf.animations.length
){

mixer=
new THREE.AnimationMixer(
playerModel
);

for(
const clip of gltf.animations
){

actions[
clip.name
]=
mixer.clipAction(
clip
);

}

const idle=
Object.keys(actions)
.find(
n=>
n.toLowerCase()
.includes("idle")
);

if(idle){

activeAction=
actions[idle];

activeAction.play();

}

}

}catch(e){

console.log(
"Character GLB gagal:",
e
);

}

}

loadCharacter();

function playAnimation(
type
){

if(!mixer){
return;
}

let wanted;

if(type==="run"){

wanted=[
"Run",
"Running"
];

}else if(type==="walk"){

wanted=[
"Walk",
"Walking"
];

}else{

wanted=[
"Idle"
];

}

let next=null;

for(
const wantedName of wanted
){

const found=
Object.keys(actions)
.find(
n=>
n.toLowerCase()===
wantedName.toLowerCase()
);

if(found){

next=
actions[found];

break;

}

}

if(
!next||
next===activeAction
){
return;
}

if(activeAction){
activeAction.fadeOut(.12);
}

next.reset();
next.fadeIn(.12);
next.play();

activeAction=next;

}

const keys={};

addEventListener(
"keydown",
e=>{

e.key.toLowerCase()
]=true;

if(e.key===" "){
jump();
}

if(
e.key.toLowerCase()==="c"
){
crouching=!crouching;
}

if(
e.key.toLowerCase()==="shift"
){

}

if(
e.key.toLowerCase()==="e"
){
doAction();
}

}
);

addEventListener(
"keyup",
e=>{

keys[
e.key.toLowerCase()
]=false;

if(
e.key.toLowerCase()==="shift"
){
sprinting=false;
}

}
);

function movePlayer(dt){

if(activeCar){
return;
}

let x=joyX;
let y=joyY;

if(keys.w||keys.arrowup){
y=-1;
}

if(keys.s||keys.arrowdown){
y=1;
}

if(keys.a||keys.arrowleft){
x=-1;
}

if(keys.d||keys.arrowright){
x=1;
}

const len=
Math.hypot(x,y);

if(len<.08){

playAnimation("idle");

return;

}

x/=len;
y/=len;

const speed=
sprinting
?8
:crouching
?2.1
:4.5;

const forwardX=
-Math.sin(yaw);

const forwardZ=
-Math.cos(yaw);

const rightX=
Math.cos(yaw);

const rightZ=
-Math.sin(yaw);

const mx=
rightX*x+
forwardX*(-y);

const mz=
rightZ*x+
forwardZ*(-y);

const nx=
player.position.x+
mx*speed*dt;

const nz=
player.position.z+
mz*speed*dt;

if(
!blocked(
nx,
player.position.z,
.45
)
){
player.position.x=nx;
}

if(
!blocked(
player.position.x,
nz,
.45
)
){
player.position.z=nz;
}

if(
Math.abs(mx)+Math.abs(mz)>.01
){

player.rotation.y=
Math.atan2(
mx,
mz
);

}

playAnimation(
sprinting
?"run"
:"walk"
);

}

function doAction(){

if(actionCooldown>0){
return;
}

actionCooldown=.45;

if(activeCar){
return;
}

let nearest=null;
let distance=3;

for(
const z of zombies
){

const d=
player.position.distanceTo(
z.group.position
);

if(
d<distance
){

distance=d;
nearest=z;

}

}

if(nearest){

const dx=
nearest.group.position.x-
player.position.x;

const dz=
nearest.group.position.z-
player.position.z;

const d=
Math.hypot(dx,dz)||1;

nearest.group.position.x+=
dx/d*1.4;

nearest.group.position.z+=
dz/d*1.4;

return;

}

for(
const c of cars
){

if(
player.position.distanceTo(
c.group.position
)<4.8
){

enterCar(c);

return;

}

}

}

}

const c=activeCar;

player.visible=true;

player.position.set(
c.group.position.x-
Math.sin(c.group.rotation.y)*5,
0,
c.group.position.z-
Math.cos(c.group.rotation.y)*5
);

activeCar=null;

document.getElementById(
"enter"
).style.display="block";

document.getElementById(
"exit"
).style.display="none";

document.getElementById(
"status"
).textContent=
"BERJALAN";

}

function driveCar(){

if(!activeCar){
return;
}

const c=activeCar;

let throttle=0;

if(
keys.w||
keys.arrowup||
joyY<-.15
){
throttle=1;
}

if(
keys.s||
keys.arrowdown||
joyY>.15
){
throttle=-.7;
}

c.speed+=
throttle*.035;

c.speed*=.985;

c.speed=
THREE.MathUtils.clamp(
c.speed,
-.6,
1.35
);

let steering=0;

if(
keys.a||
keys.arrowleft||
joyX<-.2
){
steering=1;
}

if(
keys.d||
keys.arrowright||
joyX>.2
){
steering=-1;
}

c.group.rotation.y+=
steering*.035*
Math.min(
Math.abs(c.speed)*1.4,
1
);

const fx=
Math.sin(
c.group.rotation.y
);

const fz=
Math.cos(
c.group.rotation.y
);

const nx=
c.group.position.x+
fx*c.speed;

const nz=
c.group.position.z+
fz*c.speed;

if(
!blocked(
nx,
nz,
2,
c.group
)
){

c.group.position.x=nx;
c.group.position.z=nz;

}else{

c.speed*=-.2;

}

}

function updateZombies(dt){

for(
const z of zombies
){

const dx=
player.position.x-
z.group.position.x;

const dz=
player.position.z-
z.group.position.z;

const d=
Math.hypot(dx,dz);

if(
d>2.3&&
d<65
){

const nx=dx/d;
const nz=dz/d;

const sx=
z.group.position.x+
nx*z.speed*dt;

const sz=
z.group.position.z+
nz*z.speed*dt;

if(
!blocked(
sx,
z.group.position.z,
.45
)
){
z.group.position.x=sx;
}

if(
!blocked(
z.group.position.x,
sz,
.45
)
){
z.group.position.z=sz;
}

z.group.rotation.y=
Math.atan2(
nx,
nz
);

}

z.attack-=dt;

if(
d<2.1&&
z.attack<=0
){

hp=Math.max(
0,
hp-5
);

z.attack=1.2;

}

}

}

function updateCamera(){

const target=
activeCar
?activeCar.group.position.clone()
:player.position.clone();

target.y+=
activeCar
?1.15
:crouching
?.72
:1.05;

const distance=
activeCar
?6
:4.3;

const horizontal=
Math.cos(pitch)*
distance;

const desired=
new THREE.Vector3(
target.x+
Math.sin(yaw)*
horizontal,

target.y+
Math.sin(pitch)*
distance,

target.z+
Math.cos(yaw)*
horizontal
);

const direction=
desired.clone()
.sub(target)
.normalize();

let finalDistance=distance;

const ray=
new THREE.Raycaster(
target,
direction,
.15,
distance
);

const hits=
ray.intersectObjects(
scene.children,
true
);

for(
const hit of hits
){

if(
hit.object===ground
){
continue;
}

if(
hit.distance<finalDistance
){

finalDistance=
Math.max(
1.35,
hit.distance-.3
);

break;

}

}

camera.position.copy(
target.clone().add(
direction.multiplyScalar(
finalDistance
)
)
);

camera.lookAt(
target
);

}

function updateHUD(){

document.getElementById(
"hpFill"
).style.width=
hp+"%";

document.getElementById(
"foodFill"
).style.width=
hunger+"%";

}

function physics(dt){

if(!activeCar){

movePlayer(dt);

jumpVelocity-=
19*dt;

player.position.y+=
jumpVelocity*dt;

if(
player.position.y<=0
){

player.position.y=0;
jumpVelocity=0;
grounded=true;

}

}else{

driveCar();

}

updateZombies(dt);
updateCamera();
updateHUD();

actionCooldown=
Math.max(
0,
actionCooldown-dt
);

}

const joystick=
document.getElementById(
"joystick"
);

const stick=
document.getElementById(
"stick"
);

let pointer=null;

function joystickMove(x,y){

const r=
joystick.getBoundingClientRect();

const cx=
r.left+r.width/2;

const cy=
r.top+r.height/2;

let dx=x-cx;
let dy=y-cy;

const max=48;

const len=
Math.hypot(dx,dy);

if(len>max){

dx=dx/len*max;
dy=dy/len*max;

}

stick.style.transform=
`translate(${dx}px,${dy}px)`;

joyX=dx/max;
joyY=dy/max;

}

function joystickReset(){

pointer=null;

stick.style.transform=
"translate(0,0)";

joyX=0;
joyY=0;

}

joystick.addEventListener(
"pointerdown",
e=>{

pointer=e.pointerId;

joystick.setPointerCapture(
e.pointerId
);

joystickMove(
e.clientX,
e.clientY
);

}
);

joystick.addEventListener(
"pointermove",
e=>{

if(
e.pointerId===pointer
){

joystickMove(
e.clientX,
e.clientY
);

}

}
);

joystick.addEventListener(
"pointerup",
joystickReset
);

joystick.addEventListener(
"pointercancel",
joystickReset
);

renderer.domElement.addEventListener(
"pointerdown",
e=>{

if(
e.clientX<
innerWidth*.38
){
return;
}

cameraDrag=true;

lastX=e.clientX;
lastY=e.clientY;

}
);

renderer.domElement.addEventListener(
"pointermove",
e=>{

if(!cameraDrag){
return;
}

const dx=
e.clientX-lastX;

const dy=
e.clientY-lastY;

lastX=e.clientX;
lastY=e.clientY;

yaw-=dx*.006;

pitch-=dy*.005;

pitch=
THREE.MathUtils.clamp(
pitch,
-1.0,
.7
);

}
);

renderer.domElement.addEventListener(
"pointerup",
()=>{
cameraDrag=false;
}
);

renderer.domElement.addEventListener(
"pointercancel",
()=>{
cameraDrag=false;
}
);

document.getElementById(
"jump"
).addEventListener(
"pointerdown",
jump
);

document.getElementById(
"crouch"
).addEventListener(
"pointerdown",
()=>{
crouching=!crouching;
}
);

const sprint=
document.getElementById(
"sprint"
);

sprint.addEventListener(
"pointerdown",
()=>{
sprinting=true;
}
);

sprint.addEventListener(
"pointerup",
()=>{
sprinting=false;
}
);

sprint.addEventListener(
"pointercancel",
()=>{
sprinting=false;
}
);

document.getElementById(
"action"
).addEventListener(
"pointerdown",
doAction
);

document.getElementById(
"enter"
).addEventListener(
"pointerdown",
()=>{

for(
const c of cars
){

if(
player.position.distanceTo(
c.group.position
)<4.8
){

enterCar(c);
return;

}

}

}
);

document.getElementById(
"exit"
).addEventListener(
"pointerdown",
exitCar
);

document.getElementById(
"fullscreen"
).addEventListener(
"click",
async()=>{

try{

if(
!document.fullscreenElement
){

await document.documentElement.requestFullscreen();

}else{

await document.exitFullscreen();

}

}catch(e){}

}
);

document.getElementById(
"exit"
).style.display="none";

function loop(){

requestAnimationFrame(loop);

const dt=
Math.min(
clock.getDelta(),
.033
);

if(mixer){
mixer.update(dt);
}

physics(dt);

renderer.render(
scene,
camera
);

}

addEventListener(
"resize",
()=>{

camera.aspect=
innerWidth/innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
innerWidth,
innerHeight
);

}
);

document.getElementById(
"loading"
).style.display="none";

loop();

</script>

</body>
</html>
