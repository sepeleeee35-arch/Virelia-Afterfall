let insideBuilding=null;
let activeCar=null;

function blockedOutside(
x,
z,
ignoreCar=null
){

if(
x<-175||
x>175||
z<-145||
z>145
)return true;

for(const c of colliders){

if(c.type==="building"){

const b=c.building;

if(
x>b.x-b.w/2-1.1 &&
x<b.x+b.w/2+1.1 &&
z>b.z-b.d/2-1.1 &&
z<b.z+b.d/2+1.1
){

const doorX=b.x;
const doorZ=b.z-b.d/2;

const nearDoor=
Math.abs(x-doorX)<2.3 &&
Math.abs(z-doorZ)<2.5;

if(!nearDoor)return true;

}
}

if(c.type==="tree"){

if(
Math.hypot(
x-c.x,
z-c.z
)<c.r+1
)return true;

}

if(c.type==="car"){

const car=c.car;

if(car===ignoreCar)continue;

if(
Math.hypot(
x-car.group.position.x,
z-car.group.position.z
)<4
)return true;

}

}

return false;
}

function blockedInside(x,z){

const b=insideBuilding;

if(!b)return false;

const minX=b.x-b.w/2+1.2;
const maxX=b.x+b.w/2-1.2;
const minZ=b.z-b.d/2+1.2;
const maxZ=b.z+b.d/2-1.2;

if(
x<minX||
x>maxX||
z<minZ||
z>maxZ
)return true;

for(const f of b.furniture){

if(
x>f.x-f.w/2-.5 &&
x<f.x+f.w/2+.5 &&
z>f.z-f.d/2-.5 &&
z<f.z+f.d/2+.5
)return true;

}

return false;
}

function blocked(x,z,ignoreCar=null){

if(insideBuilding)
return blockedInside(x,z);

return blockedOutside(x,z,ignoreCar);
}

let joyX=0;
let joyY=0;
let joyPointer=null;

const joy=document.getElementById("joy");
const knob=document.getElementById("knob");

function updateJoystick(x,y){

const r=joy.getBoundingClientRect();

let dx=x-(r.left+r.width/2);
let dy=y-(r.top+r.height/2);

const max=46;
const len=Math.hypot(dx,dy);

if(len>max){

dx=dx/len*max;
dy=dy/len*max;

}

knob.style.transform=
`translate(${dx}px,${dy}px)`;

joyX=dx/max;
joyY=dy/max;
}

joy.addEventListener(
"pointerdown",
e=>{
joyPointer=e.pointerId;
joy.setPointerCapture(e.pointerId);
updateJoystick(e.clientX,e.clientY);
}
);

joy.addEventListener(
"pointermove",
e=>{
if(e.pointerId===joyPointer)
updateJoystick(e.clientX,e.clientY);
}
);

function resetJoystick(){

joyPointer=null;
joyX=0;
joyY=0;

knob.style.transform=
"translate(0,0)";
}

joy.addEventListener(
"pointerup",
resetJoystick
);

joy.addEventListener(
"pointercancel",
resetJoystick
);

let yaw=0;
let pitch=.18;

let targetYaw=0;
let targetPitch=.18;

let cameraDragging=false;
let cameraPointer=null;
let lastX=0;
let lastY=0;

renderer.domElement.addEventListener(
"pointerdown",
e=>{

if(e.clientX<innerWidth*.38)return;

cameraDragging=true;
cameraPointer=e.pointerId;

lastX=e.clientX;
lastY=e.clientY;

renderer.domElement.setPointerCapture(
e.pointerId
);

}
);

renderer.domElement.addEventListener(
"pointermove",
e=>{

if(
!cameraDragging||
e.pointerId!==cameraPointer
)return;

const dx=e.clientX-lastX;
const dy=e.clientY-lastY;

lastX=e.clientX;
lastY=e.clientY;

targetYaw-=dx*.011;
targetPitch-=dy*.008;

targetPitch=THREE.MathUtils.clamp(
targetPitch,
-1.25,
1.15
);

}
);

renderer.domElement.addEventListener(
"pointerup",
e=>{
if(e.pointerId===cameraPointer){
cameraDragging=false;
cameraPointer=null;
}
}
);

renderer.domElement.addEventListener(
"pointercancel",
e=>{
if(e.pointerId===cameraPointer){
cameraDragging=false;
cameraPointer=null;
}
}
);

addEventListener(
"keydown",
e=>{
keys[e.key.toLowerCase()]=true;

if(e.code==="Space"){
e.preventDefault();

}

if(e.key.toLowerCase()==="c"){
toggleCrouch();
}

if(e.key.toLowerCase()==="e"){
doInteract();
}
}
);

addEventListener(
"keyup",
e=>{
keys[e.key.toLowerCase()]=false;
}
);

function movementInput(){

let x=joyX;
let y=joyY;

if(keys.a||keys.arrowleft)x=-1;
if(keys.d||keys.arrowright)x=1;
if(keys.w||keys.arrowup)y=-1;
if(keys.s||keys.arrowdown)y=1;

return{x,y};
}

let verticalVelocity=0;
let grounded=true;
let crouching=false;

function jump(){

if(
activeCar||
insideBuilding&&player.position.y>0.05||
!grounded||
crouching
)return;

verticalVelocity=7.2;
grounded=false;
}

function toggleCrouch(){

if(activeCar||!grounded)return;

crouching=!crouching;

}

function updateVertical(dt){

if(!grounded){

verticalVelocity-=18*dt;
player.position.y+=verticalVelocity*dt;

if(player.position.y<=0){

player.position.y=0;
verticalVelocity=0;
grounded=true;

}
}

const targetY=crouching?.56:.76;

player.scale.y=THREE.MathUtils.lerp(
player.scale.y,
targetY,
1-Math.pow(.00001,dt)
);

}

function movePlayer(dt){

const input=movementInput();
const magnitude=Math.hypot(
input.x,
input.y
);

if(magnitude<.05)return;

const forward=new THREE.Vector3(
-Math.sin(yaw),
0,
-Math.cos(yaw)
);

const right=new THREE.Vector3(
Math.cos(yaw),
0,
-Math.sin(yaw)
);

const direction=
forward.multiplyScalar(-input.y)
.add(right.multiplyScalar(input.x));

direction.normalize();

let speed=
insideBuilding
?5.8
:8;

if(crouching)
speed*=.52;

const nx=
player.position.x+
direction.x*speed*dt;

const nz=
player.position.z+
direction.z*speed*dt;

if(!blocked(nx,player.position.z))
player.position.x=nx;

if(!blocked(player.position.x,nz))
player.position.z=nz;

player.rotation.y=
Math.atan2(
direction.x,
direction.z
);

}

function driveCar(dt){

if(!activeCar)return;

const car=activeCar;
const input=movementInput();

const throttle=-input.y;
const steering=input.x;

car.speed+=
throttle*20*dt;

car.speed*=
Math.pow(.06,dt);

car.speed=THREE.MathUtils.clamp(
car.speed,
-7,
19
);

car.group.rotation.y-=
steering*car.speed*.035;

const direction=new THREE.Vector3(
Math.sin(car.group.rotation.y),
0,
Math.cos(car.group.rotation.y)
);

const nx=
car.group.position.x+
direction.x*car.speed*dt;

const nz=
car.group.position.z+
direction.z*car.speed*dt;

if(
!blockedOutside(
nx,
nz,
car
)
){

car.group.position.x=nx;
car.group.position.z=nz;

}else{

car.speed=0;

}

}

function updateZombies(dt){

if(activeCar)return;

for(const zombie of zombies){

if(zombie.userData.stun>0){

zombie.userData.stun-=dt;
continue;

}

if(insideBuilding)continue;

const dx=
player.position.x-
zombie.position.x;

const dz=
player.position.z-
zombie.position.z;

const distance=
Math.hypot(dx,dz);

if(
distance>4&&
distance<100
){

const speed=1.45;

const nx=
zombie.position.x+
dx/distance*speed*dt;

const nz=
zombie.position.z+
dz/distance*speed*dt;

if(
!blockedOutside(nx,nz)
){

zombie.position.set(
nx,
0,
nz
);

}

zombie.rotation.y=
Math.atan2(dx,dz);

}

}

}

let punchTimer=0;
let punchCooldown=0;

function nearestZombie(){

let best=null;
let distance=3.2;

for(const zombie of zombies){

if(zombie.userData.stun>0)
continue;

const d=Math.hypot(
player.position.x-zombie.position.x,
player.position.z-zombie.position.z
);

if(d<distance){

distance=d;
best=zombie;

}

}

return best;
}

function punch(){

if(
activeCar||
punchCooldown>0
)return;

const zombie=nearestZombie();

if(!zombie)return;

punchCooldown=.55;
punchTimer=.28;

const dx=
zombie.position.x-
player.position.x;

const dz=
zombie.position.z-
player.position.z;

const d=Math.hypot(dx,dz)||1;

const knockback=3;

const nx=
zombie.position.x+
dx/d*knockback;

const nz=
zombie.position.z+
dz/d*knockback;

if(!blockedOutside(nx,nz))
zombie.position.set(nx,0,nz);

zombie.userData.hp--;
zombie.userData.stun=.65;

showMessage(
zombie.userData.hp<=0
?"ZOMBIE TUMBANG"
:"PUKUL"
);

if(zombie.userData.hp<=0){

setTimeout(()=>{

const index=zombies.indexOf(zombie);

if(index!==-1){

scene.remove(zombie);
zombies.splice(index,1);

}

},350);

}

}

function updatePunch(dt){

if(punchCooldown>0)
punchCooldown-=dt;

if(punchTimer>0){

punchTimer-=dt;

const t=1-punchTimer/.28;

playerArmR.rotation.z=
-.5+
Math.sin(t*Math.PI)*1.7;

}else{

playerArmR.rotation.z=-.5;

}

}

function nearestSupply(){

let best=null;
let distance=2.8;

for(const item of supplies){

if(item.taken)continue;

const d=Math.hypot(
player.position.x-item.group.position.x,
player.position.z-item.group.position.z
);

if(d<distance){

distance=d;
best=item;

}

}

return best;
}

let supplyCount=0;

function takeSupply(item){

item.taken=true;
scene.remove(item.group);

supplyCount++;

document.getElementById(
"supplies"
).textContent=supplyCount;

showMessage(
"SUPPLY DIAMBIL"
);

}

function nearestCar(){

let best=null;
let distance=5.5;

for(const car of cars){

if(car.driving)continue;

const d=Math.hypot(
player.position.x-car.group.position.x,
player.position.z-car.group.position.z
);

if(d<distance){

distance=d;
best=car;

}

}

return best;
}

function nearestBuilding(){

let best=null;
let distance=4.5;

for(const b of buildings){

const doorZ=
b.z-b.d/2-1;

const d=Math.hypot(
player.position.x-b.x,
player.position.z-doorZ
);

if(d<distance){

distance=d;
best=b;

}

}

return best;
}

function nearInsideDoor(){

if(!insideBuilding)
return false;

const b=insideBuilding;

const doorX=b.x;
const doorZ=
b.z-b.d/2+2.2;

return Math.hypot(
player.position.x-doorX,
player.position.z-doorZ
)<3;
}

function showMessage(text){

const msg=
document.getElementById("msg");

msg.textContent=text;
msg.style.opacity=1;

clearTimeout(showMessage.timer);

showMessage.timer=
setTimeout(
()=>{
msg.style.opacity=0;
},
1200
);

}

function enterCar(car){

activeCar=car;
car.driving=true;

player.visible=false;

targetYaw=
car.group.rotation.y;

showMessage(
"MOBIL MASUK"
);

}

function exitCar(){

if(!activeCar)return;

const car=activeCar;

const side=
new THREE.Vector3(
3.8,
0,
0
);

side.applyAxisAngle(
new THREE.Vector3(0,1,0),
car.group.rotation.y
);

const x=
car.group.position.x+
side.x;

const z=
car.group.position.z+
side.z;

if(
!blockedOutside(
x,
z,
car
)
){

player.position.set(
x,
0,
z
);

player.visible=true;

car.driving=false;
car.speed=0;

activeCar=null;

showMessage(
"KELUAR MOBIL"
);

}else{

showMessage(
"JALAN KELUAR TERHALANG"
);

}

}

function enterBuilding(b){

insideBuilding=b;
b.inside=true;

player.position.set(
b.x,
0,
b.z-b.d/2+3.5
);

targetYaw=0;

showMessage(
"MASUK RUMAH"
);

}

function exitBuilding(){

const b=insideBuilding;

if(!b)return;

if(!nearInsideDoor()){

showMessage(
"DEKATI PINTU"
);

return;

}

const x=b.x;

const z=
b.z-b.d/2-3.5;

insideBuilding=null;
b.inside=false;

player.position.set(
x,
0,
z
);

showMessage(
"KELUAR RUMAH"
);

}

function updateActionButton(){

const button=
document.getElementById("interact");

if(activeCar){

button.textContent="KELUAR";
return;

}

if(insideBuilding){

if(nearInsideDoor()){
button.textContent="KELUAR";
}else{
button.textContent="INTERACT";
}

return;

}

if(nearestZombie()){

button.textContent="PUKUL";
return;

}

if(nearestSupply()){

button.textContent="AMBIL";
return;

}

if(nearestCar()){

button.textContent="MOBIL";
return;

}

if(nearestBuilding()){

button.textContent="MASUK";
return;

}

button.textContent="INTERACT";

}

function doInteract(){

if(activeCar){

exitCar();
return;

}

if(insideBuilding){

if(nearInsideDoor()){

exitBuilding();
return;

}

const item=nearestSupply();

if(item){

takeSupply(item);
return;

}

const zombie=nearestZombie();

if(zombie){

punch();
return;

}

return;

}

const zombie=nearestZombie();

if(zombie){

punch();
return;

}

const item=nearestSupply();

if(item){

takeSupply(item);
return;

}

const car=nearestCar();

if(car){

enterCar(car);
return;

}

const building=nearestBuilding();

if(building){

enterBuilding(building);
return;

}

}

document
.getElementById("interact")
.addEventListener(
"pointerdown",
e=>{
e.preventDefault();
doInteract();
}
);

document
.getElementById("jump")
.addEventListener(
"pointerdown",
e=>{
e.preventDefault();
jump();
}
);

document
.getElementById("crouch")
.addEventListener(
"pointerdown",
e=>{
e.preventDefault();
toggleCrouch();
}
);

document
.getElementById("fs")
.addEventListener(
"click",
async()=>{
try{

if(!document.fullscreenElement){

await document
.documentElement
.requestFullscreen();

}else{

await document.exitFullscreen();

}

}catch(e){}

}
);

function updateCamera(dt){

const target=
activeCar
?activeCar.group.position
:player.position;

yaw=
THREE.MathUtils.lerp(
yaw,
targetYaw,
1-Math.pow(.0005,dt)
);

pitch=
THREE.MathUtils.lerp(
pitch,
targetPitch,
1-Math.pow(.0005,dt)
);

const distance=
activeCar
?13.5
:12.5;

const focusHeight=
activeCar
?1.8
:crouching
?1.45
:2.35;

const cp=Math.cos(pitch);

const desired=
new THREE.Vector3(
target.x+
Math.sin(yaw)*cp*distance,

target.y+
focusHeight+
Math.sin(pitch)*distance,

target.z+
Math.cos(yaw)*cp*distance
);

desired.y=Math.max(
1,
desired.y
);

camera.position.lerp(
desired,
1-Math.pow(.00008,dt)
);

const lookAt=
new THREE.Vector3(
target.x,
target.y+focusHeight,
target.z
);

camera.lookAt(lookAt);

}

let previous=performance.now();

function animate(now){

const dt=
Math.min(
.033,
(now-previous)/1000
);

previous=now;

if(activeCar){

driveCar(dt);

}else{

movePlayer(dt);

}

updateVertical(dt);
updatePunch(dt);
updateZombies(dt);
updateActionButton();
updateCamera(dt);

renderer.render(
scene,
camera
);

requestAnimationFrame(animate);

}

requestAnimationFrame(animate);

addEventListener(
"resize",
()=>{

camera.aspect=
innerWidth/innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
innerWidth,
innerHeight
);

}
);

</script>
</body>
</html>
