<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Virelia: Afterfall</title>

<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
  }
}
</script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#080b0d;
  font-family:Arial,sans-serif;
  touch-action:none;
}

body{
  position:fixed;
  inset:0;
}

canvas{
  display:block;
  width:100%;
  height:100%;
  touch-action:none;
}

#loading{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:#10161a;
  color:#fff;
  font-size:20px;
  letter-spacing:2px;
  text-align:center;
}

#loading small{
  margin-top:12px;
  font-size:12px;
  letter-spacing:1px;
  opacity:.65;
}

#loading.error{
  color:#ff8b8b;
}

#hud{
  position:fixed;
  top:14px;
  left:14px;
  z-index:10;
  color:#fff;
  text-shadow:0 2px 5px #000;
  pointer-events:none;
}

#title{
  font-weight:bold;
  margin-bottom:7px;
  letter-spacing:1px;
}

.stat{
  font-size:11px;
  margin-top:4px;
}

.bar{
  width:190px;
  height:11px;
  background:#202020;
  border:1px solid #555;
  border-radius:8px;
  overflow:hidden;
  margin-bottom:4px;
}

#hpbar{
  height:100%;
  width:100%;
  background:#d94a4a;
}

#stambar{
  height:100%;
  width:100%;
  background:#e0b84a;
}

#context{
  margin-top:9px;
  font-size:13px;
  color:#fff;
  min-height:18px;
}

#joystick{
  position:fixed;
  left:24px;
  bottom:24px;
  width:145px;
  height:145px;
  z-index:20;
  border-radius:50%;
  background:rgba(255,255,255,.10);
  border:2px solid rgba(255,255,255,.22);
  touch-action:none;
}

#stick{
  position:absolute;
  left:42px;
  top:42px;
  width:61px;
  height:61px;
  border-radius:50%;
  background:rgba(255,255,255,.32);
  border:2px solid rgba(255,255,255,.45);
  pointer-events:none;
}

#actions{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:20;
  display:grid;
  grid-template-columns:repeat(3,72px);
  gap:10px;
}

.action{
  width:72px;
  height:72px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.3);
  background:rgba(25,30,35,.72);
  color:#fff;
  font-weight:bold;
  font-size:11px;
  touch-action:none;
  user-select:none;
}

.action:active{
  transform:scale(.91);
  background:rgba(255,255,255,.25);
}

#punch{
  font-size:25px;
}

#fullscreen{
  position:fixed;
  right:18px;
  top:15px;
  z-index:20;
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.45);
  color:#fff;
  font-size:20px;
}

.hidden{
  display:none!important;
}

@media(max-width:700px){
  #actions{
    right:12px;
    bottom:12px;
    grid-template-columns:repeat(3,64px);
    gap:7px;
  }

  .action{
    width:64px;
    height:64px;
  }

  #joystick{
    left:15px;
    bottom:15px;
  }

  .bar{
    width:160px;
  }
}
</style>
</head>

<body>

<div id="loading">
  <div>MEMUAT VIRELIA 3D...</div>
  <small id="loadingStatus">Menyiapkan dunia...</small>
</div>

<div id="hud">

  <div id="title">
    VIRELIA // AFTERFALL
  </div>

  <div class="stat">HP</div>
  <div class="bar">
    <div id="hpbar"></div>
  </div>

  <div class="stat">STAMINA</div>
  <div class="bar">
    <div id="stambar"></div>
  </div>

  <div id="context"></div>

</div>

<button id="fullscreen">⛶</button>

<div id="joystick">
  <div id="stick"></div>
</div>

<div id="actions">

  <button class="action" id="jump">
    JUMP
  </button>

  <button class="action" id="sprint">
    RUN
  </button>

  <button class="action" id="crouch">
    CROUCH
  </button>

  <button class="action" id="punch">
    👊
  </button>

  <button class="action hidden" id="enter">
    MASUK
  </button>

  <button class="action hidden" id="exit">
    KELUAR
  </button>

</div>

<script type="module">
import { startGame } from "./src/main.js";

startGame();
</script>

</body>
</html>
