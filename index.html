<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Virelia: Afterfall</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  font-family:Arial,Helvetica,sans-serif;
  touch-action:none;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#26352b;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  image-rendering:auto;
}

#hud{
  position:absolute;
  inset:0;
  pointer-events:none;
}

.panel{
  background:rgba(10,14,12,.72);
  border:1px solid rgba(255,255,255,.14);
  border-radius:10px;
  color:white;
  backdrop-filter:blur(5px);
}

#top{
  position:absolute;
  top:10px;
  left:10px;
  right:10px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

#stats{
  width:220px;
  padding:9px;
}

.label{
  font-size:11px;
  color:#bbb;
}

.bar{
  height:9px;
  background:#252525;
  border-radius:5px;
  overflow:hidden;
  margin:3px 0 7px;
}

.fill{
  height:100%;
  width:100%;
}

#hpFill{background:#e05252}
#staminaFill{background:#e5c94f}

#info{
  text-align:right;
  padding:9px;
  min-width:160px;
}

#alive{
  font-size:18px;
  font-weight:bold;
}

#timer{
  font-size:12px;
  color:#ccc;
}

#equipment{
  position:absolute;
  top:105px;
  left:10px;
  width:190px;
  padding:8px;
  font-size:12px;
}

.equip{
  display:flex;
  justify-content:space-between;
  margin:5px 0;
}

.equip span:last-child{
  color:#ddd;
}

#minimap{
  position:absolute;
  right:10px;
  top:105px;
  width:145px;
  height:145px;
  border-radius:8px;
  overflow:hidden;
  border:2px solid rgba(255,255,255,.35);
  background:#253226;
}

#mapCanvas{
  width:100%;
  height:100%;
}

#message{
  position:absolute;
  left:50%;
  top:18%;
  transform:translateX(-50%);
  padding:10px 18px;
  opacity:0;
  transition:.2s;
  font-size:13px;
}

#message.show{
  opacity:1;
}

#crosshair{
  position:absolute;
  left:50%;
  top:50%;
  width:18px;
  height:18px;
  transform:translate(-50%,-50%);
}

#crosshair:before,
#crosshair:after{
  content:"";
  position:absolute;
  background:rgba(255,255,255,.75);
}

#crosshair:before{
  width:2px;
  height:18px;
  left:8px;
}

#crosshair:after{
  width:18px;
  height:2px;
  top:8px;
}

#controls{
  position:absolute;
  inset:0;
  pointer-events:none;
}

button{
  border:1px solid rgba(255,255,255,.2);
  background:rgba(15,18,16,.72);
  color:#fff;
  border-radius:12px;
  font-weight:bold;
  min-width:58px;
  min-height:48px;
  font-size:11px;
}

button:active{
  transform:scale(.94);
  background:rgba(80,90,80,.85);
}

#move{
  position:absolute;
  left:18px;
  bottom:18px;
  width:180px;
  height:180px;
  pointer-events:auto;
}

.moveBtn{
  position:absolute;
  width:56px;
  height:56px;
  min-width:56px;
}

#up{left:62px;top:0}
#left{left:0;top:62px}
#down{left:62px;top:124px}
#right{left:124px;top:62px}

#actions{
  position:absolute;
  right:18px;
  bottom:18px;
  display:grid;
  grid-template-columns:repeat(2,70px);
  gap:8px;
  pointer-events:auto;
}

.action{
  min-width:70px;
  min-height:52px;
}

#inventoryPanel{
  display:none;
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(420px,90vw);
  padding:16px;
  pointer-events:auto;
}

#inventoryPanel.show{
  display:block;
}

#inventoryItems{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin-top:10px;
}

.item{
  padding:10px;
  background:rgba(255,255,255,.07);
  border-radius:8px;
}

#start{
  position:absolute;
  inset:0;
  z-index:10;
  display:flex;
  justify-content:center;
  align-items:center;
  background:
    radial-gradient(circle at center,#344a3b,#101512 70%);
  color:white;
}

.startBox{
  width:min(430px,90vw);
  text-align:center;
  padding:30px;
}

.startBox h1{
  font-size:38px;
  margin:0;
  letter-spacing:4px;
}

.startBox h2{
  font-size:14px;
  font-weight:normal;
  letter-spacing:5px;
  color:#aeb7ad;
  margin:4px 0 24px;
}

.startBox p{
  color:#aaa;
  font-size:13px;
  line-height:1.6;
}

#startBtn{
  margin-top:15px;
  width:100%;
  min-height:55px;
  background:#71856c;
  border:none;
}

#loading{
  position:absolute;
  inset:0;
  z-index:20;
  display:none;
  justify-content:center;
  align-items:center;
  background:#111;
  color:white;
  text-align:center;
}

#loading.show{
  display:flex;
}

@media(max-width:600px){
  #equipment{
    display:none;
  }

  #minimap{
    width:115px;
    height:115px;
    top:105px;
  }

  #stats{
    width:170px;
  }

  #info{
    min-width:120px;
  }

  .startBox h1{
    font-size:29px;
  }
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<div id="hud">

  <div id="top">

    <div id="stats" class="panel">
      <div class="label">HP</div>
      <div class="bar">
        <div id="hpFill" class="fill"></div>
      </div>

      <div class="label">STAMINA</div>
      <div class="bar">
        <div id="staminaFill" class="fill"></div>
      </div>
    </div>

    <div id="info" class="panel">
      <div id="alive">PLAYERS 70</div>
      <div id="timer">20:00</div>
    </div>

  </div>

  <div id="equipment" class="panel">

    <div class="equip">
      <span>Helmet</span>
      <span id="helmet">Kosong</span>
    </div>

    <div class="equip">
      <span>Vest</span>
      <span id="vest">Kosong</span>
    </div>

    <div class="equip">
      <span>Shoes</span>
      <span id="shoes">Kosong</span>
    </div>

    <div class="equip">
      <span>Backpack</span>
      <span id="backpack">Kosong</span>
    </div>

  </div>

  <div id="minimap">
    <canvas id="mapCanvas"></canvas>
  </div>

  <div id="crosshair"></div>

  <div id="message" class="panel">
    -
  </div>

</div>

<div id="controls">

  <div id="move">

    <button class="moveBtn" id="up">▲</button>
    <button class="moveBtn" id="left">◀</button>
    <button class="moveBtn" id="down">▼</button>
    <button class="moveBtn" id="right">▶</button>

  </div>

  <div id="actions">

    <button class="action" id="sprint">LARI</button>
    <button class="action" id="loot">LOOT</button>

    <button class="action" id="vehicle">KENDARAAN</button>
    <button class="action" id="bag">TAS</button>

  </div>

</div>

<div id="inventoryPanel" class="panel">

  <h3>INVENTORY</h3>

  <div id="inventoryItems"></div>

  <br>

  <button id="closeBag">TUTUP</button>

</div>

<div id="start">

  <div class="startBox">

    <h1>VIRELIA</h1>
    <h2>AFTERFALL</h2>

    <p>
      LARGE-SCALE SURVIVAL WORLD
    </p>

    <p>
      Map besar • 70 entitas maksimal •
      bot dinamis • kendaraan • loot • equipment
    </p>

    <button id="startBtn">
      MASUK MAP
    </button>

  </div>

</div>

<div id="loading">
  <div>
    <h2>MEMUAT VIRELIA</h2>
    <p id="loadingText">Membangun dunia...</p>
  </div>
</div>

</div>

<script>

/* =========================================================
   VIRELIA AFTERFALL
   LARGE MAP CORE
   MAX 70 PLAYERS / BOTS
========================================================= */

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

const mapCanvas =
  document.getElementById("mapCanvas");

const mapCtx =
  mapCanvas.getContext("2d");


/* =========================================================
   CONFIG
========================================================= */

const CONFIG = {

  MAP_W: 12000,
  MAP_H: 10000,

  MAX_PLAYERS: 70,

  BOT_COUNT: 69,

  CHUNK: 500,

  VIEW_DISTANCE: 1500,

  BUILDINGS: 220,

  TREES: 850,

  LOOT: 650,

  VEHICLES: 110,

  ROAD_SIZE: 120,

  GAME_TIME: 1200

};


/* =========================================================
   RESIZE
========================================================= */

function resize(){

  canvas.width =
    Math.floor(innerWidth * devicePixelRatio);

  canvas.height =
    Math.floor(innerHeight * devicePixelRatio);

  canvas.style.width =
    innerWidth + "px";

  canvas.style.height =
    innerHeight + "px";

  ctx.setTransform(
    devicePixelRatio,
    0,
    0,
    devicePixelRatio,
    0,
    0
  );

  mapCanvas.width = 230;
  mapCanvas.height = 230;

}

addEventListener("resize",resize);

resize();


/* =========================================================
   UTIL
========================================================= */

function rand(min,max){
  return min + Math.random()*(max-min);
}

function clamp(v,min,max){
  return Math.max(min,Math.min(max,v));
}

function dist(a,b){

  const dx=a.x-b.x;
  const dy=a.y-b.y;

  return Math.hypot(dx,dy);

}

function formatTime(seconds){

  seconds=Math.max(0,Math.floor(seconds));

  const m=Math.floor(seconds/60)
    .toString().padStart(2,"0");

  const s=(seconds%60)
    .toString().padStart(2,"0");

  return m+":"+s;

}


/* =========================================================
   WORLD
========================================================= */

const world={

  width:CONFIG.MAP_W,

  height:CONFIG.MAP_H,

  buildings:[],

  trees:[],

  loot:[],

  vehicles:[],

  bots:[],

  roads:[],

  chunks:new Map()

};


/* =========================================================
   PLAYER
========================================================= */

const player={

  x:CONFIG.MAP_W/2,

  y:CONFIG.MAP_H/2,

  radius:16,

  speed:3.2,

  sprintSpeed:5.2,

  hp:100,

  maxHp:100,

  stamina:100,

  maxStamina:100,

  helmet:null,

  vest:null,

  shoes:null,

  backpack:null,

  inventory:[],

  vehicle:null

};


/* =========================================================
   CAMERA
========================================================= */

const camera={

  x:player.x,

  y:player.y

};


/* =========================================================
   INPUT
========================================================= */

const keys={

  up:false,

  down:false,

  left:false,

  right:false,

  sprint:false

};


function keyState(key,state){

  if(key==="ArrowUp" || key==="w")
    keys.up=state;

  if(key==="ArrowDown" || key==="s")
    keys.down=state;

  if(key==="ArrowLeft" || key==="a")
    keys.left=state;

  if(key==="ArrowRight" || key==="d")
    keys.right=state;

  if(key==="Shift")
    keys.sprint=state;

}


addEventListener("keydown",e=>{

  keyState(e.key,true);

});


addEventListener("keyup",e=>{

  keyState(e.key,false);

});


function holdButton(id,key){

  const b=document.getElementById(id);

  const start=e=>{

    e.preventDefault();

    keys[key]=true;

  };

  const stop=e=>{

    e.preventDefault();

    keys[key]=false;

  };

  b.addEventListener("pointerdown",start);

  b.addEventListener("pointerup",stop);

  b.addEventListener("pointercancel",stop);

  b.addEventListener("pointerleave",stop);

}


holdButton("up","up");
holdButton("down","down");
holdButton("left","left");
holdButton("right","right");


document
  .getElementById("sprint")
  .addEventListener("pointerdown",()=>{
    keys.sprint=true;
  });

document
  .getElementById("sprint")
  .addEventListener("pointerup",()=>{
    keys.sprint=false;
  });


/* =========================================================
   BUILD WORLD
========================================================= */

function buildWorld(){

  world.buildings.length=0;
  world.trees.length=0;
  world.loot.length=0;
  world.vehicles.length=0;
  world.bots.length=0;
  world.roads.length=0;

  /*
     ROAD GRID
  */

  for(
    let x=500;
    x<CONFIG.MAP_W;
    x+=1000
  ){

    world.roads.push({
      x,
      y:CONFIG.MAP_H/2,
      w:CONFIG.ROAD_SIZE,
      h:CONFIG.MAP_H
    });

  }


  for(
    let y=500;
    y<CONFIG.MAP_H;
    y+=1000
  ){

    world.roads.push({
      x:CONFIG.MAP_W/2,
      y,
      w:CONFIG.MAP_W,
      h:CONFIG.ROAD_SIZE
    });

  }


  /*
     BUILDINGS
  */

  for(
    let i=0;
    i<CONFIG.BUILDINGS;
    i++
  ){

    let x,y;

    let tries=0;

    do{

      x=rand(150,CONFIG.MAP_W-150);
      y=rand(150,CONFIG.MAP_H-150);

      tries++;

    }while(
      nearRoad(x,y,170) &&
      tries<30
    );


    const large=Math.random()<.35;

    world.buildings.push({

      x,

      y,

      w:large?rand(180,330):rand(80,170),

      h:large?rand(180,330):rand(80,170),

      type:large?"large":"house",

      roof:Math.random()

    });

  }


  /*
     TREES
  */

  for(
    let i=0;
    i<CONFIG.TREES;
    i++
  ){

    const x=rand(30,CONFIG.MAP_W-30);
    const y=rand(30,CONFIG.MAP_H-30);

    if(!nearRoad(x,y,90)){

      world.trees.push({

        x,

        y,

        r:rand(10,24)

      });

    }

  }


  /*
     VEHICLES
  */

  for(
    let i=0;
    i<CONFIG.VEHICLES;
    i++
  ){

    const horizontal=Math.random()<.5;

    let x,y;

    if(horizontal){

      y=
        Math.round(
          (rand(500,CONFIG.MAP_H-500))/1000
        )*1000;

      x=rand(80,CONFIG.MAP_W-80);

    }else{

      x=
        Math.round(
          (rand(500,CONFIG.MAP_W-500))/1000
        )*1000;

      y=rand(80,CONFIG.MAP_H-80);

    }

    world.vehicles.push({

      x,

      y,

      angle:horizontal?0:Math.PI/2,

      occupied:false,

      speed:0

    });

  }


  /*
     LOOT
  */

  const lootTypes=[

    {
      name:"Helmet",
      slot:"helmet"
    },

    {
      name:"Vest",
      slot:"vest"
    },

    {
      name:"Shoes",
      slot:"shoes"
    },

    {
      name:"Backpack",
      slot:"backpack"
    },

    {
      name:"Food",
      slot:"food"
    },

    {
      name:"Medical",
      slot:"medical"
    }

  ];


  for(
    let i=0;
    i<CONFIG.LOOT;
    i++
  ){

    world.loot.push({

      x:rand(50,CONFIG.MAP_W-50),

      y:rand(50,CONFIG.MAP_H-50),

      type:
        lootTypes[
          Math.floor(
            Math.random()*lootTypes.length
          )
        ],

      taken:false

    });

  }


  /*
     BOTS
  */

  for(
    let i=0;
    i<CONFIG.BOT_COUNT;
    i++
  ){

    world.bots.push(createBot(i));

  }


  /*
     CHUNKS
  */

  buildChunks();

}


/* =========================================================
   ROAD CHECK
========================================================= */

function nearRoad(x,y,padding){

  for(const r of world.roads){

    if(
      x>r.x-r.w/2-padding &&
      x<r.x+r.w/2+padding &&
      y>r.y-r.h/2-padding &&
      y<r.y+r.h/2+padding
    ){

      return true;

    }

  }

  return false;

}


/* =========================================================
   CHUNK SYSTEM
========================================================= */

function chunkKey(x,y){

  const cx=Math.floor(x/CONFIG.CHUNK);
  const cy=Math.floor(y/CONFIG.CHUNK);

  return cx+","+cy;

}


function buildChunks(){

  world.chunks.clear();

  function add(type,obj){

    const key=chunkKey(obj.x,obj.y);

    if(!world.chunks.has(key)){

      world.chunks.set(key,{

        buildings:[],
        trees:[],
        loot:[],
        vehicles:[],
        bots:[]

      });

    }

    world.chunks
      .get(key)[type]
      .push(obj);

  }


  world.buildings.forEach(x=>add("buildings",x));
  world.trees.forEach(x=>add("trees",x));
  world.loot.forEach(x=>add("loot",x));
  world.vehicles.forEach(x=>add("vehicles",x));
  world.bots.forEach(x=>add("bots",x));

}


/* =========================================================
   BOT SYSTEM
========================================================= */

function createBot(id){

  const angle=rand(0,Math.PI*2);

  const radius=rand(
    400,
    CONFIG.MAP_W*.45
  );

  const x=
    CONFIG.MAP_W/2+
    Math.cos(angle)*radius;

  const y=
    CONFIG.MAP_H/2+
    Math.sin(angle)*radius;


  return{

    id,

    x:clamp(x,30,CONFIG.MAP_W-30),

    y:clamp(y,30,CONFIG.MAP_H-30),

    targetX:x,

    targetY:y,

    hp:100,

    speed:rand(1.8,2.8),

    think:rand(.2,1),

    active:true,

    state:"wander",

    radius:14,

    direction:rand(0,Math.PI*2)

  };

}


/*
   BOT AI OPTIMIZATION

   Bot hanya melakukan keputusan AI
   setiap beberapa ratus ms.
   Tidak setiap frame.
*/

function updateBots(dt){

  for(const bot of world.bots){

    if(!bot.active)
      continue;


    const dx=bot.x-player.x;
    const dy=bot.y-player.y;

    const d=Math.hypot(dx,dy);


    /*
       Bot jauh dari player:
       AI dibuat jauh lebih jarang.
    */

    if(d>1800){

      bot.think-=dt;

      if(bot.think<=0){

        bot.think=rand(1.5,3);

        bot.direction+=rand(-1,1);

      }

      bot.x+=
        Math.cos(bot.direction)*
        bot.speed*
        dt*60;

      bot.y+=
        Math.sin(bot.direction)*
        bot.speed*
        dt*60;

      clampBot(bot);

      continue;

    }


    /*
       Bot dekat player:
       update AI lebih sering.
    */

    bot.think-=dt;


    if(bot.think<=0){

      bot.think=rand(.3,.65);


      if(d<450){

        bot.state="follow";

      }else{

        bot.state="wander";

      }


      if(bot.state==="follow"){

        bot.targetX=player.x;
        bot.targetY=player.y;

      }else{

        bot.targetX=
          bot.x+
          rand(-350,350);

        bot.targetY=
          bot.y+
          rand(-350,350);

      }

    }


    const tx=bot.targetX-bot.x;
    const ty=bot.targetY-bot.y;

    const td=Math.hypot(tx,ty);


    if(td>10){

      bot.x+=
        tx/td*
        bot.speed*
        dt*60;

      bot.y+=
        ty/td*
        bot.speed*
        dt*60;

    }


    clampBot(bot);

  }

}


function clampBot(bot){

  bot.x=
    clamp(bot.x,20,CONFIG.MAP_W-20);

  bot.y=
    clamp(bot.y,20,CONFIG.MAP_H-20);

}


/* =========================================================
   PLAYER
========================================================= */

function updatePlayer(dt){

  let dx=0;
  let dy=0;

  if(keys.up)dy--;
  if(keys.down)dy++;
  if(keys.left)dx--;
  if(keys.right)dx++;


  if(dx!==0 || dy!==0){

    const length=
      Math.hypot(dx,dy);

    dx/=length;
    dy/=length;


    let speed=player.speed;


    if(
      keys.sprint &&
      player.stamina>0
    ){

      speed=player.sprintSpeed;

      player.stamina=
        Math.max(
          0,
          player.stamina-
          25*dt
        );

    }else{

      player.stamina=
        Math.min(
          player.maxStamina,
          player.stamina+
          14*dt
        );

    }


    const multiplier=
      player.shoes ? 1.08 : 1;


    player.x+=
      dx*speed*multiplier*dt*60;

    player.y+=
      dy*speed*multiplier*dt*60;

  }else{

    player.stamina=
      Math.min(
        player.maxStamina,
        player.stamina+
        18*dt
      );

  }


  player.x=
    clamp(
      player.x,
      20,
      CONFIG.MAP_W-20
    );

  player.y=
    clamp(
      player.y,
      20,
      CONFIG.MAP_H-20
    );


  if(player.vehicle){

    player.vehicle.x=player.x;
    player.vehicle.y=player.y;

  }

}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(){

  camera.x+=
    (player.x-camera.x)*.12;

  camera.y+=
    (player.y-camera.y)*.12;

}


/* =========================================================
   LOOT
========================================================= */

function takeLoot(){

  let nearest=null;
  let best=70;


  for(const item of world.loot){

    if(item.taken)
      continue;

    const d=dist(player,item);

    if(d<best){

      best=d;
      nearest=item;

    }

  }


  if(!nearest){

    showMessage("Tidak ada loot di dekatmu");

    return;

  }


  nearest.taken=true;

  const type=nearest.type;


  if(
    type.slot==="helmet" ||
    type.slot==="vest" ||
    type.slot==="shoes" ||
    type.slot==="backpack"
  ){

    player[type.slot]=type.name;

    document.getElementById(type.slot)
      .textContent=type.name;

  }


  player.inventory.push(type.name);

  showMessage("Mengambil "+type.name);

}


/* =========================================================
   VEHICLES
========================================================= */

function vehicleAction(){

  if(player.vehicle){

    player.vehicle.occupied=false;

    player.vehicle=null;

    showMessage("Keluar kendaraan");

    return;

  }


  let nearest=null;
  let best=75;


  for(const v of world.vehicles){

    if(v.occupied)
      continue;

    const d=dist(player,v);

    if(d<best){

      best=d;
      nearest=v;

    }

  }


  if(!nearest){

    showMessage("Tidak ada kendaraan");

    return;

  }


  nearest.occupied=true;

  player.vehicle=nearest;

  showMessage("Masuk kendaraan");

}


/* =========================================================
   INVENTORY
========================================================= */

function updateInventory(){

  const box=
    document.getElementById("inventoryItems");

  box.innerHTML="";


  if(player.inventory.length===0){

    box.innerHTML=
      '<div class="item">Inventory kosong</div>';

    return;

  }


  const counts={};


  for(const item of player.inventory){

    counts[item]=
      (counts[item]||0)+1;

  }


  for(const name in counts){

    const div=
      document.createElement("div");

    div.className="item";

    div.textContent=
      name+" × "+counts[name];

    box.appendChild(div);

  }

}


/* =========================================================
   SAFE ZONE
========================================================= */

const zone={

  x:CONFIG.MAP_W/2,

  y:CONFIG.MAP_H/2,

  radius:4700,

  targetRadius:4700,

  timer:0

};


function updateZone(dt){

  zone.timer+=dt;


  /*
     Zona mulai mengecil setelah
     beberapa menit.
  */

  if(zone.timer>120){

    zone.targetRadius=
      Math.max(
        650,
        4700-
        (zone.timer-120)*2.2
      );

  }


  zone.radius+=
    (zone.targetRadius-zone.radius)*
    dt*.15;


  const dx=player.x-zone.x;
  const dy=player.y-zone.y;

  const d=Math.hypot(dx,dy);


  if(d>zone.radius){

    player.hp=
      Math.max(
        0,
        player.hp-5*dt
      );

  }

}


/* =========================================================
   DRAW
========================================================= */

function draw(){

  const w=innerWidth;
  const h=innerHeight;


  ctx.clearRect(0,0,w,h);


  const zoom=
    Math.min(
      w/900,
      h/650
    );


  const ox=
    w/2-camera.x*zoom;

  const oy=
    h/2-camera.y*zoom;


  /*
     GROUND
  */

  ctx.fillStyle="#52634f";

  ctx.fillRect(
    0,
    0,
    w,
    h
  );


  /*
     GRID TERRAIN
  */

  const grid=200;


  ctx.strokeStyle=
    "rgba(255,255,255,.025)";

  ctx.lineWidth=1;


  for(
    let x=Math.floor(camera.x/grid)*grid;
    x<camera.x+1000;
    x+=grid
  ){

    const sx=ox+x*zoom;

    ctx.beginPath();

    ctx.moveTo(sx,0);
    ctx.lineTo(sx,h);

    ctx.stroke();

  }


  for(
    let y=Math.floor(camera.y/grid)*grid;
    y<camera.y+1000;
    y+=grid
  ){

    const sy=oy+y*zoom;

    ctx.beginPath();

    ctx.moveTo(0,sy);
    ctx.lineTo(w,sy);

    ctx.stroke();

  }


  /*
     ROADS
  */

  for(const r of world.roads){

    ctx.fillStyle="#333936";

    ctx.fillRect(
      ox+(r.x-r.w/2)*zoom,
      oy+(r.y-r.h/2)*zoom,
      r.w*zoom,
      r.h*zoom
    );

  }


  /*
     BUILDINGS
  */

  for(const b of world.buildings){

    if(
      Math.abs(b.x-camera.x)>CONFIG.VIEW_DISTANCE ||
      Math.abs(b.y-camera.y)>CONFIG.VIEW_DISTANCE
    )
      continue;


    const x=
      ox+(b.x-b.w/2)*zoom;

    const y=
      oy+(b.y-b.h/2)*zoom;

    ctx.fillStyle=
      b.type==="large"
      ? "#77736a"
      : "#8a8174";


    ctx.fillRect(
      x,
      y,
      b.w*zoom,
      b.h*zoom
    );


    ctx.strokeStyle=
      "rgba(20,20,20,.8)";

    ctx.strokeRect(
      x,
      y,
      b.w*zoom,
      b.h*zoom
    );


    /*
       roof/detail
    */

    ctx.fillStyle=
      "rgba(40,40,40,.25)";

    ctx.fillRect(
      x+5,
      y+5,
      b.w*zoom-10,
      8
    );

  }


  /*
     TREES
  */

  for(const t of world.trees){

    if(
      Math.abs(t.x-camera.x)>CONFIG.VIEW_DISTANCE ||
      Math.abs(t.y-camera.y)>CONFIG.VIEW_DISTANCE
    )
      continue;


    const x=ox+t.x*zoom;
    const y=oy+t.y*zoom;

    ctx.fillStyle="#263c27";

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      t.r*zoom,
      0,
      Math.PI*2
    );

    ctx.fill();

  }


  /*
     VEHICLES
  */

  for(const v of world.vehicles){

    if(
      Math.abs(v.x-camera.x)>CONFIG.VIEW_DISTANCE ||
      Math.abs(v.y-camera.y)>CONFIG.VIEW_DISTANCE
    )
      continue;


    const x=ox+v.x*zoom;
    const y=oy+v.y*zoom;

    ctx.save();

    ctx.translate(x,y);

    ctx.rotate(v.angle);

    ctx.fillStyle=
      v.occupied
      ? "#c4a75d"
      : "#59666a";

    ctx.fillRect(
      -22*zoom,
      -11*zoom,
      44*zoom,
      22*zoom
    );

    ctx.fillStyle="#20282a";

    ctx.fillRect(
      -8*zoom,
      -8*zoom,
      16*zoom,
      16*zoom
    );

    ctx.restore();

  }


  /*
     LOOT
  */

  for(const item of world.loot){

    if(item.taken)
      continue;

    if(
      Math.abs(item.x-camera.x)>900 ||
      Math.abs(item.y-camera.y)>900
    )
      continue;


    const x=ox+item.x*zoom;
    const y=oy+item.y*zoom;

    ctx.fillStyle="#d9bd64";

    ctx.fillRect(
      x-4,
      y-4,
      8,
      8
    );

  }


  /*
     BOTS
  */

  for(const bot of world.bots){

    if(!bot.active)
      continue;

    if(
      Math.abs(bot.x-camera.x)>CONFIG.VIEW_DISTANCE ||
      Math.abs(bot.y-camera.y)>CONFIG.VIEW_DISTANCE
    )
      continue;


    const x=ox+bot.x*zoom;
    const y=oy+bot.y*zoom;


    ctx.fillStyle="#a6a6a6";

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      12*zoom,
      0,
      Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle="#333";

    ctx.fillRect(
      x-7*zoom,
      y-16*zoom,
      14*zoom,
      7*zoom
    );

  }


  /*
     PLAYER
  */

  const px=w/2;
  const py=h/2;


  ctx.fillStyle="#e8e0c9";

  ctx.beginPath();

  ctx.arc(
    px,
    py,
    15,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.fillStyle="#39453d";

  ctx.fillRect(
    px-10,
    py-18,
    20,
    7
  );


  /*
     SAFE ZONE
  */

  ctx.save();

  ctx.fillStyle=
    "rgba(50,80,120,.10)";

  ctx.beginPath();

  ctx.rect(0,0,w,h);

  ctx.arc(
    ox+zone.x*zoom,
    oy+zone.y*zoom,
    zone.radius*zoom,
    0,
    Math.PI*2,
    true
  );

  ctx.fill("evenodd");


  ctx.strokeStyle=
    "rgba(120,180,255,.65)";

  ctx.lineWidth=3;

  ctx.beginPath();

  ctx.arc(
    ox+zone.x*zoom,
    oy+zone.y*zoom,
    zone.radius*zoom,
    0,
    Math.PI*2
  );

  ctx.stroke();

  ctx.restore();


  drawMinimap();

}


/* =========================================================
   MINIMAP
========================================================= */

function drawMinimap(){

  const s=230;

  mapCtx.clearRect(0,0,s,s);

  mapCtx.fillStyle="#334334";

  mapCtx.fillRect(0,0,s,s);


  const scale=
    s/CONFIG.MAP_W;


  /*
     roads
  */

  mapCtx.fillStyle="#444b48";

  for(const r of world.roads){

    mapCtx.fillRect(
      (r.x-r.w/2)*scale,
      (r.y-r.h/2)*scale,
      r.w*scale,
      r.h*scale
    );

  }


  /*
     buildings
  */

  mapCtx.fillStyle="#77746b";

  for(const b of world.buildings){

    mapCtx.fillRect(
      (b.x-b.w/2)*scale,
      (b.y-b.h/2)*scale,
      b.w*scale,
      b.h*scale
    );

  }


  /*
     zone
  */

  mapCtx.strokeStyle="#8fc4ff";

  mapCtx.lineWidth=2;

  mapCtx.beginPath();

  mapCtx.arc(
    zone.x*scale,
    zone.y*scale,
    zone.radius*scale,
    0,
    Math.PI*2
  );

  mapCtx.stroke();


  /*
     bots
  */

  mapCtx.fillStyle="#ddd";

  for(const bot of world.bots){

    if(!bot.active)
      continue;

    mapCtx.fillRect(
      bot.x*scale-1,
      bot.y*scale-1,
      2,
      2
    );

  }


  /*
     player
  */

  mapCtx.fillStyle="#fff";

  mapCtx.beginPath();

  mapCtx.arc(
    player.x*scale,
    player.y*scale,
    3,
    0,
    Math.PI*2
  );

  mapCtx.fill();

}


/* =========================================================
   UI
========================================================= */

let messageTimer=0;


function showMessage(text){

  const el=
    document.getElementById("message");

  el.textContent=text;

  el.classList.add("show");

  messageTimer=2;

}


function updateMessage(dt){

  if(messageTimer<=0)
    return;

  messageTimer-=dt;

  if(messageTimer<=0){

    document
      .getElementById("message")
      .classList.remove("show");

  }

}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

  document
    .getElementById("hpFill")
    .style.width=
      player.hp+"%";


  document
    .getElementById("staminaFill")
    .style.width=
      player.stamina+"%";


  const alive=
    1+
    world.bots.filter(
      b=>b.active
    ).length;


  document
    .getElementById("alive")
    .textContent=
      "PLAYERS "+alive;


  document
    .getElementById("timer")
    .textContent=
      formatTime(gameTime);


}


/* =========================================================
   GAME LOOP
========================================================= */

let running=false;

let lastTime=0;

let gameTime=CONFIG.GAME_TIME;


function loop(time){

  if(!running)
    return;


  const dt=
    Math.min(
      .033,
      (time-lastTime)/1000
    );

  lastTime=time;


  gameTime-=dt;


  updatePlayer(dt);

  updateBots(dt);

  updateCamera();

  updateZone(dt);

  updateMessage(dt);

  updateHUD();

  draw();


  if(
    player.hp<=0 ||
    gameTime<=0
  ){

    running=false;

    showMessage(
      player.hp<=0
      ? "Kamu tereliminasi"
      : "Waktu pertandingan selesai"
    );

  }


  requestAnimationFrame(loop);

}


/* =========================================================
   BUTTONS
========================================================= */

document
  .getElementById("loot")
  .addEventListener(
    "click",
    takeLoot
  );


document
  .getElementById("vehicle")
  .addEventListener(
    "click",
    vehicleAction
  );


document
  .getElementById("bag")
  .addEventListener(
    "click",
    ()=>{

      updateInventory();

      document
        .getElementById("inventoryPanel")
        .classList.add("show");

    }
  );


document
  .getElementById("closeBag")
  .addEventListener(
    "click",
    ()=>{

      document
        .getElementById("inventoryPanel")
        .classList.remove("show");

    }
  );


/* =========================================================
   START
========================================================= */

document
  .getElementById("startBtn")
  .addEventListener(
    "click",
    ()=>{

      document
        .getElementById("start")
        .style.display="none";

      document
        .getElementById("loading")
        .classList.add("show");


      setTimeout(()=>{

        document
          .getElementById("loadingText")
          .textContent=
            "Membangun kota...";

      },100);


      setTimeout(()=>{

        buildWorld();

      },200);


      setTimeout(()=>{

        document
          .getElementById("loadingText")
          .textContent=
            "Menyiapkan 70 entitas...";

      },400);


      setTimeout(()=>{

        document
          .getElementById("loading")
          .classList.remove("show");

        running=true;

        lastTime=performance.now();

        requestAnimationFrame(loop);

      },700);

    }
  );

</script>
