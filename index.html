function material(color,roughness=.8){
  return new THREE.MeshStandardMaterial({
    color,
    roughness
  });
}

function box(w,h,d,color){
  const m=new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    material(color)
  );

  m.castShadow=true;
  m.receiveShadow=true;

  return m;
}

function addCollider(x,z,w,d,owner=null){
  colliders.push({
    x,
    z,
    w,
    d,
    owner
  });
}

function blocked(x,z,r=.65,ignore=null){

  for(const c of colliders){

    if(c.owner===ignore){
      continue;
    }

    const dx=Math.max(
      Math.abs(x-c.x)-c.w/2,
      0
    );

    const dz=Math.max(
      Math.abs(z-c.z)-c.d/2,
      0
    );

    if(dx*dx+dz*dz<r*r){
      return true;
    }
  }

  return false;
}

function createRoad(x,z,w,d){

  const road=box(
    w,
    .04,
    d,
    0x292929
  );

  road.position.set(x,.02,z);

  scene.add(road);

  const lineMat=material(0xd6c548);

  if(w>d){

    for(
      let p=x-w/2+8;
      p<x+w/2;
      p+=16
    ){

      const line=new THREE.Mesh(
        new THREE.BoxGeometry(7,.045,.22),
        lineMat
      );

      line.position.set(p,.05,z);

      scene.add(line);
    }

  }else{

    for(
      let p=z-d/2+8;
      p<z+d/2;
      p+=16
    ){

      const line=new THREE.Mesh(
        new THREE.BoxGeometry(.22,.045,7),
        lineMat
      );

      line.position.set(x,.05,p);

      scene.add(line);
    }
  }
}

function validZombieSpawn(x,z){

  if(Math.abs(x)<18&&Math.abs(z)<18){
    return false;
  }

  for(const h of houses){

    if(
      Math.hypot(
        x-h.x,
        z-h.z
      )<11
    ){
      return false;
    }
  }

  for(const c of cars){

    if(
      Math.hypot(
        x-c.group.position.x,
        z-c.group.position.z
      )<7
    ){
      return false;
    }
  }

  return !blocked(x,z,1);
}

function setupFallback(){

  if(playerModel){
    return;

  playerModel=fallbackCharacter();

  playerModel.scale.setScalar(.75);

  player.add(playerModel);
}

function findAnimation(names){

  for(const wanted of names){

    const key=Object.keys(actions)
      .find(
        n=>n.toLowerCase()===
        wanted.toLowerCase()
      );

    if(key){
      return actions[key];
    }
  }

  return null;
}

function setAnimation(names){

  if(!mixer){
    return;
  }

  const next=findAnimation(names);

  if(!next||next===activeAction){
    return;
  }

  if(activeAction){
    activeAction.fadeOut(.15);
  }

  next.reset();
  next.fadeIn(.15);
  next.play();

  activeAction=next;
}

function loadGLB(){

  const loader=new GLTFLoader();

  document.getElementById("loadText").textContent=
    "Memuat karakter 3D...";

  loader.load(
    "https://threejs.org/examples/models/gltf/Soldier.glb",

    gltf=>{

      if(playerModel){
        player.remove(playerModel);
      }

      playerModel=gltf.scene;

      playerModel.traverse(o=>{
        if(o.isMesh){
          o.castShadow=true;
          o.receiveShadow=true;
        }
      });

      const box1=
        new THREE.Box3()
        .setFromObject(playerModel);

      const size=
        box1.getSize(
          new THREE.Vector3()
        );

      const targetHeight=1.85;

      const scale=
        targetHeight/
        Math.max(size.y,.001);

      playerModel.scale
        .setScalar(scale);

      const box2=
        new THREE.Box3()
        .setFromObject(playerModel);

      const center=
        box2.getCenter(
          new THREE.Vector3()
        );

      playerModel.position.x=
        -center.x;

      playerModel.position.z=
        -center.z;

      playerModel.position.y=
        -box2.min.y;

      player.add(playerModel);

      mixer=
        new THREE.AnimationMixer(
          playerModel
        );

      for(const clip of gltf.animations){
        actions[clip.name]=
          mixer.clipAction(clip);
      }

      setAnimation(["Idle"]);

      document.getElementById("loadText").textContent=
        "Dunia siap";

      setTimeout(()=>{
        document.getElementById("loading").style.display="none";
      },300);
    },

    xhr=>{

      if(xhr.total){

        const p=
          Math.round(
            xhr.loaded/xhr.total*100
          );

        document
          .getElementById("loading")
          .firstElementChild
          .textContent=
          "MEMUAT KARAKTER "+p+"%";
      }
    },

    error=>{

      console.log(
        "GLB gagal:",
        error
      );

      setupFallback();

      document.getElementById("loading").style.display=
        "none";
    }
  );
}

loadGLB();

function jump(){

  if(activeCar){
    return;
  }

  if(grounded){

    velocityY=8.2;

    grounded=false;
  }
}

function toggleCrouch(){

  if(activeCar){
    return;
  }

  crouching=!crouching;
}

function movePlayer(x,y){

  if(activeCar){
    return;
  }

  const len=Math.hypot(x,y);

  if(len<.08){
    return;
  }

  x/=len;
  y/=len;

  const speed=
    sprinting?
    8.2:
    crouching?
    2.3:
    5.0;

  const forwardX=
    -Math.sin(camYaw);

  const forwardZ=
    -Math.cos(camYaw);

  const rightX=
    Math.cos(camYaw);

  const rightZ=
    -Math.sin(camYaw);

  const mx=
    forwardX*(-y)+
    rightX*x;

  const mz=
    forwardZ*(-y)+
    rightZ*x;

  const nx=
    player.position.x+
    mx*speed*.016;

  const nz=
    player.position.z+
    mz*speed*.016;

  if(
    !blocked(
      nx,
      player.position.z,
      .58
    )
  ){
    player.position.x=nx;
  }

  if(
    !blocked(
      player.position.x,
      nz,
      .58
    )
  ){
    player.position.z=nz;
  }

  if(Math.abs(mx)+Math.abs(mz)>.01){

    player.rotation.y=
      Math.atan2(mx,mz);
  }

  if(mixer){

    if(sprinting){
      setAnimation(["Run","run"]);
    }else{
      setAnimation(["Walk","walk"]);
    }
  }
}

function nearestZombie(){

  let result=null;
  let best=3;

  for(const z of zombies){

    const d=
      player.position.distanceTo(
        z.group.position
      );

    if(d<best){

      best=d;
      result=z;
    }
  }

  return result;
}

function nearestCar(){

  let result=null;
  let best=4.7;

  for(const c of cars){

    const d=
      player.position.distanceTo(
        c.group.position
      );

    if(d<best){

      best=d;
      result=c;
    }
  }

  return result;
}

function nearestPickup(){

  let result=null;
  let best=2.5;

  for(const p of pickups){

    const d=
      player.position.distanceTo(
        p.position
      );

    if(d<best){

      best=d;
      result=p;
    }
  }

  return result;
}

function nearestHouse(){

  let result=null;
  let best=7;

  for(const h of houses){

    const d=
      Math.hypot(
        player.position.x-h.x,
        player.position.z-(h.z+5)
      );

    if(d<best){

      best=d;
      result=h;
    }
  }

  return result;
}

function doAction(){

  if(actionCooldown>0){
    return;
  }

  actionCooldown=.55;

  if(activeCar){
    return;
  }

  const zombie=nearestZombie();

  if(zombie){

    const dx=
      zombie.group.position.x-
      player.position.x;

    const dz=
      zombie.group.position.z-
      player.position.z;

    const dist=
      Math.hypot(dx,dz)||1;

    zombie.group.position.x+=
      dx/dist*1.3;

    zombie.group.position.z+=
      dz/dist*1.3;

    return;
  }

  const pickup=nearestPickup();

  if(pickup){

    hunger=
      Math.min(
        100,
        hunger+20
      );

    scene.remove(pickup);

    const i=
      pickups.indexOf(pickup);

    if(i>=0){
      pickups.splice(i,1);
    }

    return;
  }

  const car=nearestCar();

  if(car){

    enterCar(car);
    return;
  }

  const house=nearestHouse();

  if(house){
    enterHouse(house);
  }
}

function enterCar(car){

  if(activeCar){
    return;
  }

  activeCar=car;

  player.visible=false;

  car.group.add(player);

  player.position.set(
    0,
    1.05,
    0
  );

  document.getElementById("enterBtn").style.display="none";
  document.getElementById("exitBtn").style.display="block";

  document.getElementById("status").textContent=
    "DI DALAM MOBIL";
}

function exitCar(){

  if(!activeCar){
    return;
  }

  const car=activeCar;

  car.group.remove(player);

  player.visible=true;

  player.position.set(
    car.group.position.x-
    Math.sin(car.group.rotation.y)*5,

    0,

    car.group.position.z-
    Math.cos(car.group.rotation.y)*5
  );

  activeCar=null;

  document.getElementById("enterBtn").style.display="block";
  document.getElementById("exitBtn").style.display="none";

  document.getElementById("status").textContent=
    "BERJALAN";
}

function driveCar(car){

  let throttle=0;

  if(
    keys.w||
    keys.arrowup||
    joystickY<-.15
  ){
    throttle=1;
  }

  if(
    keys.s||
    keys.arrowdown||
    joystickY>.15
  ){
    throttle=-.7;
  }

  car.speed+=
    throttle*.035;

  car.speed*=.985;

  car.speed=
    THREE.MathUtils.clamp(
      car.speed,
      -.55,
      1.25
    );

  let steer=0;

  if(
    keys.a||
    keys.arrowleft||
    joystickX<-.2
  ){
    steer=1;
  }

  if(
    keys.d||
    keys.arrowright||
    joystickX>.2
  ){
    steer=-1;
  }

  if(Math.abs(car.speed)>.02){

    car.group.rotation.y+=
      steer*.035*
      Math.min(
        Math.abs(car.speed)*1.4,
        1
      );
  }

  const fx=
    Math.sin(
      car.group.rotation.y
    );

  const fz=
    Math.cos(
      car.group.rotation.y
    );

  const nx=
    car.group.position.x+
    fx*car.speed;

  const nz=
    car.group.position.z+
    fz*car.speed;

  if(
    !blocked(
      nx,
      nz,
      2,
      car.group
    )
  ){

    car.group.position.x=nx;
    car.group.position.z=nz;

  }else{

    car.speed*=-.25;
  }

  for(const wheel of car.wheels){
    wheel.rotation.x-=car.speed;
  }
}

function enterHouse(house){

  if(insideHouse){
    return;
  }

  insideHouse=house;

  player.position.set(
    house.x,
    0,
    house.z
  );

  document.getElementById("status").textContent=
    "DI DALAM RUMAH";
}

function updateZombies(dt){

  for(const z of zombies){

    z.phase+=dt;

    const dx=
      player.position.x-
      z.group.position.x;

    const dz=
      player.position.z-
      z.group.position.z;

    const dist=
      Math.hypot(dx,dz);

    if(
      dist>2.2&&
      dist<70
    ){

      const nx=dx/dist;
      const nz=dz/dist;

      const speed=
        z.speed*dt;

      const tx=
        z.group.position.x+
        nx*speed;

      const tz=
        z.group.position.z+
        nz*speed;

      if(
        !blocked(
          tx,
          z.group.position.z,
          .5
        )
      ){
        z.group.position.x=tx;
      }

      if(
        !blocked(
          z.group.position.x,
          tz,
          .5
        )
      ){
        z.group.position.z=tz;
      }

      z.group.rotation.y=
        Math.atan2(nx,nz);
    }

    z.attack-=dt;

    if(
      dist<2.3&&
      z.attack<=0
    ){

      hp=
        Math.max(
          0,
          hp-7
        );

      z.attack=1.1;

      const px=dx/(dist||1);
      const pz=dz/(dist||1);

      player.position.x+=px*.7;
      player.position.z+=pz*.7;
    }
  }
}

function updatePlayer(dt){

  if(activeCar){

    driveCar(activeCar);

    return;
  }

  let x=joystickX;
  let y=joystickY;

  if(keys.w||keys.arrowup){
    y=-1;
  }

  if(keys.s||keys.arrowdown){
    y=1;
  }

  if(keys.a||keys.arrowleft){
    x=-1;
  }

  if(keys.d||keys.arrowright){
    x=1;
  }

  if(
    Math.abs(x)>.08||
    Math.abs(y)>.08
  ){

    movePlayer(x,y);

  }else{

    if(mixer){
      setAnimation(["Idle","idle"]);
    }
  }

  velocityY-=20*dt;

  player.position.y+=
    velocityY*dt;

  if(player.position.y<=0){

    player.position.y=0;

    velocityY=0;

    grounded=true;
  }

  player.position.x=
    THREE.MathUtils.clamp(
      player.position.x,
      -150,
      150
    );

  player.position.z=
    THREE.MathUtils.clamp(
      player.position.z,
      -150,
      150
    );
}

function updateCamera(){

  let target;

  if(activeCar){

    target=
      activeCar.group.position.clone();

    target.y+=1.15;

  }else{

    target=
      player.position.clone();

    target.y+=
      crouching?
      .9:
      1.05;
  }

  const horizontal=
    Math.cos(camPitch)*
    camDistance;

  const offset=new THREE.Vector3(
    Math.sin(camYaw)*
    horizontal,

    Math.sin(camPitch)*
    camDistance,

    Math.cos(camYaw)*
    horizontal
  );

  const desired=
    target.clone().add(offset);

  const direction=
    desired.clone().sub(target);

  const distance=
    direction.length();

  direction.normalize();

  const ray=
    new THREE.Raycaster(
      target,
      direction,
      .1,
      distance
    );

  const objects=[];

  scene.traverse(o=>{

    if(
      o.isMesh&&
      o!==ground&&
      !player.children.includes(o)
    ){
      objects.push(o);
    }
  });

  const hits=
    ray.intersectObjects(
      objects,
      true
    );

  targetCamDistance=4.8;

  if(
    hits.length&&
    hits[0].distance<distance
  ){

    targetCamDistance=
      Math.max(
        1.1,
        hits[0].distance-.35
      );
  }

  camDistance+=
    (
      targetCamDistance-
      camDistance
    )*.22;

  const h=
    Math.cos(camPitch)*
    camDistance;

  camera.position.set(
    target.x+
    Math.sin(camYaw)*h,

    target.y+
    Math.sin(camPitch)*
    camDistance,

    target.z+
    Math.cos(camYaw)*h
  );

  camera.lookAt(target);
}

function updateHUD(){

  document.getElementById("hpFill").style.width=
    hp+"%";

  document.getElementById("foodFill").style.width=
    hunger+"%";

  const zombie=nearestZombie();
  const pickup=nearestPickup();
  const car=nearestCar();

  if(activeCar){

    document.getElementById("actionBtn").textContent=
      "DRIVE";

  }else if(zombie){

    document.getElementById("actionBtn").textContent=
      "👊";

  }else if(pickup){

    document.getElementById("actionBtn").textContent=
      "AMBIL";

  }else if(car){

    document.getElementById("actionBtn").textContent=
      "MASUK";

  }else{

    document.getElementById("actionBtn").textContent=
      "👊";
  }
}

function updateHunger(dt){

  hungerTimer+=dt;

  if(hungerTimer>8){

    hungerTimer=0;

    hunger=
      Math.max(
        0,
        hunger-1
      );

    if(hunger<=0){

      hp=
        Math.max(
          0,
          hp-2
        );
    }
  }
}

const joystick=
  document.getElementById(
    "joystick"
  );

const stick=
  document.getElementById(
    "stick"
  );

let joyPointer=null;

function updateJoystick(x,y){

  const r=
    joystick.getBoundingClientRect();

  const cx=
    r.left+r.width/2;

  const cy=
    r.top+r.height/2;

  let dx=x-cx;
  let dy=y-cy;

  const max=48;

  const len=
    Math.hypot(dx,dy);

  if(len>max){

    dx=dx/len*max;
    dy=dy/len*max;
  }

  stick.style.transform=
    `translate(${dx}px,${dy}px)`;

  joystickX=dx/max;
  joystickY=dy/max;
}

function resetJoystick(){

  joyPointer=null;

  stick.style.transform=
    "translate(0,0)";

  joystickX=0;
  joystickY=0;
}

joystick.addEventListener(
  "pointerdown",
  e=>{

    joyPointer=e.pointerId;

    joystick.setPointerCapture(
      e.pointerId
    );

    updateJoystick(
      e.clientX,
      e.clientY
    );
  }
);

joystick.addEventListener(
  "pointermove",
  e=>{

    if(e.pointerId===joyPointer){

      updateJoystick(
        e.clientX,
        e.clientY
      );
    }
  }
);

joystick.addEventListener(
  "pointerup",
  resetJoystick
);

joystick.addEventListener(
  "pointercancel",
  resetJoystick
);

renderer.domElement.addEventListener(
  "pointerdown",
  e=>{

    if(
      e.clientX<
      innerWidth*.4
    ){
      return;
    }

    cameraDragging=true;

    lastTouchX=e.clientX;
    lastTouchY=e.clientY;
  }
);

renderer.domElement.addEventListener(
  "pointermove",
  e=>{

    if(!cameraDragging){
      return;
    }

    const dx=
      e.clientX-lastTouchX;

    const dy=
      e.clientY-lastTouchY;

    lastTouchX=e.clientX;
    lastTouchY=e.clientY;

    camYaw-=dx*.006;
    camPitch-=dy*.005;

    camPitch=
      THREE.MathUtils.clamp(
        camPitch,
        -1.05,
        .9
      );
  }
);

renderer.domElement.addEventListener(
  "pointerup",
  ()=>{
    cameraDragging=false;
  }
);

renderer.domElement.addEventListener(
  "pointercancel",
  ()=>{
    cameraDragging=false;
  }
);

document.getElementById(
  "jumpBtn"
).addEventListener(
  "pointerdown",
  jump
);

document.getElementById(
  "crouchBtn"
).addEventListener(
  "pointerdown",
  toggleCrouch
);

document.getElementById(
  "sprintBtn"
).addEventListener(
  "pointerdown",
  ()=>{
    sprinting=true;
  }
);

document.getElementById(
  "sprintBtn"
).addEventListener(
  "pointerup",
  ()=>{
    sprinting=false;
  }
);

document.getElementById(
  "sprintBtn"
).addEventListener(
  "pointercancel",
  ()=>{
    sprinting=false;
  }
);

document.getElementById(
  "actionBtn"
).addEventListener(
  "pointerdown",
  doAction
);

document.getElementById(
  "enterBtn"
).addEventListener(
  "pointerdown",
  ()=>{
    const car=nearestCar();

    if(car&&!activeCar){
      enterCar(car);
    }
  }
);

document.getElementById(
  "exitBtn"
).addEventListener(
  "pointerdown",
  exitCar
);

document.getElementById(
  "fullscreen"
).addEventListener(
  "click",
  async()=>{

    try{

      if(!document.fullscreenElement){

        await document
          .documentElement
          .requestFullscreen();

      }else{

        await document.exitFullscreen();
      }

    }catch(e){}
  }
);

document.getElementById(
  "exitBtn"
).style.display="none";

function animate(){

  requestAnimationFrame(
    animate
  );

  const dt=
    Math.min(
      clock.getDelta(),
      .05
    );

  if(mixer){
    mixer.update(dt);
  }

  actionCooldown=
    Math.max(
      0,
      actionCooldown-dt
    );

  updatePlayer(dt);
  updateZombies(dt);
  updateHunger(dt);
  updateCamera();
  updateHUD();

  renderer.render(
    scene,
    camera
  );
}

window.addEventListener(
  "resize",
  ()=>{

    camera.aspect=
      innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );
  }
);

animate();

setTimeout(()=>{

  if(
    document.getElementById(
      "loading"
    ).style.display!=="none"
  ){

    setupFallback();

    document.getElementById(
      "loading"
    ).style.display="none";
  }

},10000);

</script>
