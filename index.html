<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Virelia: Afterfall</title>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
  }
}
</script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
  touch-action:none;
}

body{
  position:fixed;
  inset:0;
}

canvas{
  display:block;
  width:100%;
  height:100%;
  touch-action:none;
}

#loading{
  position:fixed;
  inset:0;
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#10161a;
  color:#fff;
  font-size:20px;
  letter-spacing:2px;
}

#hud{
  position:fixed;
  top:14px;
  left:14px;
  z-index:10;
  color:white;
  text-shadow:0 2px 5px #000;
  pointer-events:none;
}

#title{
  font-size:16px;
  font-weight:bold;
  margin-bottom:6px;
}

.bar{
  width:190px;
  height:12px;
  background:#222;
  border:1px solid #555;
  border-radius:8px;
  overflow:hidden;
  margin-bottom:5px;
}

#hpbar{
  width:100%;
  height:100%;
  background:#d94a4a;
}

#stambar{
  width:100%;
  height:100%;
  background:#e0b84a;
}

#joystick{
  position:fixed;
  left:24px;
  bottom:24px;
  width:145px;
  height:145px;
  z-index:20;
  border-radius:50%;
  background:rgba(255,255,255,.10);
  border:2px solid rgba(255,255,255,.22);
}

#stick{
  position:absolute;
  left:42px;
  top:42px;
  width:61px;
  height:61px;
  border-radius:50%;
  background:rgba(255,255,255,.32);
  border:2px solid rgba(255,255,255,.45);
}

#actions{
  position:fixed;
  right:22px;
  bottom:22px;
  z-index:20;
  display:grid;
  grid-template-columns:repeat(2,78px);
  gap:12px;
}

.action{
  width:78px;
  height:78px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.3);
  background:rgba(25,30,35,.65);
  color:white;
  font-weight:bold;
  font-size:13px;
  touch-action:none;
}

.action:active{
  transform:scale(.92);
  background:rgba(255,255,255,.25);
}

#action{
  font-size:26px;
}

#fullscreen{
  position:fixed;
  right:18px;
  top:15px;
  z-index:20;
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.45);
  color:white;
  font-size:20px;
}

@media (orientation:portrait){
  #joystick{
    left:16px;
    bottom:18px;
  }

  #actions{
    right:12px;
    bottom:16px;
  }
}
</style>
</head>

<body>

<div id="loading">MEMUAT VIRELIA 3D...</div>

<div id="hud">
  <div id="title">VIRELIA // AFTERFALL</div>

  <div>HP</div>
  <div class="bar">
    <div id="hpbar"></div>
  </div>

  <div>STAMINA</div>
  <div class="bar">
    <div id="stambar"></div>
  </div>
</div>

<button id="fullscreen">⛶</button>

<div id="joystick">
  <div id="stick"></div>
</div>

<div id="actions">
  <button class="action" id="jump">JUMP</button>
  <button class="action" id="sprint">RUN</button>
  <button class="action" id="crouch">CROUCH</button>
  <button class="action" id="action">👊</button>
</div>

<script type="module">
import {startGame} from "./src/main.js";
startGame();
</script>

</body>
</html>
