<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Virelia: Afterfall</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#151b1a;
  font-family:Arial,sans-serif;
}

canvas{
  display:block;
  width:100%;
  height:100%;
  touch-action:none;
}

#hud{
  position:fixed;
  inset:0;
  pointer-events:none;
  color:#fff;
}

/* PLAYER CARD */

#playerCard{
  position:absolute;
  top:12px;
  left:12px;
  width:185px;
  padding:10px;
  border-radius:12px;
  background:rgba(10,15,16,.82);
}

.name{
  font-size:13px;
  font-weight:bold;
}

.bar{
  height:7px;
  margin-top:6px;
  overflow:hidden;
  border-radius:8px;
  background:#303839;
}

#hpBar{
  width:100%;
  height:100%;
  background:#5bd477;
}

#staminaBar{
  width:100%;
  height:100%;
  background:#d8d75c;
}

/* ZONE */

#zone{
  position:absolute;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  padding:8px 15px;
  border-radius:14px;
  text-align:center;
  background:rgba(10,15,16,.82);
  font-size:11px;
}

/* ALIVE */

#aliveBox{
  position:absolute;
  top:12px;
  right:140px;
  padding:9px 12px;
  border-radius:11px;
  background:rgba(10,15,16,.82);
  font-size:11px;
}

/* MINIMAP */

#miniWrap{
  position:absolute;
  top:12px;
  right:12px;
  width:115px;
  height:115px;
  overflow:hidden;
  border:2px solid rgba(255,255,255,.3);
  border-radius:12px;
  background:#687c59;
}

#mini{
  width:100%;
  height:100%;
}

/* CENTER */

#crosshair{
  position:absolute;
  left:50%;
  top:50%;
  width:18px;
  height:18px;
  transform:translate(-50%,-50%);
}

#crosshair::before,
#crosshair::after{
  content:"";
  position:absolute;
  background:rgba(255,255,255,.8);
}

#crosshair::before{
  left:8px;
  top:0;
  width:2px;
  height:18px;
}

#crosshair::after{
  left:0;
  top:8px;
  width:18px;
  height:2px;
}

/* MESSAGE */

#message{
  position:absolute;
  left:50%;
  bottom:210px;
  transform:translateX(-50%);
  padding:8px 13px;
  border-radius:10px;
  background:rgba(0,0,0,.65);
  font-size:12px;
  opacity:0;
  transition:.2s;
}

/* INVENTORY */

#inventory{
  position:absolute;
  right:15px;
  bottom:190px;
  width:220px;
  padding:12px;
  border-radius:13px;
  background:rgba(10,15,16,.92);
  display:none;
  font-size:12px;
}

.invTitle{
  font-weight:bold;
  margin-bottom:8px;
}

.invRow{
  display:flex;
  justify-content:space-between;
  padding:7px 0;
  border-bottom:1px solid rgba(255,255,255,.08);
}

/* JOYSTICK */

#joystick{
  position:absolute;
  left:22px;
  bottom:25px;
  width:145px;
  height:145px;
  border:2px solid rgba(255,255,255,.14);
  border-radius:50%;
  background:rgba(255,255,255,.07);
  pointer-events:auto;
}

#stick{
  position:absolute;
  left:40px;
  top:40px;
  width:65px;
  height:65px;
  border:2px solid rgba(255,255,255,.25);
  border-radius:50%;
  background:rgba(255,255,255,.18);
}

/* ACTIONS */

#buttons{
  position:absolute;
  right:16px;
  bottom:22px;
  width:190px;
  height:180px;
  pointer-events:none;
}

.btn{
  position:absolute;
  width:61px;
  height:61px;
  border:1px solid rgba(255,255,255,.15);
  border-radius:50%;
  color:white;
  background:rgba(12,19,20,.82);
  font-size:10px;
  font-weight:bold;
  pointer-events:auto;
}

.btn:active{
  transform:scale(.93);
}

#actionBtn{
  right:0;
  top:48px;
  width:75px;
  height:75px;
}

#runBtn{
  right:76px;
  bottom:5px;
}

#crouchBtn{
  right:0;
  bottom:0;
}

#bagBtn{
  right:145px;
  bottom:130px;
  width:45px;
  height:45px;
}

/* START */

#start{
  position:fixed;
  inset:0;
  z-index:10;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#101615;
  color:white;
}

.startBox{
  width:min(90%,390px);
  padding:28px;
  border-radius:18px;
  text-align:center;
  background:#18211f;
}

.title{
  font-size:27px;
  font-weight:900;
  letter-spacing:3px;
}

.sub{
  margin-top:10px;
  color:#9da9a5;
  font-size:12px;
  line-height:1.5;
}

#startBtn{
  width:100%;
  margin-top:22px;
  padding:15px;
  border:0;
  border-radius:10px;
  background:#587a65;
  color:white;
  font-weight:bold;
}

@media(max-width:600px){

  #aliveBox{
    display:none;
  }

  #playerCard{
    width:165px;
  }

  #miniWrap{
    width:105px;
    height:105px;
  }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">

  <div id="playerCard">
    <div class="name">SURVIVOR • 01</div>

    <div class="bar">
      <div id="hpBar"></div>
    </div>

    <div class="bar">
      <div id="staminaBar"></div>
    </div>
  </div>

  <div id="zone">
    ZONA AMAN<br>
    <span id="zoneTimer">05:00</span>
  </div>

  <div id="aliveBox">
    ALIVE<br>
    <b id="alive">70</b>
  </div>

  <div id="miniWrap">
    <canvas id="mini"></canvas>
  </div>

  <div id="crosshair"></div>

  <div id="message"></div>

  <div id="inventory">

    <div class="invTitle">
      INVENTORY
    </div>

    <div class="invRow">
      <span>Medkit</span>
      <b id="medkit">0</b>
    </div>

    <div class="invRow">
      <span>Food</span>
      <b id="food">0</b>
    </div>

    <div class="invRow">
      <span>Helmet</span>
      <b id="helmet">-</b>
    </div>

    <div class="invRow">
      <span>Vest</span>
      <b id="vest">-</b>
    </div>

    <div class="invRow">
      <span>Backpack</span>
      <b id="backpack">-</b>
    </div>

    <div class="invRow">
      <span>Shoes</span>
      <b id="shoes">-</b>
    </div>

  </div>

  <div id="joystick">
    <div id="stick"></div>
  </div>

  <div id="buttons">

    <button class="btn"
            id="bagBtn">
      BAG
    </button>

    <button class="btn"
            id="actionBtn">
      ACTION
    </button>

    <button class="btn"
            id="runBtn">
      RUN
    </button>

    <button class="btn"
            id="crouchBtn">
      CROUCH
    </button>

  </div>

</div>

<div id="start">

  <div class="startBox">

    <div class="title">
      VIRELIA
    </div>

    <div class="sub">
      AFTERFALL<br><br>
      GAMEPLAY FOUNDATION<br>
      70 SURVIVORS
    </div>

    <button id="startBtn">
      MASUK MAP
    </button>

  </div>

</div>

<script type="module">
import { startGame } from "./src/main.js";

startGame();
</script>

</body>
</html>
