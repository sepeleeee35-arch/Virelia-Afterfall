<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Virelia: Afterfall</title>
    <link rel="stylesheet" href="style.css?v=4">
</head>

<body>

<div id="game-wrapper">

    <canvas id="game"></canvas>

    <div id="hud">
        <div class="title">VIRELIA: AFTERFALL</div>

        <div class="stats">
            <div>♥ HP: <span id="hp">100</span></div>
            <div>🍗 Hunger: <span id="hunger">100</span></div>
        </div>

        <div id="time">DAY 1 • 08:00</div>
    </div>

    <div id="message">SURVIVE</div>

    <div id="controls">
        <button id="up" type="button">▲</button>

        <div class="middle-controls">
            <button id="left" type="button">◀</button>
            <button id="down" type="button">▼</button>
            <button id="right" type="button">▶</button>
        </div>
    </div>

</div>

<script src="script.js?v=4"></script>

</body>
</html>
