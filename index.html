function mat(color,roughness=0.8){
  return new THREE.MeshStandardMaterial({
    color,
    roughness
  });
}

function box(w,h,d,color){
  const m=new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    mat(color)
  );
  m.castShadow=true;
  m.receiveShadow=true;
  return m;
}

function addCollider(x,z,w,d,owner=null){
  colliders.push({
    x,
    z,
    w,
    d,
    owner
  });
}

function blocked(x,z,r=.7,ignore=null){
  for(const c of colliders){
    if(c.owner===ignore) continue;

    const dx=Math.max(
      Math.abs(x-c.x)-c.w/2,
      0
    );

    const dz=Math.max(
      Math.abs(z-c.z)-c.d/2,
      0
    );

    if(dx*dx+dz*dz<r*r){
      return true;
    }
  }

  return false;
}

function createRoad(x,z,w,d){
  const road=box(w,.04,d,0x292929);
  road.position.set(x,.02,z);
  scene.add(road);

  const lineMat=mat(0xd9c94d);

  if(w>d){
    for(let p=x-w/2+8;p<x+w/2;p+=16){
      const line=new THREE.Mesh(
        new THREE.BoxGeometry(7,.045,.22),
        lineMat
      );
      line.position.set(p,.05,z);
      scene.add(line);
    }
  }else{
    for(let p=z-d/2+8;p<z+d/2;p+=16){
      const line=new THREE.Mesh(
        new THREE.BoxGeometry(.22,.045,7),
        lineMat
      );
      line.position.set(x,.05,p);
      scene.add(line);
    }
  }
}

function validZombieSpawn(x,z){
  if(Math.abs(x)<15 && Math.abs(z)<15) return false;

  for(const h of houses){
    if(Math.hypot(x-h.x,z-h.z)<11) return false;
  }

  for(const c of cars){
    const p=c.group.position;
    if(Math.hypot(x-p.x,z-p.z)<6) return false;
  }

  return !blocked(x,z,1);
}

let tries=0;
while(zombies.length<12 && tries<300){
  tries++;

  const x=(Math.random()-.5)*230;
  const z=(Math.random()-.5)*230;

  if(validZombieSpawn(x,z)){
    createZombie(x,z);
  }
}

function setupFallback(){
  if(playerModel) return;

  playerModel=createFallbackCharacter();
  player.add(playerModel);
  playerModel.scale.setScalar(.92);
}

function findAnimation(clipNames){
  for(const wanted of clipNames){
    const found=Object.keys(actions).find(
      n=>n.toLowerCase()===wanted.toLowerCase()
    );

    if(found) return actions[found];
  }

  return null;
}

function setAnimation(names){
  if(!mixer) return;

  const next=findAnimation(names);

  if(!next || next===activeAction) return;

  if(activeAction){
    activeAction.fadeOut(.15);
  }

  next.reset().fadeIn(.15).play();
  activeAction=next;
}

function loadGLB(){
  const loader=new GLTFLoader();

  document.getElementById("loadText").textContent=
    "Memuat karakter 3D...";

  loader.load(
    "https://threejs.org/examples/models/gltf/Soldier.glb",

    gltf=>{
      if(playerModel){
        player.remove(playerModel);
      }

      playerModel=gltf.scene;

      playerModel.traverse(o=>{
        if(o.isMesh){
          o.castShadow=true;
          o.receiveShadow=true;
        }
      });

      const b1=new THREE.Box3().setFromObject(playerModel);
      const size=b1.getSize(new THREE.Vector3());

      const scale=3.8/Math.max(size.y,.001);
      playerModel.scale.setScalar(scale);

      const b2=new THREE.Box3().setFromObject(playerModel);
      const center=b2.getCenter(new THREE.Vector3());

      playerModel.position.x=-center.x;
      playerModel.position.z=-center.z;
      playerModel.position.y=-b2.min.y;

      player.add(playerModel);

      mixer=new THREE.AnimationMixer(playerModel);

      for(const clip of gltf.animations){
        actions[clip.name]=mixer.clipAction(clip);
      }

      setAnimation(["Idle"]);

      glbReady=true;

      document.getElementById("loadText").textContent=
        "Dunia siap";

      setTimeout(()=>{
        document.getElementById("loading").style.display="none";
      },300);
    },

    xhr=>{
      if(xhr.total){
        const p=Math.round(
          xhr.loaded/xhr.total*100
        );

        document.getElementById("loading").firstElementChild.textContent=
          "MEMUAT KARAKTER "+p+"%";
      }
    },

    error=>{
      console.log("GLB gagal dimuat, memakai karakter cadangan.",error);

      setupFallback();

      document.getElementById("loadText").textContent=
        "Karakter cadangan aktif";

      setTimeout(()=>{
        document.getElementById("loading").style.display="none";
      },500);
    }
  );
}

loadGLB();

function jump(){
  if(activeCar) return;

  if(grounded){
    velocityY=8.5;
    grounded=false;
  }
}

function toggleCrouch(){
  if(activeCar) return;

  crouching=!crouching;
}

function movePlayer(dx,dz){
  if(activeCar) return;

  const len=Math.hypot(dx,dz);

  if(len<.001) return;

  dx/=len;
  dz/=len;

  const speed=sprinting?8.5:crouching?2.2:5.0;

  const forwardX=Math.sin(camYaw);
  const forwardZ=Math.cos(camYaw);

  const rightX=Math.cos(camYaw);
  const rightZ=-Math.sin(camYaw);

  const mx=
    forwardX*(-dz)+
    rightX*dx;

  const mz=
    forwardZ*(-dz)+
    rightZ*dx;

  const nx=player.position.x+mx*speed*.016;
  const nz=player.position.z+mz*speed*.016;

  if(!blocked(nx,player.position.z,.65)){
    player.position.x=nx;
  }

  if(!blocked(player.position.x,nz,.65)){
    player.position.z=nz;
  }

  player.rotation.y=Math.atan2(mx,mz);

  if(mixer){
    setAnimation(
      sprinting?
      ["Run","run"]:
      crouching?
      ["Walk","walk"]:
      ["Walk","walk"]
    );
  }
}

function nearestZombie(){
  let best=null;
  let dist=3.2;

  for(const z of zombies){
    const d=player.position.distanceTo(z.group.position);

    if(d<dist){
      dist=d;
      best=z;
    }
  }

  return best;
}

function nearestCar(){
  let best=null;
  let dist=4.5;

  for(const c of cars){
    const d=player.position.distanceTo(c.group.position);

    if(d<dist){
      dist=d;
      best=c;
    }
  }

  return best;
}

function nearestPickup(){
  let best=null;
  let dist=2.5;

  for(const p of pickups){
    const d=player.position.distanceTo(p.position);

    if(d<dist){
      dist=d;
      best=p;
    }
  }

  return best;
}

function nearestHouse(){
  let best=null;
  let dist=7;

  for(const h of houses){
    const d=Math.hypot(
      player.position.x-h.x,
      player.position.z-(h.z+5)
    );

    if(d<dist){
      dist=d;
      best=h;
    }
  }

  return best;
}

function doAction(){
  if(actionCooldown>0) return;

  actionCooldown=.55;

  if(activeCar){
    return;
  }

  const zombie=nearestZombie();

  if(zombie){
    zombie.group.position.x-=
      Math.sin(player.rotation.y)*1.3;

    zombie.group.position.z-=
      Math.cos(player.rotation.y)*1.3;

    return;
  }

  const pickup=nearestPickup();

  if(pickup){
    hunger=Math.min(100,hunger+20);

    scene.remove(pickup);

    const i=pickups.indexOf(pickup);

    if(i>=0) pickups.splice(i,1);

    return;
  }

  const car=nearestCar();

  if(car){
    enterCar(car);
    return;
  }

  const house=nearestHouse();

  if(house){
    enterHouse(house);
  }
}

function enterCar(car){
  if(activeCar) return;

  activeCar=car;

  player.visible=false;

  car.group.add(player);

  player.position.set(0,1.1,0);

  document.getElementById("enterBtn").style.display="none";
  document.getElementById("exitBtn").style.display="block";
  document.getElementById("actionBtn").textContent="DRIVE";
  document.getElementById("status").textContent="DI DALAM MOBIL";
}

function exitCar(){
  if(!activeCar) return;

  const car=activeCar;

  car.group.remove(player);

  player.visible=true;

  const backX=
    car.group.position.x-
    Math.sin(car.group.rotation.y)*5;

  const backZ=
    car.group.position.z-
    Math.cos(car.group.rotation.y)*5;

  player.position.set(backX,0,backZ);

  activeCar=null;

  document.getElementById("enterBtn").style.display="block";
  document.getElementById("exitBtn").style.display="none";
  document.getElementById("actionBtn").textContent="👊";
  document.getElementById("status").textContent="BERJALAN";
}

function driveCar(car){
  let throttle=0;

  if(keys.w||keys.arrowup||joystickY<-.15){
    throttle=1;
  }

  if(keys.s||keys.arrowdown||joystickY>.15){
    throttle=-.65;
  }

  const maxSpeed=1.2;

  car.speed+=throttle*.035;

  car.speed*=.985;

  car.speed=THREE.MathUtils.clamp(
    car.speed,
    -0.55,
    maxSpeed
  );

  let steer=0;

  if(keys.a||keys.arrowleft||joystickX<-.2){
    steer=1;
  }

  if(keys.d||keys.arrowright||joystickX>.2){
    steer=-1;
  }

  if(Math.abs(car.speed)>.02){
    car.group.rotation.y+=
      steer*.035*
      Math.min(Math.abs(car.speed)*1.4,1);
  }

  const forwardX=Math.sin(car.group.rotation.y);
  const forwardZ=Math.cos(car.group.rotation.y);

  const nx=
    car.group.position.x+
    forwardX*car.speed;

  const nz=
    car.group.position.z+
    forwardZ*car.speed;

  if(
    !blocked(nx,nz,2.1,car.group)
  ){
    car.group.position.x=nx;
    car.group.position.z=nz;
  }else{
    car.speed*=-.25;
  }

  for(const wheel of car.wheels){
    wheel.rotation.x-=car.speed;
  }
}

function enterHouse(house){
  if(insideHouse) return;

  insideHouse=house;

  player.position.set(
    house.x,
    0,
    house.z
  );

  document.getElementById("status").textContent=
    "DI DALAM RUMAH";
}

function leaveHouse(){
  if(!insideHouse) return;

  const h=insideHouse;

  player.position.set(
    h.x,
    0,
    h.z+8
  );

  insideHouse=null;

  document.getElementById("status").textContent=
    "BERJALAN";
}

function updateZombies(dt){
  for(const z of zombies){

    z.phase+=dt;

    const dx=
      player.position.x-z.group.position.x;

    const dz=
      player.position.z-z.group.position.z;

    const dist=Math.hypot(dx,dz);

    if(dist>2.2 && dist<70){

      const nx=dx/dist;
      const nz=dz/dist;

      const speed=z.speed*dt;

      const tx=
        z.group.position.x+nx*speed;

      const tz=
        z.group.position.z+nz*speed;

      if(
        !blocked(tx,z.group.position.z,.55) &&
        !blocked(player.position.x,z.group.position.z,.55)
      ){
        z.group.position.x=tx;
      }

      if(
        !blocked(z.group.position.x,tz,.55) &&
        !blocked(z.group.position.x,player.position.z,.55)
      ){
        z.group.position.z=tz;
      }

      z.group.rotation.y=
        Math.atan2(nx,nz);

      const bob=
        Math.sin(z.phase*7)*.05;

      z.group.position.y=bob;
    }

    z.attack-=dt;

    if(dist<2.3 && z.attack<=0){
      hp=Math.max(0,hp-7);
      z.attack=1.1;

      const pushX=dx/(dist||1);
      const pushZ=dz/(dist||1);

      player.position.x+=pushX*.8;
      player.position.z+=pushZ*.8;
    }
  }
}

function updatePlayer(dt){

  if(activeCar){
    driveCar(activeCar);
    return;
  }

  let x=joystickX;
  let y=joystickY;

  if(keys.w||keys.arrowup) y=-1;
  if(keys.s||keys.arrowdown) y=1;
  if(keys.a||keys.arrowleft) x=-1;
  if(keys.d||keys.arrowright) x=1;

  if(Math.abs(x)>.08||Math.abs(y)>.08){
    movePlayer(x,y);
  }else{
    if(mixer){
      setAnimation(["Idle","idle"]);
    }
  }

  velocityY-=20*dt;

  player.position.y+=velocityY*dt;

  if(player.position.y<=0){
    player.position.y=0;
    velocityY=0;
    grounded=true;
  }

  const limit=145;

  player.position.x=
    THREE.MathUtils.clamp(
      player.position.x,
      -limit,
      limit
    );

  player.position.z=
    THREE.MathUtils.clamp(
      player.position.z,
      -limit,
      limit
    );
}

function updateCamera(){

  let target;

  if(activeCar){
    target=activeCar.group.position.clone();
    target.y+=1.5;
  }else{
    target=player.position.clone();

    target.y+=
      crouching?
      1.0:
      1.55;
  }

  const horizontal=
    Math.cos(camPitch)*camDistance;

  const offset=new THREE.Vector3(
    Math.sin(camYaw)*horizontal,
    Math.sin(camPitch)*camDistance,
    Math.cos(camYaw)*horizontal
  );

  const desired=target.clone().add(offset);

  const ray=new THREE.Raycaster();

  const direction=
    desired.clone().sub(target);

  const length=direction.length();

  direction.normalize();

  ray.set(target,direction);

  const objects=[
    ...scene.children.filter(o=>
      o!==ground &&
      o!==player &&
      o!==activeCar?.group
    )
  ];

  const hits=ray.intersectObjects(objects,true);

  targetCamDistance=camDistance;

  if(hits.length && hits[0].distance<length){
    targetCamDistance=Math.max(
      .9,
      hits[0].distance-.45
    );
  }

  camDistance+=
    (targetCamDistance-camDistance)*.2;

  const finalHorizontal=
    Math.cos(camPitch)*camDistance;

  const finalOffset=new THREE.Vector3(
    Math.sin(camYaw)*finalHorizontal,
    Math.sin(camPitch)*camDistance,
    Math.cos(camPitch)*0
  );

  finalOffset.y=
    Math.sin(camPitch)*camDistance;

  finalOffset.x=
    Math.sin(camYaw)*finalHorizontal;

  finalOffset.z=
    Math.cos(camYaw)*finalHorizontal;

  camera.position.copy(
    target.clone().add(finalOffset)
  );

  camera.lookAt(target);
}

function updateHUD(){
  document.getElementById("hpFill").style.width=
    hp+"%";

  document.getElementById("foodFill").style.width=
    hunger+"%";

  if(hp<=0){
    document.getElementById("status").textContent=
      "KAMU JATUH";
  }

  const zombie=nearestZombie();
  const pickup=nearestPickup();
  const car=nearestCar();

  if(activeCar){
    document.getElementById("actionBtn").textContent=
      "DRIVE";
  }else if(zombie){
    document.getElementById("actionBtn").textContent=
      "👊";
  }else if(pickup){
    document.getElementById("actionBtn").textContent=
      "AMBIL";
  }else if(car){
    document.getElementById("actionBtn").textContent=
      "MASUK";
  }else{
    document.getElementById("actionBtn").textContent=
      "👊";
  }
}

function updateHunger(dt){
  hungerTimer+=dt;

  if(hungerTimer>8){
    hungerTimer=0;
    hunger=Math.max(0,hunger-1);

    if(hunger<=0){
      hp=Math.max(0,hp-2);
    }
  }
}

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

let joyPointer=null;

function updateJoystick(clientX,clientY){
  const r=joystick.getBoundingClientRect();

  const cx=r.left+r.width/2;
  const cy=r.top+r.height/2;

  let dx=clientX-cx;
  let dy=clientY-cy;

  const max=48;

  const len=Math.hypot(dx,dy);

  if(len>max){
    dx=dx/len*max;
    dy=dy/len*max;
  }

  stick.style.transform=
    `translate(${dx}px,${dy}px)`;

  joystickX=dx/max;
  joystickY=dy/max;
}

function resetJoystick(){
  joyPointer=null;

  stick.style.transform=
    "translate(0,0)";

  joystickX=0;
  joystickY=0;
}

joystick.addEventListener("pointerdown",e=>{
  joyPointer=e.pointerId;
  joystick.setPointerCapture(e.pointerId);
  updateJoystick(e.clientX,e.clientY);
});

joystick.addEventListener("pointermove",e=>{
  if(e.pointerId===joyPointer){
    updateJoystick(e.clientX,e.clientY);
  }
});

joystick.addEventListener("pointerup",resetJoystick);
joystick.addEventListener("pointercancel",resetJoystick);

renderer.domElement.addEventListener("pointerdown",e=>{
  if(e.clientX<innerWidth*.42) return;

  cameraDragging=true;
  lastTouchX=e.clientX;
  lastTouchY=e.clientY;
});

renderer.domElement.addEventListener("pointermove",e=>{
  if(!cameraDragging) return;

  const dx=e.clientX-lastTouchX;
  const dy=e.clientY-lastTouchY;

  lastTouchX=e.clientX;
  lastTouchY=e.clientY;

  camYaw-=dx*.006;
  camPitch-=dy*.005;

  camPitch=THREE.MathUtils.clamp(
    camPitch,
    -1.15,
    1.05
  );
});

renderer.domElement.addEventListener("pointerup",()=>{
  cameraDragging=false;
});

renderer.domElement.addEventListener("pointercancel",()=>{
  cameraDragging=false;
});

document.getElementById("jumpBtn").addEventListener(
  "pointerdown",
  jump
);

document.getElementById("crouchBtn").addEventListener(
  "pointerdown",
  toggleCrouch
);

document.getElementById("sprintBtn").addEventListener(
  "pointerdown",
  ()=>sprinting=true
);

document.getElementById("sprintBtn").addEventListener(
  "pointerup",
  ()=>sprinting=false
);

document.getElementById("sprintBtn").addEventListener(
  "pointercancel",
  ()=>sprinting=false
);

document.getElementById("actionBtn").addEventListener(
  "pointerdown",
  ()=>{
    if(activeCar){
      return;
    }

    doAction();
  }
);

document.getElementById("enterBtn").addEventListener(
  "pointerdown",
  ()=>{
    if(!activeCar){
      const car=nearestCar();

      if(car){
        enterCar(car);
      }
    }
  }
);

document.getElementById("exitBtn").addEventListener(
  "pointerdown",
  exitCar
);

document.getElementById("fullscreen").addEventListener(
  "click",
  async()=>{
    try{
      if(!document.fullscreenElement){
        await document.documentElement.requestFullscreen();
      }else{
        await document.exitFullscreen();
      }
    }catch(e){}
  }
);

document.getElementById("exitBtn").style.display="none";

function animate(){

  requestAnimationFrame(animate);

  const dt=Math.min(
    clock.getDelta(),
    .05
  );

  if(mixer){
    mixer.update(dt);
  }

  actionCooldown=Math.max(
    0,
    actionCooldown-dt
  );

  updatePlayer(dt);
  updateZombies(dt);
  updateHunger(dt);
  updateCamera();
  updateHUD();

  renderer.render(scene,camera);
}

window.addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(
    innerWidth,
    innerHeight
  );
});

animate();

setTimeout(()=>{
  if(
    document.getElementById("loading").style.display!=="none"
  ){
    setupFallback();

    document.getElementById("loading").style.display=
      "none";
  }
},10000);

</script>
