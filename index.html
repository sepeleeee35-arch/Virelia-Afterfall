<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Virelia: Afterfall</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111}
body{font-family:Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;top:14px;left:14px;color:white;font-weight:bold;font-size:14px;z-index:5;text-shadow:0 2px 5px #000}
#prompt{position:fixed;top:12%;left:50%;transform:translateX(-50%);color:white;font-weight:bold;text-shadow:0 2px 5px #000;z-index:5}
#cameraHint{position:fixed;top:14px;right:14px;color:#ddd;font-size:12px;text-shadow:0 2px 4px #000;z-index:5}
#joystick{position:fixed;left:24px;bottom:24px;width:130px;height:130px;border-radius:50%;background:#0008;border:2px solid #fff3;z-index:10;touch-action:none}
#stick{position:absolute;width:58px;height:58px;left:34px;top:34px;border-radius:50%;background:#aaa9}
#actions{position:fixed;right:24px;bottom:24px;z-index:10;display:flex;gap:12px}
button{width:82px;height:82px;border-radius:50%;border:2px solid #fff3;background:#111b;color:white;font-weight:bold}
#error{position:fixed;inset:0;background:#090b09;color:white;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:100}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">HP 100<br>HUNGER 100<br>DAY 1</div>
<div id="prompt"></div>
<div id="cameraHint">GESER SISI KANAN = KAMERA</div>

<div id="joystick">
<div id="stick"></div>
</div>

<div id="actions">
<button id="interact">INTERACT</button>
<button id="full">⛶</button>
</div>

<div id="error">
<div>
<h2>Virelia gagal memuat</h2>
<p id="errorText"></p>
</div>
</div>

<script type="module">

const errorBox=document.getElementById("error");
const errorText=document.getElementById("errorText");

async function start(){

try{

const THREE=await import("https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js");

const canvas=document.getElementById("game");
const scene=new THREE.Scene();

scene.background=new THREE.Color(0x202820);
scene.fog=new THREE.Fog(0x202820,70,260);

const camera=new THREE.PerspectiveCamera(
68,
innerWidth/innerHeight,
0.1,
500
);

const renderer=new THREE.WebGLRenderer({
canvas,
antialias:true
});

renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);

scene.add(new THREE.HemisphereLight(0xffffff,0x263326,2.2));

const sun=new THREE.DirectionalLight(0xffffff,2.4);
sun.position.set(40,80,30);
scene.add(sun);

const ground=new THREE.Mesh(
new THREE.PlaneGeometry(260,200),
new THREE.MeshStandardMaterial({color:0x394638,roughness:1})
);

ground.rotation.x=-Math.PI/2;
scene.add(ground);

const buildings=[];
const trees=[];
const cars=[];

function building(x,z,w,d,h,color){

const mesh=new THREE.Mesh(
new THREE.BoxGeometry(w,h,d),
new THREE.MeshStandardMaterial({
color,
roughness:.9
})
);

mesh.position.set(x,h/2,z);
scene.add(mesh);

buildings.push({
x,
z,
w,
d
});

const roof=new THREE.Mesh(
new THREE.BoxGeometry(w+.3,.25,d+.3),
new THREE.MeshStandardMaterial({color:0x333333})
);

roof.position.set(x,h+.12,z);
scene.add(roof);

}

for(const x of [-55,25]){
for(const z of [-82,-42,22,62]){
building(x,z,28,22,10,0x77736a);
}
}

for(const x of [-105,105]){
for(const z of [-30,30]){
building(x,z,22,26,10,0x666c65);
}
}

function makeTree(x,z){

const trunk=new THREE.Mesh(
new THREE.CylinderGeometry(0.8,1,4,8),
new THREE.MeshStandardMaterial({color:0x60472d})
);

trunk.position.set(x,2,z);
scene.add(trunk);

const crown=new THREE.Mesh(
new THREE.SphereGeometry(4.5,14,14),
new THREE.MeshStandardMaterial({color:0x315c32})
);

crown.position.set(x,6,z);
scene.add(crown);

trees.push({x,z,r:5});

}

makeTree(-105,-75);
makeTree(-105,75);
makeTree(105,-75);
makeTree(105,75);
makeTree(-35,80);
makeTree(35,-80);

function makeCar(x,z,color){

const g=new THREE.Group();

const body=new THREE.Mesh(
new THREE.BoxGeometry(5,1.4,8),
new THREE.MeshStandardMaterial({
color,
roughness:.7
})
);

body.position.y=1.1;
g.add(body);

const cabin=new THREE.Mesh(
new THREE.BoxGeometry(3.8,1.2,4),
new THREE.MeshStandardMaterial({
color:0x20252a,
roughness:.5
})
);

cabin.position.y=2.2;
g.add(cabin);

g.position.set(x,0,z);
scene.add(g);

cars.push({
mesh:g,
x,
z,
r:4
});

}

makeCar(-20,60,0xd5b52c);
makeCar(20,-60,0xb83a35);
makeCar(-80,-20,0x3d6ca8);
makeCar(80,20,0x777777);

const player=new THREE.Group();

const skin=new THREE.MeshStandardMaterial({
color:0xc58d68,
roughness:.8
});

const shirt=new THREE.MeshStandardMaterial({
color:0x30485c,
roughness:.9
});

const pants=new THREE.MeshStandardMaterial({
color:0x202631,
roughness:.9
});

const shoes=new THREE.MeshStandardMaterial({
color:0x111317,
roughness:.8
});

const torso=new THREE.Mesh(
new THREE.CapsuleGeometry(.72,1.35,6,12),
shirt
);

torso.position.y=2.25;
player.add(torso);

const head=new THREE.Mesh(
new THREE.SphereGeometry(.62,20,20),
skin
);

head.position.y=3.95;
player.add(head);

const hair=new THREE.Mesh(
new THREE.SphereGeometry(.64,16,16),
new THREE.MeshStandardMaterial({color:0x202020,roughness:1})
);

hair.scale.set(1,0.55,1);
hair.position.set(0,4.28,0);
player.add(hair);

function limb(w,h,d,material,x,y,z){

const m=new THREE.Mesh(
new THREE.CapsuleGeometry(Math.min(w,d)/2,h*.55,5,8),
material
);

m.scale.x=w/Math.min(w,d);
m.scale.z=d/Math.min(w,d);
m.position.set(x,y,z);
player.add(m);

}

limb(.38,1.6,.38,skin,-.98,2.35,0);
limb(.38,1.6,.38,skin,.98,2.35,0);

limb(.48,1.8,.48,pants,-.38,.75,0);
limb(.48,1.8,.48,pants,.38,.75,0);

const shoe1=new THREE.Mesh(
new THREE.BoxGeometry(.55,.25,.9),
shoes
);

shoe1.position.set(-.38,.05,-.12);
player.add(shoe1);

const shoe2=shoe1.clone();
shoe2.position.x=.38;
player.add(shoe2);

player.position.set(0,0,20);
scene.add(player);

const playerRadius=1.1;

const zombies=[];

for(let i=0;i<6;i++){

const z=new THREE.Group();

const body=new THREE.Mesh(
new THREE.CapsuleGeometry(.55,1.2,5,10),
new THREE.MeshStandardMaterial({color:0x596556})
);

body.position.y=1.7;
z.add(body);

const head=new THREE.Mesh(
new THREE.SphereGeometry(.48,14,14),
new THREE.MeshStandardMaterial({color:0x78806d})
);

head.position.y=3.05;
z.add(head);

z.position.set(
[-100,-70,70,100,45,-45][i],
0,
[-20,40,-35,35,75,-75][i]
);

scene.add(z);
zombies.push(z);

}

function blocked(x,z){

if(x<-124||x>124||z<-94||z>94)return true;

for(const b of buildings){

if(
x> b.x-b.w/2-playerRadius &&
x< b.x+b.w/2+playerRadius &&
z> b.z-b.d/2-playerRadius &&
z< b.z+b.d/2+playerRadius
)return true;

}

for(const t of trees){

if(Math.hypot(x-t.x,z-t.z)<t.r+playerRadius)
return true;

}

for(const c of cars){

if(Math.hypot(x-c.x,z-c.z)<c.r+playerRadius)
return true;

}

return false;

}

const keys={};

addEventListener("keydown",e=>{
keys[e.key.toLowerCase()]=true;
});

addEventListener("keyup",e=>{
keys[e.key.toLowerCase()]=false;
});

let joyX=0;
let joyY=0;

const joy=document.getElementById("joystick");
const stick=document.getElementById("stick");

function updateJoystick(e){

const r=joy.getBoundingClientRect();

let x=e.clientX-r.left-r.width/2;
let y=e.clientY-r.top-r.height/2;

const max=45;
const len=Math.hypot(x,y);

if(len>max){
x=x/len*max;
y=y/len*max;
}

stick.style.transform=`translate(${x}px,${y}px)`;

joyX=x/max;
joyY=y/max;

}

joy.addEventListener("pointerdown",e=>{
joy.setPointerCapture(e.pointerId);
updateJoystick(e);
});

joy.addEventListener("pointermove",e=>{
if(e.buttons)updateJoystick(e);
});

joy.addEventListener("pointerup",()=>{
joyX=0;
joyY=0;
stick.style.transform="translate(0,0)";
});

let cameraYaw=0;
let cameraPitch=.35;

let cameraPointer=null;

canvas.addEventListener("pointerdown",e=>{

if(e.clientX<innerWidth*.45)return;

cameraPointer={
id:e.pointerId,
x:e.clientX,
y:e.clientY
};

canvas.setPointerCapture(e.pointerId);

});

canvas.addEventListener("pointermove",e=>{

if(!cameraPointer)return;
if(e.pointerId!==cameraPointer.id)return;

const dx=e.clientX-cameraPointer.x;
const dy=e.clientY-cameraPointer.y;

cameraYaw-=dx*.006;
cameraPitch-=dy*.004;

cameraPitch=Math.max(.12,Math.min(.75,cameraPitch));

cameraPointer.x=e.clientX;
cameraPointer.y=e.clientY;

});

canvas.addEventListener("pointerup",()=>{
cameraPointer=null;
});

canvas.addEventListener("pointercancel",()=>{
cameraPointer=null;
});

document.getElementById("full").onclick=()=>{
if(document.documentElement.requestFullscreen)
document.documentElement.requestFullscreen();
};

function movePlayer(){

let inputX=joyX;
let inputY=joyY;

if(keys.w||keys.arrowup)inputY=-1;
if(keys.s||keys.arrowdown)inputY=1;
if(keys.a||keys.arrowleft)inputX=-1;
if(keys.d||keys.arrowright)inputX=1;

const length=Math.hypot(inputX,inputY);

if(length<.05)return;

inputX/=length;
inputY/=length;

const speed=.18;

const forwardX=-Math.sin(cameraYaw);
const forwardZ=-Math.cos(cameraYaw);

const rightX=Math.cos(cameraYaw);
const rightZ=-Math.sin(cameraYaw);

const moveX=
forwardX*(-inputY)+
rightX*inputX;

const moveZ=
forwardZ*(-inputY)+
rightZ*inputX;

const nextX=player.position.x+moveX*speed;
const nextZ=player.position.z+moveZ*speed;

if(!blocked(nextX,player.position.z))
player.position.x=nextX;

if(!blocked(player.position.x,nextZ))
player.position.z=nextZ;

player.rotation.y=Math.atan2(moveX,moveZ);

}

function updateZombies(){

for(const z of zombies){

const dx=player.position.x-z.position.x;
const dz=player.position.z-z.position.z;
const d=Math.hypot(dx,dz);

if(d<3||d>100)continue;

const nx=z.position.x+(dx/d)*.025;
const nz=z.position.z+(dz/d)*.025;

if(!blocked(nx,nz)){
z.position.x=nx;
z.position.z=nz;
}

z.rotation.y=Math.atan2(dx,dz);

}

}

function updateCamera(){

const distance=8;
const height=4.8;

const targetX=player.position.x;
const targetY=player.position.y+2.1;
const targetZ=player.position.z;

const offsetX=Math.sin(cameraYaw)*distance;
const offsetZ=Math.cos(cameraYaw)*distance;

const desiredX=targetX+offsetX;
const desiredZ=targetZ+offsetZ;

const desiredY=targetY+height+cameraPitch*3;

camera.position.x+=(desiredX-camera.position.x)*.12;
camera.position.y+=(desiredY-camera.position.y)*.12;
camera.position.z+=(desiredZ-camera.position.z)*.12;

camera.lookAt(targetX,targetY,targetZ);

}

function animate(){

requestAnimationFrame(animate);

movePlayer();
updateZombies();
updateCamera();

renderer.render(scene,camera);

}

addEventListener("resize",()=>{

camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);

});

animate();

}catch(e){

console.error(e);
errorBox.style.display="flex";
errorText.textContent=e.message;

}

}

start();

</script>
</body>
</html>
